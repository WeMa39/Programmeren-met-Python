<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Oefeningen</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#dde2ea;
  --brand:#1f4e79; --brand-soft:#e3edf7; --accent:#d66028;
  --ok:#1e7a46; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe7e5; --warn-soft:#fff3e3;
  --code-bg:#f1f3f6; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
    --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
    --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
    --code-bg:#262c37;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
  --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
  --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
  --code-bg:#262c37;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;color:var(--brand);flex:1;min-width:160px;cursor:pointer}
.top button.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);cursor:pointer}
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px}
h2{color:var(--brand);font-size:24px;margin:4px 0 6px;line-height:1.25}
h3{color:var(--brand);font-size:19px;margin:0 0 8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.box{border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--brand-soft)}
.box.warm{background:var(--warn-soft)}
.box b:first-child{color:var(--brand)}
code,pre{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:14.5px}
code{background:var(--code-bg);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft)}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:var(--card);text-decoration:none}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.hint{background:var(--warn-soft);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.fb.info{display:block;background:var(--brand-soft);color:var(--ink)}
.fb .ex{color:var(--ink);margin-top:6px}
.out{white-space:pre-wrap;background:#0f1720;color:#d6e2f0;border-radius:8px;padding:10px 12px;margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;display:none;max-height:300px;overflow:auto}
.out .errl{color:#ffb4a8}
.ed{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);overflow:hidden}
.ed:focus-within{border-color:var(--brand)}
.gut{padding:10px 8px 10px 10px;text-align:right;color:var(--muted);user-select:none;min-width:2.6em;white-space:pre;overflow:hidden;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;border-right:1px solid var(--line)}
.ed textarea{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px;min-height:140px;resize:vertical;white-space:pre;overflow:auto;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;tab-size:4;outline:none}
.stdin{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--brand-soft);display:none}
.stdin textarea{width:100%;min-height:56px;font:14px ui-monospace,Consolas,monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.step{border-left:4px solid var(--line);padding-left:14px}
.step.done{border-left-color:var(--ok)}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--accent)}
.hintbox b{color:var(--accent)}
.score{font-size:44px;font-weight:700;color:var(--brand);line-height:1}
.line{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.line span:last-child{margin-left:auto;white-space:nowrap;font-weight:600}
.exlist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);padding:12px 14px;border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;margin:8px 0}
.exlist button:hover:not(:disabled){border-color:var(--brand)}
.exlist button:disabled{opacity:.55;cursor:default}
.exlist .t{flex:1;font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--accent)}
.pill.off{background:var(--line);color:var(--muted)}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.formrow label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.flow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;text-align:center}
.flow img{max-width:100%;height:auto}
.wereld{margin:12px 0}
.stage{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#cfe8f7;min-height:120px}
.sits{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:14px}
.sits span{font-weight:700;color:var(--muted)}
.sits button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.sits button.aan{background:var(--brand);color:var(--card);border-color:var(--brand)}
table.api{margin:10px 0;font-size:14.5px}
table.api code{word-break:break-word}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;font-size:15.5px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 12px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button.aan{color:var(--brand);border-bottom-color:var(--brand)}
.tel{font-size:12.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 8px;white-space:nowrap}
.voortgang{margin:0 0 14px}
.vg-tekst{font-size:14px;color:var(--muted);margin-bottom:5px}
.vg-balk{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.vg-balk div{height:100%;background:var(--ok);border-radius:999px}
details.hfd{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}
details.hfd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:700}
details.hfd summary::-webkit-details-marker{display:none}
details.hfd summary::after{content:"▾";margin-left:6px;color:var(--muted);transition:transform .15s}
details.hfd:not([open]) summary::after{transform:rotate(-90deg)}
.hfd-nr{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--card);display:grid;place-items:center;font-size:15px}
.hfd-t{flex:1}
details.hfd .exlist{padding:0 12px 6px}
details.hfd .exlist button{margin:0 0 8px;padding:10px 12px}
.w-intro{margin:0 0 12px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wtegel{border:1px solid var(--line);border-top:5px solid var(--wk);border-radius:12px;padding:12px;background:var(--card)}
.w-kop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.w-icoon{font-size:30px;line-height:1}
.w-kop>div{flex:1}
.w-naam{font-weight:800;color:var(--ink)}
.w-sub{font-size:13px;color:var(--muted)}
.w-levels{display:flex;flex-direction:column;gap:6px}
.lvl-lus{font-size:11.5px;font-weight:600;color:#6a4fb3;background:#efeafd;border-radius:999px;padding:1px 8px;white-space:nowrap}
.lvl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.lvl:hover{border-color:var(--wk)}
.lvl-nr{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card);border:2px solid var(--wk);color:var(--wk)}
.lvl.verstuurd .lvl-nr{background:var(--ok);border-color:var(--ok);color:var(--card)}
.lvl.klaar .lvl-nr,.lvl.bezig .lvl-nr{background:var(--warn-soft);border-color:var(--accent);color:var(--accent)}
.lvl-t{flex:1;font-weight:600}
.lvl-c{font-size:12.5px;font-weight:700;color:var(--ok)}
.lvl-c.mid{color:var(--accent)}
details.afspraken-kaart summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:17px}
@media (max-width:640px){ .wgrid{grid-template-columns:1fr} .tabs button{font-size:14.5px;padding:8px 8px} }
.card{scroll-margin-top:72px}
.delen-uitleg{margin:0 0 16px;padding:12px 16px;border-radius:10px;background:var(--brand-soft);font-size:15px}
.beeld{margin:12px 0 4px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.beeld svg{display:block;width:100%;height:auto}
select.mist,input.mist{border:2px solid var(--bad);background:var(--bad-soft)}
ul.stijl{margin:6px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
ul.stijl li{margin:3px 0}
details.afspraken{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--card)}
details.afspraken summary{cursor:pointer;font-weight:700;color:var(--brand)}
.afspr{font-size:15px}
.afspr li{margin:6px 0}
.afspr .ok,.afspr .nok{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;padding:1px 6px;border-radius:5px;margin:2px 4px 0 0}
.afspr .ok{background:var(--ok-soft);color:var(--ok)}
.afspr .nok{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
@media (max-width:560px){ h2{font-size:21px} .card{padding:14px} }
</style>
</head>

<header>
  <div class="top">
    <h1 id="home">Python Oefeningen</h1>
    <span id="who" style="color:var(--muted);font-size:14px"></span>
    <a href="index.html" title="Terug naar de startpagina met beide cursussen" style="text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap">⌂ Alle cursussen</a>
    <button class="theme" id="themeBtn" title="Licht of donker scherm">◐ Thema</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ================================================================
   INSTELLINGEN VOOR DE LEERKRACHT  (deze mag je aanpassen)
   ================================================================ */

/* 1. Plak hier de vooringevulde link van je Microsoft Form
      (zie de handleiding). Laat leeg ("") om te testen zonder Form. */

/* 2. Klassen. Vul de namen in als je wilt dat leerlingen hun naam
      uit een lijst kiezen (aangeraden: dan zijn er geen tikfouten).
      Laat de lijst leeg [] om leerlingen hun naam zelf te laten typen.
      Gebruik dezelfde schrijfwijze als in je Excel-klaslijst. */
const KLASSEN = {
  "403": [],
  "423": []
};

/* 3. Cijferregels */
const CIJFER = {
  start: 10,              // elke oefening start op 10
  gratisControles: 2,     // de eerste 2 keer "Controleer" zijn gratis
  perExtraControle: 0.5,  // daarna kost elke poging 0,5
  maxAftrekPogingen: 3,   // maximaal 3 punten aftrek voor pogingen
  hulpKost: [1, 1.5, 2],  // kost van hulp 1, hulp 2 en hulp 3 (opgeteld)
  deelHulpKost: [0.5, 1], // kost van de hulp bij oefeningen met deelopdrachten (per deel)
  perAfspraak: 0.25,      // aftrek per overtreding van de klasafspraken
  minimum: 4,             // wie correct eindigt, krijgt minstens dit
  bonusExtra: 1,          // extra uitdaging correct = + dit
  maximum: 10
};

/* 4. Klasafspraken voor het schrijven van code.
      true  = "✓ Controleer" keurt pas goed als de code de afspraken volgt.
      false = de afspraken worden niet nagekeken. */
const KLASAFSPRAKEN = true;

const APP_ID = "python-oefeningen-v1";

   Elke oefening: titel (exact zoals in het Excel-overzicht), opdracht,
   stappen, hoofdopdracht met tests en hulp, en een extra uitdaging. */

/* Python-code van de programmeerwerelden (wordt vóór de code van de leerling geladen) */
const WERELD_PY=String.raw`import sys, types, json


class WereldFout(Exception):
    pass


_W = {"sc": json.loads(_WSC), "log": [], "staat": {}}
_SC = _W["sc"]
_ST = _W["staat"]
_LUSMSG = "Je programma blijft maar bevelen geven en werd gestopt. Zit je in een oneindige lus? Controleer wanneer je while-lus stopt."


_W["n"] = 0


def _tel():
    _W["n"] = _W["n"] + 1
    if _W["n"] > 20000:
        _W["log"].append({"t": "fout", "msg": _LUSMSG})
        raise WereldFout(_LUSMSG)


def _ev(**k):
    _tel()
    if len(_W["log"]) > 2500:
        _W["log"].append({"t": "fout", "msg": _LUSMSG})
        raise WereldFout(_LUSMSG)
    _W["log"].append(k)


def _fout(msg):
    _ev(t="fout", msg=msg)
    raise WereldFout(msg)


def _getal(n, wat):
    if isinstance(n, bool):
        _fout(wat + " verwacht een getal.")
    if isinstance(n, str):
        _fout(wat + " verwacht een getal, maar je gaf tekst ('" + n + "'). Zet de tekst eerst om met int().")
    if isinstance(n, float):
        if n == int(n):
            return int(n)
        _fout(wat + " verwacht een geheel getal, geen kommagetal (" + str(n) + ").")
    if not isinstance(n, int):
        _fout(wat + " verwacht een getal.")
    return n


def _wereld_json():
    return json.dumps({"log": _W["log"], "staat": _W["staat"]})


# ---------------- De Havenkraan ----------------
class _Kraan:
    def __init__(self):
        self.pos = 0
        self.vast = None
        rij = _SC.get("rij")
        if rij is None:
            rij = [{"kleur": _SC.get("kleur", "rood"), "gewicht": _SC.get("gewicht", 10)}]
        self.rij = rij
        self.kade = list(range(len(rij)))
        _ST["geplaatst"] = None
        _ST["gepakt"] = False
        _ST["schepen"] = {}
        _ST["over"] = len(rij)
        _ST["vast"] = None

    def _boven(self):
        if self.vast is not None:
            return self.rij[self.vast]
        if self.kade:
            return self.rij[self.kade[-1]]
        _fout("Er staan geen containers meer op de kade.")

    def _rijd(self, stappen, richting):
        n = _getal(stappen, richting + "()")
        if n < 0:
            ander = "links()" if richting == "rechts" else "rechts()"
            _fout("Gebruik een positief getal. Wil je de andere kant op, gebruik dan " + ander + ".")
        for i in range(n):
            nieuw = self.pos + (1 if richting == "rechts" else -1)
            if nieuw < 0 or nieuw > 7:
                _fout("De kraan rijdt van de rails! De rails lopen van vak 0 tot vak 7.")
            self.pos = nieuw
            _ev(t="pos", v=self.pos)

    def rechts(self, stappen=1):
        self._rijd(stappen, "rechts")

    def links(self, stappen=1):
        self._rijd(stappen, "links")

    def aantal_op_kade(self):
        _tel()
        return len(self.kade)

    def pak(self):
        if self.vast is not None:
            _fout("De kraan heeft al een container vast.")
        if self.pos != 0:
            _fout("Hier staat geen container: de kraan staat op vak " + str(self.pos) + ", maar de containers staan op de kade, op vak 0.")
        if not self.kade:
            _fout("Er staan geen containers meer op de kade.")
        c = self.rij[self.kade[-1]]
        if c.get("gewicht", 0) > _SC.get("max", 999):
            _ev(t="te_zwaar")
            _fout("De kraan kan deze container niet tillen: hij weegt " + str(c["gewicht"]) + " ton en de kraan kan maximaal " + str(_SC["max"]) + " ton tillen.")
        self.vast = self.kade.pop()
        _ST["vast"] = self.vast
        _ST["gepakt"] = True
        _ST["over"] = len(self.kade)
        _ev(t="pak")

    def zet(self):
        if self.vast is None:
            _fout("De kraan heeft geen container vast. Gebruik eerst kraan.pak().")
        if self.pos not in _SC.get("schepen", []):
            _ev(t="plons")
            self.vast = None
            _ST["vast"] = None
            _fout("Plons! Op vak " + str(self.pos) + " ligt geen schip: de container valt in het water.")
        _ST["schepen"].setdefault(str(self.pos), []).append(self.vast)
        _ST["geplaatst"] = self.pos
        self.vast = None
        _ST["vast"] = None
        _ev(t="zet")

    def lees_kleur(self):
        _tel()
        return self._boven()["kleur"]

    def lees_afstand(self):
        _tel()
        return str(_SC["afstand"])

    def lees_gewicht(self):
        _tel()
        return str(self._boven()["gewicht"])

class _Trein:
    def __init__(self):
        rij = _SC.get("treinen")
        if rij is None:
            rij = [{"bestemming": _SC.get("bestemming", "Gent"), "wagons": _SC.get("wagons", 4)}]
        self.rij = rij
        self.i = 0
        self.wachten = 0
        _ST["vertrokken"] = False
        _ST["spoor"] = None
        _ST["ritten"] = []
        _ST["gewacht"] = 0

    def _huidig(self):
        if self.i >= len(self.rij):
            _fout("Er staat geen trein meer in het station.")
        return self.rij[self.i]

    def aantal_wachtend(self):
        _tel()
        return len(self.rij) - self.i

    def lees_bestemming(self):
        _tel()
        return self._huidig()["bestemming"]

    def lees_wagons(self):
        return str(self._huidig()["wagons"])

    def wacht(self):
        self._huidig()
        self.wachten = self.wachten + 1
        _ST["gewacht"] = self.wachten
        _ev(t="wacht")

class _Robot:
    def __init__(self):

        if p is None:

        n = _getal(n, "rem()")

            _fout("rem() verwacht een positief getal. Wil je sneller, gebruik dan versnel().")

        _ST["snelheid"] = self.v

        n = _getal(n, "versnel()")
        if n < 0:
            _fout("versnel() verwacht een positief getal. Wil je trager, gebruik dan rem().")
        if self.v + n > 130:

    def stop(self):

    def rij(self):

verkeer:{
  frames(sc,log){ let st={x:30,v:sc.snelheid,l:sc.brandstof,tank:false,uitroep:false,licht:sc.licht,wacht:0,km:0};

      if(e.t==="snelheid"){ const a=st.v; for(let k=1;k<=6;k++) push({v:Math.round(lerp(a,e.v,k/6))}); for(let k=0;k<3;k++) push({}) }
      else if(e.t==="tank"){ const a=st.l; push({tank:true}); for(let k=1;k<=6;k++) push({l:Math.round(lerp(a,e.v,k/6))}); push({tank:false}) }
      else if(e.t==="wacht"){ push({wacht:st.wacht+1}); for(let k=0;k<5;k++) push({}); push({licht:e.licht}); for(let k=0;k<2;k++) push({}) }
      else if(e.t==="stop"){ const a=st.x; for(let k=1;k<=20;k++) push({x:lerp(a,300,Math.sin(k/20*Math.PI/2))}) }
      else if(e.t==="rijd"){ const a=st.x; for(let k=1;k<=30;k++) push({x:lerp(a,515,k/30)}) }
      else if(e.t==="rij"){ const a=st.x, b=xKm(e.km); for(let k=1;k<=5;k++) push({x:lerp(a,b,k/5)}); push({km:e.km,l:e.l}) }
      else if(e.t==="leeg"){ const a=st.x, b=30+e.f*485; for(let k=1;k<=26;k++) push({x:lerp(a,b,Math.sin(k/26*Math.PI/2))}); push({uitroep:true}) }

  render(sc,st){

function havenDoel(sc,st,out){
  if(sc.teZwaar){ if(!/zwaar/i.test(out)) return "Deze container is te zwaar. Laat hem staan en toon met print() een melding met het woord ‘zwaar’."; return null }
  if(!st.gepakt&&/zwaar/i.test(out)) return `Deze container is niet te zwaar: de kraan kan tot en met ${sc.max} ton tillen.`;
  if(!st.gepakt) return "De kraan heeft de container nog niet opgepakt. Gebruik kraan.pak().";
  if(st.geplaatst==null) return "De container hangt nog aan de kraan. Zet hem neer met kraan.zet().";
  if(st.geplaatst!==sc.doel) return `De container staat op het schip op vak ${st.geplaatst}, maar hij moest naar ${sc.doelNaam} op vak ${sc.doel}.`;
  return null }
function stationDoel(sc,st,out){
  if(!st.vertrokken) return "De trein is niet vertrokken. Vergeet trein.rijd() niet.";
  if(st.spoor!==sc.doel) return `De trein reed naar spoor ${st.spoor} (${sc.sporen[st.spoor]}), maar moest naar spoor ${sc.doel} (${sc.sporen[sc.doel]}).`;
  if(sc.lengte!=null && !bevat(out,[sc.lengte],0.01)) return `De trein reed juist, maar ik vind de lengte van de trein (${sc.lengte} meter) niet in je uitvoer.`;
  return null }
function magazijnDoel(sc,st,out){
  if(st.bak==null) return "Het pakje ligt nog op de robot. Leg het in een bak met robot.leg().";
  if(st.bak!==sc.doel) return `Het pakje ligt in bak ${st.bak} (${sc.labels[st.bak]}), maar het moest in bak ${sc.doel} (${sc.labels[sc.doel]}).`;
  if(sc.kosten!=null && !bevat(out,[sc.kosten],0.01)) return `Het pakje ligt in de juiste bak, maar ik vind de verzendkosten (${sc.kosten} euro) niet in je uitvoer.`;
  return null }
function verkeerDoel(sc,st,out){
  if(sc.licht){
    if(!st.actie) return "De auto doet niets. Gebruik auto.rijd() of auto.stop().";
    if(sc.licht==="groen"&&st.actie!=="rijd") return "Het licht is groen: de auto mag doorrijden.";
    if(sc.licht!=="groen"&&st.actie==="rijd") return `De auto reed door het ${sc.licht==="rood"?"rode":"oranje"} licht!`;
    return null }
  if(st.actie!=="rijd") return "De auto vertrekt niet. Vergeet auto.rijd() niet.";
  if(sc.bord){ if(st.snelheid!==sc.bord) return `De auto rijdt ${st.snelheid} km/u, maar het bord zegt ${sc.bord} km/u.`; return null }
  const bereik=sc.brandstof*sc.km_per_liter, nodig=bereik<sc.afstand;
  if(st.getankt&&!nodig) return `Je tankte, maar met ${bereik} km bereik kom je al ${sc.afstand} km ver: tanken was niet nodig.`;
  if(!bevat(out,[bereik],0.01)) return `De auto kwam aan, maar ik vind het bereik (${bereik} km) niet in je uitvoer.`;
  return null }

    if(r[k]!==T[k].doel) return `Trein ${k+1} (naar ${T[k].bestemming}) reed naar spoor ${r[k]} (${sc.sporen[r[k]]}), maar moest naar spoor ${T[k].doel} (${sc.sporen[T[k].doel]}).` }
  return null }
function stationSeinDoel(sc,st,out){
  if(st.gewacht>sc.sein) return `De trein wachtte ${st.gewacht} minuten, maar het sein was al groen na ${sc.sein} ${sc.sein===1?"minuut":"minuten"}. Wacht alleen zolang het sein rood is.`;
  const f=stationDoel(sc,st,out); if(f) return f;
  if(!bevat(out,[sc.sein],0.01)) return `De trein reed juist, maar ik vind niet hoeveel minuten hij wachtte (${sc.sein}) in je uitvoer. Tel elke keer dat de trein wacht.`;
  return null }
function magazijnBandDoel(sc,st,out){ const P=sc.pakjes, B=st.bakken||[];
  const nog=B.filter(b=>b==null).length;
  if(nog) return `Er ${nog===1?"is":"zijn"} nog ${nog} ${nog===1?"pakje":"pakjes"} niet in een bak gelegd. Herhaal zolang er pakjes op de band liggen.`;
  for(let i=0;i<P.length;i++) if(B[i]!==P[i].doel) return `Het pakje ${P[i].label} ligt in bak ${B[i]} (${sc.labels[B[i]]}), maar het moest in bak ${P[i].doel} (${sc.labels[P[i].doel]}).`;
  if(sc.zwaar!=null && !bevat(out,[sc.zwaar],0.01)) return `Alle pakjes liggen juist, maar ik vind het aantal zware pakjes (${sc.zwaar}) niet in je uitvoer. Tel ze in je lus.`;
  return null }
function verkeerWachtDoel(sc,st,out){
  if(!st.actie) return "De auto vertrekt niet. Gebruik auto.rijd() als het licht groen is.";
  if(st.licht_bij_rijden!=="groen") return `De auto reed door het ${st.licht_bij_rijden==="rood"?"rode":"oranje"} licht! Wacht met auto.wacht() zolang het licht niet groen is.`;
  if(st.gewacht>sc.wachten) return `De auto wachtte ${st.gewacht} keer, maar het licht was al groen na ${sc.wachten} keer wachten.`;
  if(!bevat(out,[sc.wachten],0.01)) return `De auto reed juist, maar ik vind niet hoeveel keer hij wachtte (${sc.wachten}) in je uitvoer.`;
  return null }
function verkeerStapDoel(sc,st,out){
  if(st.actie!=="aangekomen") return `De auto is nog niet aangekomen: nog ${sc.afstand-(st.km||0)} km. Laat de auto rijden zolang de afstand groter is dan 0.`;
  if(st.risico) return `De auto reed ${st.risico} keer verder met minder dan ${sc.tank_grens} liter in de tank. Tank zodra er minder dan ${sc.tank_grens} liter in zit.`;
  if(st.onnodig) return `De auto tankte ${st.onnodig} keer terwijl er nog ${sc.tank_grens} liter of meer in de tank zat. Tank alleen als het nodig is.`;
  if(!bevat(out,[st.tank_keer],0.01)) return `De auto kwam aan, maar ik vind niet hoeveel keer hij tankte (${st.tank_keer}) in je uitvoer. Tel elke keer dat de auto tankt.`;
  return null }

  opdracht:`<p>Welkom in de haven van Antwerpen! Jij bestuurt de containerkraan. Op de kade, op vak 0, staat een container. Breng hem naar het schip op <b>vak 4</b>.</p>${API_HAVEN}`,
  hoofd:{ titel:"Programmeer de kraan", wereld:"haven",
    html:`<p>Begin je programma met <code>from haven import kraan</code>. Dan kun je de bevelen uit de tabel gebruiken.</p>`,
    starter:"from haven import kraan\n\n",
    scenarios:[hSc({naam:"rode container",schepen:[4],namen:{4:"Schip A"},doel:4,doelNaam:"schip A",paneel:"Breng de container naar vak 4."})],
    doel:havenDoel,
    moet:[[/from\s+haven\s+import\s+kraan/, "Begin met: from haven import kraan"]],
    hulp:["Welke drie dingen moet de kraan doen? Denk aan: oppakken, rijden, neerzetten.","Gebruik kraan.pak(), daarna kraan.rechts(...) met het juiste aantal vakken, en tot slot kraan.zet().","Zo kan het:<pre>"+regNaam+"from haven import kraan\n\nkraan.pak()\nkraan.rechts(4)\nkraan.zet()</pre>"],
    ok:"De container staat op het schip. Je eerste lading is binnen!" } }),
wLevel({ id:"H2", groep:"🏗️ De Havenkraan", titel:"Haven 2 - Lees de afstand",
  opdracht:`<p>Het schip ligt niet altijd op dezelfde plaats. De kraan kan de <b>afstand</b> tot het schip lezen met <code>kraan.lees_afstand()</code>. Maar let op: die afstand komt binnen als <b>tekst</b>.</p>${API_HAVEN}`,
  hoofd:{ titel:"Programmeer de kraan", wereld:"haven",
    html:`<p>Lees de afstand, zet ze om naar een getal en rijd zo ver naar rechts.</p>`,
    starter:"from haven import kraan\n\n",
    scenarios:[3,5,7,2].map((a,i)=>hSc({naam:`schip op ${a} vakken`,schepen:[a],namen:{[a]:"Schip"},doel:a,doelNaam:"het schip",afstand:a,kleur:["rood","blauw","groen","geel"][i],paneel:`📟 Afstand tot het schip: ${a}`})),
    doel:havenDoel,
    moet:[[/lees_afstand\s*\(/, "Lees de afstand met kraan.lees_afstand(): het schip ligt telkens ergens anders."]],
    hulp:["Een vast getal in kraan.rechts() werkt maar in één situatie. Hoe gebruik je de afstand die de kraan leest?","kraan.lees_afstand() geeft tekst, zoals bij input(). Zet ze om met int() en bewaar ze in een variabele: <code>afstand = int(kraan.lees_afstand())</code>.","Zo kan het:<pre>"+regNaam+"from haven import kraan\n\nafstand = int(kraan.lees_afstand())\nkraan.pak()\nkraan.rechts(afstand)\nkraan.zet()</pre>"],
    ok:"Je kraan vindt het schip, waar het ook ligt!" } }),
wLevel({ id:"H3", groep:"🏗️ De Havenkraan", titel:"Haven 3 - Rood of niet",
  opdracht:`<p>Er liggen twee schepen. <b>Rode</b> containers gaan naar <b>schip A</b> op vak 2. Alle <b>andere</b> containers gaan naar <b>schip B</b> op vak 6.</p>${API_HAVEN}`,
  hoofd:{ titel:"Programmeer de kraan", wereld:"haven",
    html:`<p>Lees de kleur en laat je programma kiezen met <code>if</code> en <code>else</code>.</p>`,
    starter:"from haven import kraan\n\n",
    scenarios:[["rood",2,"schip A"],["blauw",6,"schip B"],["groen",6,"schip B"]].map(([k,d,n])=>hSc({naam:`${k}e container`.replace("roode","rode").replace("blauwe","blauwe"),kleur:k,schepen:[2,6],namen:H_SCHEPEN3,doel:d,doelNaam:n,paneel:`📟 Kleur: ${k}`})),
    doel:havenDoel,
    moet:[[/lees_kleur\s*\(/, "Lees de kleur met kraan.lees_kleur()."],[/^\s*if\b/m,"Gebruik een if om de kleur te controleren."],[/^\s*else\b/m,"Gebruik een else voor alle andere kleuren."]],
    hulp:["Wat moet de kraan altijd doen, en wat hangt af van de kleur? Alleen het aantal vakken is anders.","<pre>kleur = kraan.lees_kleur()\nif kleur == \"rood\":\n    kraan.rechts(2)\nelse:\n    kraan.rechts(6)</pre>Pak de container vóór de if en zet hem na de if neer.","Zo kan het:<pre>"+regNaam+"from haven import kraan\n\nkleur = kraan.lees_kleur()\nkraan.pak()\nif kleur == \"rood\":\n    kraan.rechts(2)\nelse:\n    kraan.rechts(6)\nkraan.zet()</pre>"],
    ok:"Elke container komt op het juiste schip!" } }),
wLevel({ id:"H4", groep:"🏗️ De Havenkraan", titel:"Haven 4 - Drie schepen",
  opdracht:`<p>Nu liggen er drie schepen. <b>Rood</b> gaat naar <b>schip A</b> (vak 2), <b>blauw</b> naar <b>schip B</b> (vak 4) en <b>groen</b> naar <b>schip C</b> (vak 6).</p>${API_HAVEN}`,
  hoofd:{ titel:"Programmeer de kraan", wereld:"haven",
    html:`<p>Drie mogelijkheden: gebruik <code>if</code>, <code>elif</code> en <code>else</code>.</p>`,
    starter:"from haven import kraan\n\n",
    scenarios:[["groen",6,"schip C"],["rood",2,"schip A"],["blauw",4,"schip B"]].map(([k,d,n])=>hSc({naam:`${k==="rood"?"rode":k+"e"} container`,kleur:k,schepen:[2,4,6],namen:H_SCHEPEN4,doel:d,doelNaam:n,paneel:`📟 Kleur: ${k}`})),
    doel:havenDoel,
    moet:[[/lees_kleur\s*\(/, "Lees de kleur met kraan.lees_kleur()."],[/^\s*if\b/m,"Gebruik een if."],[/^\s*elif\b/m,"Gebruik een elif voor de tweede kleur."]],
    hulp:["Hoe kies je in Python tussen méér dan twee mogelijkheden?","<pre>if kleur == \"rood\":\n    kraan.rechts(2)\nelif kleur == \"blauw\":\n    kraan.rechts(4)\nelse:\n    kraan.rechts(6)</pre>","Zo kan het:<pre>"+regNaam+"from haven import kraan\n\nkleur = kraan.lees_kleur()\nkraan.pak()\nif kleur == \"rood\":\n    kraan.rechts(2)\nelif kleur == \"blauw\":\n    kraan.rechts(4)\nelse:\n    kraan.rechts(6)\nkraan.zet()</pre>"],
    ok:"Drie kleuren, drie schepen: alles staat juist!" } }),
wLevel({ id:"H5", groep:"🏗️ De Havenkraan", titel:"Haven 5 - Zware containers",
  opdracht:`<p>De kraan kiest nu op <b>gewicht</b>:</p><ul><li>meer dan <b>30 ton</b>: te zwaar! Laat de container staan en toon met <code>print()</code> een melding met het woord <i>zwaar</i>;</li><li><b>20 ton of meer</b>: naar het <b>vrachtschip</b> op vak 7;</li><li>lichter: naar de <b>boot</b> op vak 3.</li></ul>${API_HAVEN}`,
  hoofd:{ titel:"Programmeer de kraan", wereld:"haven",
    html:`<p>Let op de grenzen: wat gebeurt er met een container van precies 20 ton? En van precies 30 ton?</p>`,
    starter:"from haven import kraan\n\n",
    scenarios:[[12,3,"de boot"],[27,7,"het vrachtschip"],[20,7,"het vrachtschip"],[19,3,"de boot"],[30,7,"het vrachtschip"],[34,null,""]].map(([g,d,n])=>hSc({naam:`${g} ton`,kleur:"geel",label:g+" t",gewicht:g,max:30,schepen:[3,7],namen:H_SCHEPEN5,doel:d,doelNaam:n,teZwaar:g>30,paneel:`📟 Gewicht: ${g} ton`,tip:g===20?"Precies 20 ton gaat óók naar het vrachtschip: > of >= ?":g===30?"Precies 30 ton is nog niet te zwaar: alleen méér dan 30 ton.":""})),
    doel:havenDoel,
    moet:[[/lees_gewicht\s*\(/, "Lees het gewicht met kraan.lees_gewicht()."],[/^\s*elif\b/m,"Drie mogelijkheden: gebruik if, elif en else."]],
    hulp:["Welke grens controleer je eerst? Denk aan 6.2: Python stopt bij de eerste voorwaarde die waar is. En vergeet niet dat het gewicht tekst is.","<pre>gewicht = int(kraan.lees_gewicht())\nif gewicht &gt; 30:\n    print(...)\nelif gewicht &gt;= 20:\n    ...\nelse:\n    ...</pre>Een te zware container pak je niet op.","Zo kan het:<pre>"+regNaam+"from haven import kraan\n\ngewicht = int(kraan.lees_gewicht())\n\n# Kies het juiste schip\nif gewicht &gt; 30:\n    print(\"Deze container is te zwaar.\")\nelif gewicht &gt;= 20:\n    kraan.pak()\n    kraan.rechts(7)\n    kraan.zet()\nelse:\n    kraan.pak()\n    kraan.rechts(3)\n    kraan.zet()</pre>"],
    ok:"Je kraan kent zijn grenzen: elke container belandt juist!" } }),
...H_LUS,
/* ======== HET STATION ======== */
wLevel({ id:"T1", groep:"🚆 Het Station", titel:"Station 1 - De eerste wissel",
  opdracht:`<p>Jij bedient de wissels in het station. Treinen naar <b>Gent</b> rijden over het <b>bovenste</b> spoor, treinen naar <b>Brugge</b> over het <b>onderste</b>.</p>${API_STATION}`,
  hoofd:{ titel:"Programmeer de wissel", wereld:"station",
    html:`<p>Begin met <code>from station import trein, wissel1</code>. Zet de wissel juist en laat dan de trein vertrekken.</p>`,
    starter:"from station import trein, wissel1\n\n",
    scenarios:["Gent","Brugge"].map(b=>({naam:`trein naar ${b}`,bestemming:b,sporen:ST_LIJN1,doel:b==="Gent"?"A":"B",paneel:`🚆 Trein naar ${b}`})),
    doel:stationDoel,
    moet:[[/lees_bestemming\s*\(/, "Lees de bestemming met trein.lees_bestemming()."],[/^\s*if\b/m,"Gebruik een if."]],
    hulp:["Wat moet je eerst doen: de wissel zetten of de trein laten rijden? En waarvan hangt de stand van de wissel af?","<pre>bestemming = trein.lees_bestemming()\nif bestemming == \"Gent\":\n    wissel1.boven()\nelse:\n    wissel1.onder()</pre>Laat daarna de trein rijden.","Zo kan het:<pre>"+regNaam+"from station import trein, wissel1\n\nbestemming = trein.lees_bestemming()\nif bestemming == \"Gent\":\n    wissel1.boven()\nelse:\n    wissel1.onder()\ntrein.rijd()</pre>"],
    ok:"Elke trein rijdt naar de juiste stad!" } }),
wLevel({ id:"T2", groep:"🚆 Het Station", titel:"Station 2 - Twee wissels",
  opdracht:`<p>Er is een derde bestemming bij: <b>Oostende</b>. Op het onderste spoor ligt <b>wissel 2</b>: boven gaat naar <b>Brugge</b>, onder naar <b>Oostende</b>. <b>Gent</b> blijft het bovenste spoor van wissel 1.</p>${API_STATION}`,
  hoofd:{ titel:"Programmeer de wissels", wereld:"station",
    html:`<p>Begin met <code>from station import trein, wissel1, wissel2</code>.</p>`,
    starter:"from station import trein, wissel1, wissel2\n\n",
    scenarios:["Brugge","Oostende","Gent"].map(b=>({naam:`trein naar ${b}`,bestemming:b,wissel2:true,sporen:ST_LIJN2,doel:{Gent:"A",Brugge:"B",Oostende:"C"}[b],paneel:`🚆 Trein naar ${b}`})),
    doel:stationDoel,
    moet:[[/lees_bestemming\s*\(/, "Lees de bestemming met trein.lees_bestemming()."],[/^\s*elif\b/m,"Drie bestemmingen: gebruik if, elif en else."]],
    hulp:["Volg met je vinger het spoor naar Oostende: over welke wissels rijdt de trein, en in welke stand moeten ze staan?","Naar Brugge: <code>wissel1.onder()</code> en <code>wissel2.boven()</code>. Naar Oostende: <code>wissel1.onder()</code> en <code>wissel2.onder()</code>. Gebruik if, elif en else.","Zo kan het:<pre>"+regNaam+"from station import trein, wissel1, wissel2\n\nbestemming = trein.lees_bestemming()\nif bestemming == \"Gent\":\n    wissel1.boven()\nelif bestemming == \"Brugge\":\n    wissel1.onder()\n    wissel2.boven()\nelse:\n    wissel1.onder()\n    wissel2.onder()\ntrein.rijd()</pre>"],
    ok:"Twee wissels, drie steden: alle treinen komen juist aan!" } }),
wLevel({ id:"T3", groep:"🚆 Het Station", titel:"Station 3 - Lange treinen",
  opdracht:`<p><b>Perron A</b> (boven) is kort: er passen maximaal <b>8 wagons</b>. Langere treinen moeten naar <b>perron B</b> (onder). Elke wagon is <b>25 meter</b> lang: toon met <code>print()</code> hoe lang de trein is.</p>${API_STATION}`,
  hoofd:{ titel:"Programmeer de wissel", wereld:"station",
    html:`<p>Lees het aantal wagons, bereken de lengte en kies het juiste perron. Wat doe je met een trein van precies 8 wagons?</p>`,
    starter:"from station import trein, wissel1\n\n",
    scenarios:[5,9,8,12].map(n=>({naam:`${n} wagons`,bestemming:"Gent",wagons:n,sporen:ST_LANG,doel:n<=8?"A":"B",lengte:n*25,paneel:`🚆 Trein met ${n} wagons`,tip:n===8?"8 wagons passen nog net op perron A: < of <= ?":""})),
    doel:stationDoel,
    moet:[[/lees_wagons\s*\(/, "Lees het aantal wagons met trein.lees_wagons()."],[/^\s*if\b/m,"Gebruik een if."]],
    hulp:["trein.lees_wagons() geeft tekst. Wat moet je doen voor je ermee kunt rekenen of vergelijken?","<pre>wagons = int(trein.lees_wagons())\nlengte = wagons * 25\nprint(...)\nif wagons &lt;= 8:\n    wissel1.boven()\nelse:\n    wissel1.onder()</pre>","Zo kan het:<pre>"+regNaam+"from station import trein, wissel1\n\nwagons = int(trein.lees_wagons())\nlengte = wagons * 25\nprint(\"De trein is\", lengte, \"meter lang.\")\nif wagons &lt;= 8:\n    wissel1.boven()\nelse:\n    wissel1.onder()\ntrein.rijd()</pre>"],
    ok:"Korte en lange treinen staan allemaal aan het juiste perron!" } }),
...T_LUS,
/* ======== HET MAGAZIJN ======== */
wLevel({ id:"M1", groep:"📦 Het Magazijn", titel:"Magazijn 1 - Even of oneven",
  opdracht:`<p>Jij programmeert de pakjesrobot. Pakjes met een <b>even</b> postcode gaan in <b>bak 1</b>, pakjes met een <b>oneven</b> postcode in <b>bak 2</b>.</p>${API_MAGAZIJN}`,
  hoofd:{ titel:"Programmeer de robot", wereld:"magazijn",
    html:`<p>Begin met <code>from magazijn import robot</code>. Tip: een getal is even als de rest bij deling door 2 gelijk is aan 0. Welke operator geeft de rest?</p>`,
    starter:"from magazijn import robot\n\n",
    scenarios:[9000,8501,2610,3001,1000].map(p=>({naam:`postcode ${p}`,postcode:p,bakken:2,labels:MZ1,label:String(p),doel:p%2===0?1:2,paneel:`📦 Pakje voor postcode ${p}`})),
    doel:magazijnDoel,
    moet:[[/lees_postcode\s*\(/, "Lees de postcode met robot.lees_postcode()."],[/%/,"Gebruik de rest-operator % om te zien of de postcode even is."],[/^\s*if\b/m,"Gebruik een if."]],
    hulp:["Hoe weet je of een getal even is? Denk aan oefening 3.1: welke operator geeft de rest van een deling?","<code>postcode % 2</code> is 0 bij een even getal. Vergeet niet de postcode eerst om te zetten met int().","Zo kan het:<pre>"+regNaam+"from magazijn import robot\n\npostcode = int(robot.lees_postcode())\nif postcode % 2 == 0:\n    robot.naar(1)\nelse:\n    robot.naar(2)\nrobot.leg()</pre>"],
    ok:"Even en oneven netjes gesorteerd!" } }),
wLevel({ id:"M2", groep:"📦 Het Magazijn", titel:"Magazijn 2 - Per provincie",
  opdracht:`<p>Het <b>eerste cijfer</b> van een postcode vertelt waar het pakje naartoe moet:</p><ul><li><b>1</b>xxx: Brussel → <b>bak 1</b></li><li><b>2</b>xxx: Antwerpen → <b>bak 2</b></li><li><b>9</b>xxx: Oost-Vlaanderen → <b>bak 3</b></li><li>alle andere: <b>bak 4</b></li></ul>${API_MAGAZIJN}`,
  hoofd:{ titel:"Programmeer de robot", wereld:"magazijn",
    html:`<p>Tip: met de gehele deling <code>//</code> haal je het eerste cijfer uit een postcode van 4 cijfers.</p>`,
    starter:"from magazijn import robot\n\n",
    scenarios:[2610,1000,9000,3500,9940,8000,2000].map(p=>{const c=Math.floor(p/1000);return {naam:`postcode ${p}`,postcode:p,bakken:4,labels:MZ2,label:String(p),doel:c===1?1:c===2?2:c===9?3:4,paneel:`📦 Pakje voor postcode ${p}`}}),
    doel:magazijnDoel,
    moet:[[/lees_postcode\s*\(/, "Lees de postcode met robot.lees_postcode()."],[/\/\//,"Gebruik de gehele deling // om het eerste cijfer te vinden."],[/^\s*elif\b/m,"Vier bakken: gebruik if, elif en else."]],
    hulp:["Hoeveel is 9000 // 1000? En 2610 // 1000?","<code>provincie = postcode // 1000</code> geeft het eerste cijfer. Vergelijk dat daarna met 1, 2 en 9.","Zo kan het:<pre>"+regNaam+"from magazijn import robot\n\npostcode = int(robot.lees_postcode())\nprovincie = postcode // 1000\nif provincie == 1:\n    robot.naar(1)\nelif provincie == 2:\n    robot.naar(2)\nelif provincie == 9:\n    robot.naar(3)\nelse:\n    robot.naar(4)\nrobot.leg()</pre>"],
    ok:"Elk pakje vertrekt naar de juiste provincie!" } }),
wLevel({ id:"M3", groep:"📦 Het Magazijn", titel:"Magazijn 3 - Verzendkosten",
  opdracht:`<p>Nu sorteert de robot op <b>gewicht</b>. Toon ook de <b>verzendkosten</b> met <code>print()</code>:</p><table class="api" style="max-width:420px"><tr><th>Gewicht</th><th>Bak</th><th>Kosten</th></tr><tr><td>minder dan 2 kg</td><td>bak 1 (klein)</td><td>4.5 euro</td></tr><tr><td>minder dan 10 kg</td><td>bak 2 (middel)</td><td>7 euro</td></tr><tr><td>10 kg of meer</td><td>bak 3 (groot)</td><td>12 euro</td></tr></table>${API_MAGAZIJN}`,
  hoofd:{ titel:"Programmeer de robot", wereld:"magazijn",
    html:`<p>Het gewicht is een kommagetal, bv. <code>"3.5"</code>. Let op de grenzen: in welke bak hoort een pakje van precies 2 kg? En van precies 10 kg?</p>`,
    starter:"from magazijn import robot\n\n",
    scenarios:[[0.8,1,4.5],[5.5,2,7],[2.0,2,7],[14.2,3,12],[9.9,2,7],[10.0,3,12]].map(([g,b,k])=>({naam:`${g} kg`,gewicht:g,bakken:3,labels:MZ3,label:String(g).includes(".")?g+" kg":g.toFixed(1)+" kg",doel:b,kosten:k,paneel:`📦 Pakje van ${String(g).includes(".")?g:g.toFixed(1)} kg`,tip:g===2?"Precies 2 kg is niet ‘minder dan 2 kg’.":g===10?"Precies 10 kg hoort bij ‘10 kg of meer’.":""})),
    doel:magazijnDoel,
    moet:[[/lees_gewicht\s*\(/, "Lees het gewicht met robot.lees_gewicht()."],[/float\s*\(/,"Het gewicht is een kommagetal: zet het om met float()."],[/^\s*elif\b/m,"Drie bakken: gebruik if, elif en else."]],
    hulp:["Welke omzetting gebruik je voor een kommagetal? En welke grens controleer je eerst?","<pre>gewicht = float(robot.lees_gewicht())\nif gewicht &lt; 2:\n    robot.naar(1)\n    kosten = 4.5\nelif gewicht &lt; 10:\n    ...\nelse:\n    ...</pre>Toon de kosten na de if.","Zo kan het:<pre>"+regNaam+"from magazijn import robot\n\ngewicht = float(robot.lees_gewicht())\nif gewicht &lt; 2:\n    robot.naar(1)\n    kosten = 4.5\nelif gewicht &lt; 10:\n    robot.naar(2)\n    kosten = 7\nelse:\n    robot.naar(3)\n    kosten = 12\nrobot.leg()\nprint(\"De verzendkosten zijn\", kosten, \"euro.\")</pre>"],
    ok:"Elk pakje zit in de juiste bak, met de juiste prijs!" } }),
...M_LUS,
/* ======== HET VERKEER ======== */
wLevel({ id:"V1", groep:"🚗 Het Verkeer", titel:"Verkeer 1 - Het verkeerslicht",
  opdracht:`<p>Jij programmeert een zelfrijdende auto. Aan het kruispunt staat een verkeerslicht. Bij <b>groen</b> rijdt de auto door. Bij <b>oranje</b> en <b>rood</b> stopt de auto.</p>${API_VERKEER}`,
  hoofd:{ titel:"Programmeer de auto", wereld:"verkeer",
    html:`<p>Begin met <code>from verkeer import auto</code>.</p>`,
    starter:"from verkeer import auto\n\n",
    scenarios:["rood","groen","oranje"].map(l=>({naam:`${l} licht`,licht:l,paneel:"🚦 Verkeerslicht"})),
    doel:verkeerDoel,
    moet:[[/lees_licht\s*\(/, "Lees het licht met auto.lees_licht()."],[/^\s*if\b/m,"Gebruik een if."]],
    hulp:["In hoeveel gevallen mag de auto doorrijden? Begin je if met dat geval.","<pre>licht = auto.lees_licht()\nif licht == \"groen\":\n    auto.rijd()\nelse:\n    auto.stop()</pre>","Zo kan het:<pre>"+regNaam+"from verkeer import auto\n\nlicht = auto.lees_licht()\nif licht == \"groen\":\n    auto.rijd()\nelse:\n    auto.stop()</pre>"],
    ok:"Je auto rijdt veilig door het kruispunt!" } }),
wLevel({ id:"V2", groep:"🚗 Het Verkeer", titel:"Verkeer 2 - Snelheid aanpassen",
  opdracht:`<p>Langs de weg staat een snelheidsbord. Rijdt de auto <b>te snel</b>, dan remt hij. Rijdt hij <b>te traag</b>, dan versnelt hij. Daarna rijdt hij verder, precies aan de toegelaten snelheid.</p>${API_VERKEER}`,
  hoofd:{ titel:"Programmeer de auto", wereld:"verkeer",
    html:`<p>Hoeveel moet de auto remmen of versnellen? Dat bereken je met het verschil tussen de twee snelheden. En wat als de auto al precies juist rijdt?</p>`,
    starter:"from verkeer import auto\n\n",

let worker=null, pyReady=null;
function startWorker(){
  const src=`importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
  let py=null;
  const ready=loadPyodide().then(p=>{py=p;postMessage({type:"ready"});}).catch(e=>postMessage({type:"loadfail",msg:String(e)}));
  onmessage=async(e)=>{await ready; if(!py) return; let out="", teveel=false; const q=(e.data.inputs||[]).slice(); const echo=e.data.echo; const dec=new TextDecoder();
    py.setStdout({write:b=>{ if(out.length>60000){ teveel=true; throw new Error("teveel") } out+=dec.decode(b,{stream:true});return b.length}});
    py.setStderr({write:b=>{out+=dec.decode(b,{stream:true});return b.length}});
    py.setStdin({stdin:()=>{if(!q.length)return undefined; const v=q.shift(); if(echo) out+=v+"\\n"; else out+="\\n\\u0007"; return v;}});
    const wj=()=>{ if(!e.data.wsrc) return null; try{ return py.runPython("_wereld_json()") }catch(x){ return null } };
    try{ py.runPython("for _k in [k for k in list(globals()) if not k.startswith('_')]: del globals()[_k]");
      if(e.data.wsrc){ py.globals.set("_WSRC",e.data.wsrc); py.globals.set("_WSC",e.data.wsc); py.runPython("exec(compile(_WSRC, '<wereld>', 'exec'), globals())"); }
      await py.runPythonAsync(e.data.code); postMessage({type:"done",out,err:null,wereld:wj()}); }
    catch(err){ postMessage({type:"done",out:teveel?out.slice(0,3000)+"\n…":out,err:teveel?"OneindigeLus: Je programma bleef maar uitvoer tonen en werd gestopt.":String(err.message||err),wereld:wj()}); }
  };`;
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
  pyReady=new Promise((res,rej)=>{worker.onmessage=e=>{if(e.data.type==="ready")res();if(e.data.type==="loadfail")rej(e.data.msg)}; worker.onerror=()=>rej("worker")});
}
function friendlyError(raw){
  if(!raw) return null;
  const lines=raw.trim().split("\n"), last=lines[lines.length-1];
  let ln=null; for(const l of lines){const m=l.match(/File "<exec>", line (\d+)/); if(m) ln=m[1]}
  const m2=last.match(/\(detected at line (\d+)\)/); if(m2) ln=ln||m2[1];
  if(/^WereldFout: /.test(last)) return {line:ln,text:last.slice(12),type:"WereldFout",uitleg:null};
  if(/OneindigeLus: /.test(last)) return {line:null,text:"Je programma bleef maar uitvoer tonen en werd gestopt.",uitleg:"Zit je in een oneindige lus? Controleer of de voorwaarde van je while-lus ooit onwaar wordt: verandert de teller in de lus?",type:"OneindigeLus"};
  if(/^EOFError/.test(last)) return {line:ln,text:"Je programma vraagt om invoer, maar er is niet genoeg invoer ingevuld. Vul het vak ‘Invoer’ aan: één antwoord per regel.",type:"EOFError"};
  let uitleg=null; for(const [re,f] of UITLEG){const m=last.match(re); if(m){uitleg=f(m);break}}
  return {line:ln,text:last,uitleg,type:(last.match(/^(\w+(Error|Exception))/)||[])[1]||"Fout"};
}

/* ---------------- Klasafspraken ---------------- */
const PY_KEYWORDS=new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const OPS=["**=","//=",">>=","<<=","**","//","==","!=","<=",">=","+=","-=","*=","/=","%=","->","<<",">>",":=","+","-","*","/","%","=","<",">","(",")","[","]","{","}",",",":",".",";","@","&","|","^","~","!"];
const BINAIR=new Set(["+","-","*","/","//","%","**","=","==","!=","<",">","<=",">=","+=","-=","*=","/=","//=","%=","**="]);
function tokenize(code){
  const toks=[]; let i=0; const n=code.length;
  const reStr=/(?:[rRbBuUfF]|[rR][bBfF]|[bBfF][rR])?(?:'''|"""|'|")/y;
  const reNaam=/[A-Za-z_\u00C0-\uFFFF][\w\u00C0-\uFFFF]*/y;
  const reGetal=/(?:0[xXoObB][\da-fA-F_]+|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?[jJ]?)/y;
  while(i<n){
    const ch=code[i];
    if(ch===" "||ch==="\t"||ch==="\r"){i++;continue}
    if(ch==="\n"){toks.push({t:"nl",v:"\n",s:i,e:i+1});i++;continue}
    if(ch==="\\"&&(code[i+1]==="\n"||code[i+1]==="\r")){i+=2;continue}
    if(ch==="#"){let j=code.indexOf("\n",i); if(j<0)j=n; toks.push({t:"comment",v:code.slice(i,j).replace(/\r$/,""),s:i,e:j}); i=j; continue}
    reStr.lastIndex=i; let m=reStr.exec(code);
    if(m){ const q=m[0].replace(/^[a-zA-Z]+/,""), pre=m[0].length-q.length; let j=i+m[0].length, dicht=false;
      while(j<n){ if(code[j]==="\\"){j+=2;continue} if(code.startsWith(q,j)){j+=q.length;dicht=true;break} if(q.length===1&&code[j]==="\n")break; j++ }
      j=Math.min(j,n); const v=code.slice(i,j);
      toks.push({t:"str",v,s:i,e:j,inhoud:v.slice(pre+q.length, dicht?v.length-q.length:v.length)}); i=j; continue }
    reGetal.lastIndex=i;
    if(/\d/.test(ch)||(ch==="."&&/\d/.test(code[i+1]||""))){ m=reGetal.exec(code); if(m){toks.push({t:"num",v:m[0],s:i,e:i+m[0].length}); i+=m[0].length; continue} }
    reNaam.lastIndex=i; m=reNaam.exec(code);
    if(m){toks.push({t:"name",v:m[0],s:i,e:i+m[0].length}); i+=m[0].length; continue}
    const op=OPS.find(o=>code.startsWith(o,i));
    if(op){toks.push({t:"op",v:op,s:i,e:i+op.length}); i+=op.length; continue}
    i++;
  }
  return toks;
}
/* Geeft een lijst {line, msg} met alles wat niet volgens de klasafspraken is. */
function klasafspraken(code,naam){
  code=code.replace(/\r/g,"");
  const fouten=[], gezien=new Set();
  const starts=[0]; for(let k=0;k<code.length;k++) if(code[k]==="\n") starts.push(k+1);
  const lijnVan=s=>{let lo=0,hi=starts.length-1; while(lo<hi){const mid=(lo+hi+1)>>1; if(starts[mid]<=s)lo=mid; else hi=mid-1} return lo+1};
  const add=(s,msg)=>{const line=typeof s==="number"?lijnVan(s):1, key=line+"|"+msg; if(!gezien.has(key)){gezien.add(key);fouten.push({line,msg})}};
  const regels=code.split("\n");
  const toks=tokenize(code);
  const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/\s+/g," ").trim();
  const isKlein=c=>c && c!==c.toUpperCase() && c===c.toLowerCase();

  /* Afspraak 1-3: commentaar */
  const comments=toks.filter(t=>t.t==="comment");
  if(!comments.length) fouten.push({line:1,msg:`Zet je naam als commentaar op de eerste regel: # ${naam}`});
  else { const tekst=comments[0].v.replace(/^#\s*/,"").trim();
    if(norm(tekst)!==norm(naam)){
      if(/voornaam\s+naam/i.test(tekst)) add(comments[0].s,`Vervang ‘Voornaam Naam’ door je eigen naam: # ${naam}`);
      else if(lijnVan(comments[0].s)>1) fouten.push({line:1,msg:`Zet je naam als commentaar op de eerste regel: # ${naam}`});
      else add(comments[0].s,`De eerste commentaarregel is altijd je naam: # ${naam}`) } }
  for(const c of comments){
    const body=c.v.slice(1); if(!body.trim()) continue;
    if(body[0]!==" ") add(c.s,"Zet een spatie na het #-teken: # Tekst");
    if(isKlein(body.trim()[0])) add(c.s,"Een commentaarregel begint met een hoofdletter.");
    const ln=lijnVan(c.s);
    if(ln>5 && regels[ln-1].trim().startsWith("#")){
      const vorige=(regels[ln-2]||"").trim();
      if(vorige!=="" && !vorige.startsWith("#")) add(c.s,"Zet een lege regel boven deze commentaarregel (zo spraken we af voor commentaar na regel 5).") } }

  /* Afspraak 5-7: operatoren, haakjes en komma's */
  const st=toks.filter(t=>t.t!=="comment");
  const ws=c=>c===" "||c==="\t";
  let diepte=0;
  st.forEach((t,k)=>{
    if(t.t!=="op") return;
    const vorige=st[k-1];
    if(t.v==="("){
      if(vorige&&vorige.t==="name"&&!PY_KEYWORDS.has(vorige.v)&&vorige.e<t.s&&/^[ \t]+$/.test(code.slice(vorige.e,t.s)))
        add(t.s,`Geen spatie vóór het haakje: schrijf ${vorige.v}( en niet ${vorige.v} (`) }
    if("([{".includes(t.v)){diepte++;return}
    if(")]}".includes(t.v)){diepte=Math.max(0,diepte-1);return}
    if(t.v===","){
      if(ws(code[t.s-1])) add(t.s,"Geen spatie vóór een komma: print(\"Tekst\", naam, \".\")");
      const na=code[t.e]; if(na!==undefined && !/[ \t\n)\]}]/.test(na)) add(t.s,"Zet een spatie ná een komma: print(\"Tekst\", naam, \".\")");
      return }
    if(!BINAIR.has(t.v)) return;
    if((t.v==="-"||t.v==="+") && (!vorige||vorige.t==="nl"||(vorige.t==="op"&&!")]}".includes(vorige.v))||(vorige.t==="name"&&PY_KEYWORDS.has(vorige.v)&&!["True","False","None"].includes(vorige.v)))) return; // min-teken van een negatief getal
    if((t.v==="*"||t.v==="**") && vorige && vorige.t==="op" && "(,".includes(vorige.v)) return;
    if(t.v==="=" && diepte>0) return; // bv. sep="" of end=""
    const voor=code[t.s-1], na=code[t.e];
    const okVoor=voor===undefined||voor==="\n"||ws(voor), okNa=na===undefined||na==="\n"||ws(na);
    if(!okVoor||!okNa) add(t.s,`Zet een spatie vóór en ná ${t.v}`);
  });

  /* Afspraak 4: zinnen in print() en input() */
  st.forEach((t,k)=>{
    if(t.t!=="name"||(t.v!=="print"&&t.v!=="input")||!st[k+1]||st[k+1].v!=="(") return;
    let d=0, args=[[]];
    for(let j=k+1;j<st.length;j++){ const u=st[j];
      if(u.t==="op"&&"([{".includes(u.v)){d++; if(d===1) continue}
      else if(u.t==="op"&&")]}".includes(u.v)){d--; if(d===0) break}
      if(u.t==="nl") continue;
      if(d===1&&u.t==="op"&&u.v===","){args.push([]);continue}
      args[args.length-1].push(u) }
    args=args.filter(a=>a.length && !(a[0].t==="name"&&a[1]&&a[1].v==="="));
    if(!args.length) return;
    const heeftZin=args.flat().some(u=>u.t==="str"&&/[A-Za-zÀ-ÿ]/.test(u.inhoud.replace(/\{[^}]*\}/g,"")));
    if(!heeftZin) return;
    const eerste=args[0][0];
    if(eerste.t==="str"){ const c=eerste.inhoud.replace(/^(\s|\\[nt])+/,""); if(c[0]!=="{"&&isKlein(c[0])) add(eerste.s,`De zin bij ${t.v}() begint met een hoofdletter.`) }
    const laatste=args[args.length-1], lt=laatste[laatste.length-1];
    if(lt.t==="str"){ const c=lt.inhoud.replace(/(\s|\\[nt])+$/,""); if(!/[.!?:;…]$/.test(c)) add(lt.s,`De zin bij ${t.v}() eindigt met een leesteken (. ! ? of :).`) }
    else { const wat=code.slice(laatste[0].s,lt.e);
      add(t.s,`De zin bij ${t.v}() eindigt met een leesteken. Staat er een variabele op het einde, zet er dan nog een leesteken achter: ${t.v}(…, ${wat}, ".")`) }
  });
  return fouten.sort((a,b)=>a.line-b.line);
}
function runPython(code,inputs,echo,wereld){
  if(!worker) startWorker();
  return pyReady.then(()=>new Promise(res=>{
    const t=setTimeout(()=>{worker.terminate();worker=null;res({out:"",err:{line:null,text:"Je programma bleef te lang lopen en werd gestopt.",uitleg:"Zit je in een oneindige lus? Controleer of de voorwaarde van je while-lus ooit onwaar wordt: verandert de teller in de lus?",type:"Tijd"}})},8000);

    worker.postMessage(msg);
  }));
}

function getallenIn(txt){ return (txt.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(",","."))) }
function bevat(out,verwacht,tol){ const g=getallenIn(out); return verwacht.every(v=>g.some(x=>Math.abs(x-v)<=tol)) }
function fmt(n){ return String(n).replace(".",",") }
/* geeft {ok, msg, toon:{invoer,out,err}} */
async function nakijkenWereld(code,deel){
  const stijl=KLASAFSPRAKEN?klasafspraken(code,S.naam):[];
  for(const [re,msg] of (deel.moet||[])) if(!re.test(code)) return {ok:false,msg};
  let laatste=null;
  for(let i=0;i<deel.scenarios.length;i++){ const sc=deel.scenarios[i];
    const r=await runPython(code,[],true,{sc});
    const w=r.wereld||{log:[],staat:{}}, wat=`In situatie ${i+1} (${sc.naam})`, toon={out:r.out,err:r.err};
    const anim={i,sc,log:w.log,uitslag:"fout"};
    if(r.err&&r.err.type!=="WereldFout") return {ok:false,toon,anim,msg:`${wat} geeft je programma een foutmelding${r.err.line?" op regel "+r.err.line:""}. `+(r.err.uitleg||"Lees ze rustig en verbeter je code.")};
    if(r.err) return {ok:false,toon,anim,msg:`${wat} ging het mis${r.err.line?" op regel "+r.err.line:""}: ${r.err.text}`+(sc.tip?" "+sc.tip:"")};
    const f=deel.doel(sc,w.staat||{},r.out||"");
    if(f) return {ok:false,toon,anim,msg:`${wat}: ${f}`+(sc.tip?" "+sc.tip:"")};
    laatste={i,sc,log:w.log,uitslag:"ok"};
  }
  if(stijl.length) return {ok:false,stijlFout:true,stijl,anim:laatste,msg:"Je programma werkt in alle situaties, maar je code volgt nog niet alle klasafspraken:"};
  return {ok:true,anim:laatste,msg:deel.ok||"Juist!"};
}
async function nakijken(code,deel,namen){
  if(deel.wereld) return nakijkenWereld(code,deel);
  const stijl=KLASAFSPRAKEN?klasafspraken(code,S.naam):[];
  for(const [re,msg] of (deel.moet||[])) if(!re.test(code)) return {ok:false,msg};
  const zonderCommentaar=code.split("\n").map(l=>l.replace(/#.*$/,"")).join("\n");
  for(const [re,max,msg] of (deel.maxAantal||[])) if((zonderCommentaar.match(re)||[]).length>max) return {ok:false,msg};
  for(const t of deel.tests){
    const r=await runPython(code,t.invoer,true);
    const toon={invoer:t.invoer,out:r.out,err:r.err};
    const delen0=(namen||[]).map((n,i)=>n+" = "+t.invoer[i]);
    const wat0=t.naam||(delen0.length?(delen0.length>1?delen0.slice(0,-1).join(", ")+" en "+delen0[delen0.length-1]:delen0[0]):(t.invoer.length?"invoer "+t.invoer.join(", "):"je programma"));
    if(r.err&&r.err.type==="EOFError") return {ok:false,toon,msg:`Getest met ${wat0}: je programma vraagt meer invoer dan ik verwacht${t.aantalInvoer!=null?" ("+t.aantalInvoer+" keer)":""}. `+(t.eofTip||"Stopt je lus op het juiste moment?")};
    if(r.err&&(r.err.type==="Tijd"||r.err.type==="OneindigeLus")) return {ok:false,toon,msg:`Getest met ${wat0}: ${r.err.text} ${r.err.uitleg||""}`};
    if(r.err){ for(const [re,msg] of (deel.fouten||[])) if(re.test(r.err.text)) return {ok:false,msg,toon};
      return {ok:false,toon,msg:"Je programma geeft een foutmelding"+(r.err.line?" op regel "+r.err.line:"")+". "+(r.err.uitleg||"Lees ze rustig en verbeter je code.")} }
    // getallen zoeken in de uitvoer zonder de invoer-echo's
    const zonder=await runPython(code,t.invoer,false);
    const na=zonder.out.split("\u0007").pop(), laag=na.toLowerCase(), tol=t.tol??deel.tol??0.006;
    const wat=wat0;
    if(t.regels){ const jij=r.out.split("\n").map(x=>x.trim()).filter(x=>x!=="");
      for(let i=0;i<Math.max(jij.length,t.regels.length);i++){ if(jij[i]!==t.regels[i]){
        const verw=t.regels.slice(0,4).join(", ")+(t.regels.length>4?", …, "+t.regels[t.regels.length-1]:"");
        return {ok:false,toon,msg:(i>=jij.length?`Je uitvoer stopt te vroeg: na ‘${jij[i-1]??""}’ verwacht ik nog ‘${t.regels[i]}’.`:i>=t.regels.length?`Je uitvoer gaat te ver door: na ‘${t.regels[t.regels.length-1]}’ moet het stoppen, maar ik zie nog ‘${jij[i]}’.`:`Regel ${i+1} van je uitvoer is ‘${jij[i]}’, maar ik verwacht ‘${t.regels[i]}’.`)+` De uitvoer moet zijn: ${verw}`} } } }
    if(t.aantalInvoer!=null){ const n=(zonder.out.match(/\u0007/g)||[]).length;
      if(n!==t.aantalInvoer) return {ok:false,toon,msg:`Getest met ${wat}: je programma vraagt ${n} keer om invoer, maar ik verwacht ${t.aantalInvoer} keer. `+(t.tip||"")} }
    if(t.perInvoer){ const seg=zonder.out.split("\u0007");
      for(let k=0;k<t.perInvoer.length;k++){ const reg=t.perInvoer[k]; if(!reg) continue; const stuk=(seg[k+1]||"").toLowerCase();
        for(const w of (reg.moet||[])) if(!stuk.includes(w)) return {ok:false,toon,msg:`Getest met ${wat}: na de ${k+1}e invoer (‘${t.invoer[k]}’) verwacht ik meteen ‘${w}’ in de uitvoer. `+(t.tip||"")};
        for(const w of (reg.niet||[])) if(stuk.includes(w)) return {ok:false,toon,msg:`Getest met ${wat}: na de ${k+1}e invoer (‘${t.invoer[k]}’) staat ‘${w}’ in de uitvoer, maar dat klopt hier niet. `+(t.tip||"")} } }
    if(t.tel) for(const {woord,aantal} of t.tel){ const n=laag.split(woord).length-1;
      if(n!==aantal) return {ok:false,toon,msg:`Getest met ${wat}: ik verwacht ${aantal} keer ‘${woord}’ in de uitvoer, maar ik tel er ${n}. `+(t.tip||"")} }
    const ontbreekt=(t.getallen||[]).filter(v=>!bevat(na,[v],tol));
    if(ontbreekt.length)
      return {ok:false,toon,msg:`Getest met ${wat}: ik vind ${ontbreekt.length>1?"de getallen":"het getal"} ${ontbreekt.join(", ")} niet in de uitvoer. `+(deel.getalTip||t.tip||"Rekent je programma met wat de gebruiker intypt?")};
    if(t.woorden) for(const groep of t.woorden) if(!groep.some(w=>laag.includes(w)))
      return {ok:false,toon,msg:`Getest met ${wat}: ik vind ${groep.length>1?"geen van deze woorden: ‘"+groep.join("’, ‘")+"’":"het woord ‘"+groep[0]+"’ niet"} in de uitvoer. `+(t.tip||"")};
    if(t.nietWoorden){ const fout=t.nietWoorden.find(w=>laag.includes(w));
      if(fout) return {ok:false,toon,msg:`Getest met ${wat}: in de uitvoer staat ‘${fout}’, maar dat klopt hier niet. `+(t.tip||"")} }
    if(t.verboden && getallenIn(na).some(x=>t.verboden.some(v=>Math.abs(x-v)<=0.006)))
      return {ok:false,toon,msg:`Getest met ${wat}: in de uitvoer staat ook ${t.verboden.join(", ")}, maar dat is hier niet de juiste prijs. Toon alleen de prijs die deze persoon moet betalen.`};
  }
  if(stijl.length) return {ok:false,stijlFout:true,stijl,msg:"Je programma werkt, maar je code volgt nog niet alle klasafspraken:"};
  return {ok:true,msg:deel.ok||"Juist!"};
}
function toonFb(f,r,extra){
  f.className="fb "+(r.ok?"ok":"bad");
  let h=(r.ok?"✔ ":"✘ ")+esc(r.msg)+(extra||"");
  if(!r.ok&&r.stijl&&r.stijl.length){
    h+=(r.stijlFout?"":`<div class="ex" style="margin-top:8px"><b>Let ook op de klasafspraken:</b></div>`)
      +`<ul class="stijl">`+r.stijl.slice(0,10).map(s=>`<li><b>Regel ${s.line}:</b> ${esc(s.msg)}</li>`).join("")
      +(r.stijl.length>10?`<li>… en nog ${r.stijl.length-10} andere.</li>`:"")+`</ul>` }
  f.innerHTML=h;
}

/* ---------------- Cijfer ---------------- */
function berekenCijfer(a){
  const C=CIJFER, controles=a.controles||0, hulp=a.hulp||0;
  const aftrekPog=Math.min(C.maxAftrekPogingen, Math.max(0,controles-C.gratisControles*(a.nDelen||1))*C.perExtraControle);
  let aftrekHulp=0; if(a.hulpPunten!=null) aftrekHulp=a.hulpPunten; else for(let i=0;i<hulp;i++) aftrekHulp+=C.hulpKost[i]||0;
  const aftrekAfspr=(a.afspraken||0)*C.perAfspraak;
  let basis=Math.max(C.minimum, C.start-aftrekPog-aftrekHulp-aftrekAfspr);
  const bonus=a.extraOk?C.bonusExtra:0;
  const cijfer=Math.min(C.maximum, basis+bonus);
  return {cijfer:Math.round(cijfer*100)/100, aftrekPog, aftrekHulp, aftrekAfspr, bonus, basis};
}
function controleCode(leerling,oefening,cijfer,pogingen,hulp){
  const n=Math.round(cijfer*100)*37 + pogingen*11 + hulp*23 + leerling.length*7 + oefening.length*5 + 59;
  return n%97;
}

function editor(waarde,onChange){
  const ed=$(`<div class="ed"><div class="gut">1</div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" placeholder="Typ hier je code"></textarea></div>`);
  const ta=ed.querySelector("textarea"), gut=ed.querySelector(".gut");
  const nums=()=>{const n=Math.max(ta.value.split("\n").length,6); gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n"); ta.rows=Math.min(n,22)};
  ta.value=waarde||""; nums();
  ta.addEventListener("scroll",()=>{gut.scrollTop=ta.scrollTop});
  ta.addEventListener("input",()=>{nums();onChange(ta.value)});
  ta.addEventListener("keydown",e=>{
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ins("    ")}
    else if(e.key==="Enter"){const s=ta.selectionStart, line=ta.value.slice(0,s).split("\n").pop(); let ind=(line.match(/^ */)||[""])[0]; if(/:\s*$/.test(line)) ind+="    "; e.preventDefault(); ins("\n"+ind)}
  });
  function ins(txt){const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+txt+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+txt.length; nums(); onChange(ta.value)}
  ed.ta=ta; ed.zet=(v)=>{ta.value=v;nums()}; return ed;
}

  }
  function tekenWerelden(){
    inhoud.innerHTML=`<p class="w-intro">Bestuur een kraan, een trein, een robot en een auto met Python. Je ziet meteen wat je code doet!</p>`+voortgang(wereldOef,"Levels");
    const grid=$(`<div class="wgrid"></div>`); inhoud.appendChild(grid);
    const groepen=[...new Set(wereldOef.map(o=>o.groep))];
    groepen.forEach(g=>{ const lijst=wereldOef.filter(o=>o.groep===g), info=WERELD_INFO[g]||{};
      const t=$(`<div class="wtegel" style="--wk:${info.kleur||"var(--brand)"}"><div class="w-kop"><span class="w-icoon">${info.icoon||""}</span><div><div class="w-naam">${esc(info.naam||g)}</div><div class="w-sub">${esc(info.sub||"")}</div></div><span class="tel">${telKlaar(lijst)}/${lijst.length}</span></div><div class="w-levels"></div></div>`);
      const lv=t.querySelector(".w-levels");
      lijst.forEach((o,i)=>{ const s=status(o), naam=o.titel.replace(/^.*? - /,"");
        const b=$(`<button type="button" class="lvl ${s}"><span class="lvl-nr">${s==="verstuurd"?"✔":i+1}</span><span class="lvl-t">${esc(naam)}</span>${o.lus?'<span class="lvl-lus" title="Met een while-lus">🔁 while</span>':""}${s==="verstuurd"?`<span class="lvl-c">${fmt(S.oef[o.id].verstuurd.cijfer)}</span>`:s==="klaar"?'<span class="lvl-c mid">versturen</span>':s==="bezig"?'<span class="lvl-c mid">bezig</span>':""}</button>`);
        b.onclick=()=>open(o); lv.appendChild(b) });
      grid.appendChild(t) });
  }
  const tabs=[...kaart.querySelectorAll(".tabs button")];
  const kies=tab=>{ S.tab=tab; save(); tabs.forEach(b=>b.classList.toggle("aan",b.dataset.tab===tab)); tab==="werelden"?tekenWerelden():tekenKlas() };
  tabs.forEach(b=>b.onclick=()=>kies(b.dataset.tab));
  kies(S.tab);

  if(KLASAFSPRAKEN) m.appendChild($(`<div class="card"><details class="afspraken-kaart"><summary>📏 Klasafspraken voor je code</summary><p>Bij <b>✓ Controleer</b> kijkt de app ook na of je code deze afspraken volgt. Zodra je programma werkt, kost elke overtreding <b>${fmt(CIJFER.perAfspraak)} punt</b>.</p>${AFSPRAKEN_HTML}</details></div>`));
}

function renderOef(m,oef){
  const a=O(oef.id);
  m.appendChild($(`<div class="card"><div class="actions" style="margin:0 0 6px"><button class="btn secondary" id="terug">← Alle oefeningen</button></div><div class="kicker">Oefening</div><h2>${esc(oef.titel)}</h2>${oef.opdracht}${KLASAFSPRAKEN?`<details class="afspraken"><summary>📏 Klasafspraken (klik om te openen)</summary><p style="margin:8px 0 0">Zodra je programma werkt, kost elke overtreding <b>${fmt(CIJFER.perAfspraak)} punt</b>.</p>${AFSPRAKEN_HTML}</details>`:""}</div>`));
  m.querySelector("#terug").onclick=()=>go("start");

  /* stappen (probeer + vraag) */
  oef.stappen.forEach((st,k)=>{ const sa=a.stap[k]||(a.stap[k]={});
    const card=$(`<div class="card step ${sa.vraagOk!==undefined?"done":""}"><h3>${esc(st.titel)}</h3>${st.html}</div>`);
    const blok=codeBlok({waarde:sa.code??st.starter, onCode:v=>{sa.code=v;save()}, invoer:sa.invoer??st.invoer, onInvoer:v=>{sa.invoer=v;save()}});
    card.appendChild(blok);
    if(st.vraag){ const v=st.vraag; const q=$(`<div style="margin-top:14px"><b>${esc(v.q)}</b></div>`);
      v.opties.forEach((t,i)=>{const o=$(`<label class="opt"><input type="radio" name="v${k}" value="${i}"><span>${esc(t)}</span></label>`); q.appendChild(o)});
      const act=$(`<div class="actions"><button class="btn">Controleer</button></div>`); q.appendChild(act);
      const verf=()=>{ if(sa.vraagOk===undefined) return;
        q.querySelectorAll(".opt").forEach(o=>{const i=+o.querySelector("input").value; o.querySelector("input").disabled=true; if(i===v.juist)o.classList.add("right"); else if(i===sa.keuze)o.classList.add("wrong"); if(i===sa.keuze)o.querySelector("input").checked=true});
        act.remove(); const f=fbVak(q); f.className="fb "+(sa.vraagOk?"ok":"info"); f.innerHTML=(sa.vraagOk?"✔ ":"Het juiste antwoord is groen aangeduid. ")+esc(v.uitleg); card.classList.add("done") };
      act.querySelector("button").onclick=()=>{const s=q.querySelector("input:checked"); if(!s){const f=fbVak(q);f.className="fb info";f.textContent="Kies eerst een antwoord.";return}
        sa.keuze=+s.value; sa.vraagOk=(sa.keuze===v.juist); save(); verf()};
      verf(); card.appendChild(q) }
    m.appendChild(card) });

  /* hoofdopdracht, of meerdere deelopdrachten die samen één cijfer krijgen */
  const h=oef.hoofd, delen=h.delen||null;
  if(delen){ if(!a.delen) a.delen=[]; while(a.delen.length<delen.length) a.delen.push({controles:0,hulp:0}); }
  function agg(){ if(!delen) return; const P=a.delen.slice(0,delen.length);
    a.controles=P.reduce((x,p)=>x+(p.controles||0),0); a.hulp=P.reduce((x,p)=>x+(p.hulp||0),0);
    a.hulpPunten=P.reduce((x,p)=>x+(p.hulpPunten||0),0); a.afspraken=P.reduce((x,p)=>x+(p.afspraken||0),0);
    a.nDelen=delen.length; a.ok=P.every(p=>p.ok); a.werkt=P.every(p=>p.werkt);
    if(a.ok) a.oplossing=P.map((p,i)=>"# Deel "+(i+1)+"\n"+(p.oplossing||"")).join("\n\n") }
  function bouwDeel(d,ps,titel){
    const hc=$(`<div class="card step ${ps.ok?"done":""}"><h3>${esc(titel)}</h3>${d.html}</div>`);
    /* programmeerwereld: speelveld met situaties */
    let stage=null, kiesSit=null;
    if(d.wereld){
      const wv=$(`<div class="wereld"><div class="sits"><span>Situatie:</span></div><div class="stage"></div></div>`); hc.appendChild(wv);
      stage=wv.querySelector(".stage"); const sits=wv.querySelector(".sits");
      if(ps.sit==null||ps.sit>=d.scenarios.length) ps.sit=0;
      kiesSit=(i,teken)=>{ ps.sit=i; save(); sits.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("aan",k===i)); if(teken!==false) toonWereld(stage,d.wereld,d.scenarios[i]) };
      d.scenarios.forEach((sc,i)=>{ const b=$(`<button type="button">${i+1}. ${esc(sc.naam)}</button>`); b.onclick=()=>kiesSit(i); sits.appendChild(b) });
      kiesSit(ps.sit);
    }
    const blok=codeBlok({waarde:ps.code??d.starter, onCode:v=>{ps.code=v;save()}, invoer:ps.invoer??d.invoer, onInvoer:v=>{ps.invoer=v;save()},
      uitvoeren:d.wereld?async(code,out)=>{ const sc=d.scenarios[ps.sit]; const r=await runPython(code,[],true,{sc}); const w=r.wereld||{log:[],staat:{}};
        let uitslag="fout", doelMsg=null;
        if(!r.err){ doelMsg=d.doel(sc,w.staat||{},r.out||""); uitslag=doelMsg?"fout":"ok" }
        toonUit(out,{out:r.out+(doelMsg?(r.out?"\n":"")+"🎯 "+doelMsg:(r.err?"":(r.out?"\n":"")+"🎯 Gelukt in deze situatie! Probeer ook de andere situaties.")),err:r.err});
        speelWereld(stage,d.wereld,sc,w.log,uitslag) }:null,
      controleer:async(code,out)=>{
        const r=await nakijken(code,d,d.invoerNamen);
        if(d.wereld&&r.anim){ kiesSit(r.anim.i,false); speelWereld(stage,d.wereld,r.anim.sc,r.anim.log,r.anim.uitslag) }
        const werktNu=r.ok||r.stijlFout;
        // Afspraken verbeteren nadat het programma al werkte, kost geen pogingen meer.
        if(!(ps.werkt&&werktNu)) ps.controles++;
        let eerste="";
        if(werktNu&&!ps.werkt){ ps.werkt=true; ps.afspraken=r.ok?0:r.stijl.length;
          if(ps.afspraken) eerste=`<div class="ex" style="margin-top:6px">Je code bevatte <b>${ps.afspraken} ${ps.afspraken===1?"overtreding":"overtredingen"}</b> van de klasafspraken: dat kost ${fmt(ps.afspraken*CIJFER.perAfspraak)} punt. Verbeter ze nu. Opnieuw controleren kost geen pogingen meer.</div>` }
        agg(); save();
        if(r.toon){ toonUit(out,{out:r.toon.out,err:r.toon.err}) } else out.style.display="none";
        if(r.ok){ ps.ok=true; ps.oplossing=code; agg(); save(); blok.vergrendel(); hc.classList.add("done"); verfHulp(); toonFb(hfb,r,pogTxt()); tekenExtra(); tekenAf() }
        else { toonFb(hfb,r); hfb.insertAdjacentHTML("beforeend",r.stijlFout?(eerste||`<div class="ex" style="margin-top:6px;font-size:14px">Verbeter de overtredingen hierboven. Opnieuw controleren kost geen pogingen meer.</div>`):pogingInfo()); tekenAf() }
      }});
    hc.appendChild(blok);
    const hfb=$(`<div class="fb"></div>`); hc.appendChild(hfb);
    const pogTxt=()=>` <span style="color:var(--muted)">(${ps.controles} ${ps.controles===1?"poging":"pogingen"})</span>`;
    if(ps.ok){ blok.vergrendel(); toonFb(hfb,{ok:true,msg:d.ok},pogTxt()) }
    function pogingInfo(){ const vrij=CIJFER.gratisControles-ps.controles;
      return `<div class="ex" style="font-size:14px">${vrij>0?`Nog ${vrij} gratis ${vrij===1?"poging":"pogingen"}.`:`Elke volgende poging kost ${fmt(CIJFER.perExtraControle)} punt. Probeer eerst met ▶ Uitvoeren, dat is gratis!`}</div>` }

    /* hulp */
    const hulpWrap=$(`<div style="margin-top:14px"></div>`); hc.appendChild(hulpWrap);
    function verfHulp(){ hulpWrap.innerHTML="";
      for(let i=0;i<ps.hulp;i++) hulpWrap.appendChild($(`<div class="hintbox"><b>💡 Hulp ${i+1}</b><div>${d.hulp[i].split("{NAAM}").join(esc(S.naam))}</div></div>`));
      if(ps.hulp<d.hulp.length && !ps.ok){ const kost=(d.hulpKost||(delen?CIJFER.deelHulpKost:CIJFER.hulpKost))[ps.hulp];
        const b=$(`<button class="btn hint" style="margin-top:10px">💡 Hulp ${ps.hulp+1} vragen (kost ${fmt(kost)} punt)</button>`);
        b.onclick=()=>{ if(confirm(`Hulp ${ps.hulp+1} kost ${fmt(kost)} punt van je cijfer. Wil je de hulp zien?`)){ ps.hulp++; if(delen) ps.hulpPunten=(ps.hulpPunten||0)+kost; agg(); save(); verfHulp(); tekenAf() } };
        hulpWrap.appendChild(b) } }
    verfHulp();
    m.appendChild(hc);
  }
  if(delen){ m.appendChild($(`<div class="delen-uitleg">Deze oefening bestaat uit <b>${delen.length} delen</b>. Elk deel is een apart programmaatje met een eigen <b>✓ Controleer</b>. Samen geven ze één cijfer.</div>`));
    delen.forEach((d,k)=>bouwDeel(d,a.delen[k],`Deel ${k+1} – ${d.titel}`)); agg() }
  else bouwDeel(h,a,h.titel);

  /* extra uitdaging */
  const ec=$(`<div class="card step"></div>`); m.appendChild(ec);
  function tekenExtra(){ ec.innerHTML=""; const e=oef.extra; if(!e) {ec.remove();return}
    ec.appendChild($(`<h3>${esc(e.titel)}</h3>`));
    if(!a.ok){ ec.appendChild($(`<p style="color:var(--muted)">Deze uitdaging wordt beschikbaar zodra je hoofdopdracht correct is.</p>`)); return }
    ec.appendChild($(`<div>${e.html}<p style="font-size:14px;color:var(--muted)">Pogingen tellen hier niet mee. Je startcode is je correcte programma van hierboven.</p></div>`));
    const eb=codeBlok({waarde:a.extraCode??a.oplossing, onCode:v=>{a.extraCode=v;save()}, invoer:a.invoer??h.invoer, onInvoer:v=>{a.invoer=v;save()},
      controleer:async(code,out)=>{ const r=await nakijken(code,e,h.invoerNamen);
        if(r.toon) toonUit(out,{out:r.toon.out,err:r.toon.err}); else out.style.display="none";
        if(r.ok){a.extraOk=true;a.extraOplossing=code;save();eb.vergrendel();ec.classList.add("done");toonFb(efb,r," (+"+fmt(CIJFER.bonusExtra)+" punt)");tekenAf()}
        else toonFb(efb,r) }});
    ec.appendChild(eb);
    const efb=$(`<div class="fb"></div>`); ec.appendChild(efb);
    if(a.extraOk){ eb.vergrendel(); ec.classList.add("done"); toonFb(efb,{ok:true,msg:e.ok}," (+"+fmt(CIJFER.bonusExtra)+" punt)") } }
  tekenExtra();

  /* afronden */
  const af=$(`<div class="card" id="afronden"></div>`); m.appendChild(af);
  function tekenAf(){ const c=berekenCijfer(a);
    af.innerHTML=`<div class="kicker">Afronden</div><h3>Jouw cijfer voor deze oefening</h3>
      <div style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap"><span class="score">${a.ok?fmt(c.cijfer):"…"}</span><span>${a.ok?"op "+CIJFER.maximum:"Je cijfer verschijnt zodra je programma correct is."}</span></div>
      <div style="margin-top:10px">
        <div class="line"><span>Start</span><span>${fmt(CIJFER.start)}</span></div>
        <div class="line"><span>Pogingen met ✓ Controleer: ${a.controles||0} (${CIJFER.gratisControles*(delen?delen.length:1)} gratis)</span><span>− ${fmt(c.aftrekPog)}</span></div>
        <div class="line"><span>Gebruikte hulp: ${a.hulp||0} van ${delen?delen.reduce((x,d)=>x+d.hulp.length,0):h.hulp.length}</span><span>− ${fmt(c.aftrekHulp)}</span></div>
        ${KLASAFSPRAKEN?`<div class="line"><span>Klasafspraken: ${a.werkt?(a.afspraken||0)+" "+((a.afspraken||0)===1?"overtreding":"overtredingen")+" × "+fmt(CIJFER.perAfspraak):"nog niet nagekeken"}</span><span>− ${fmt(c.aftrekAfspr)}</span></div>`:""}
        ${c.basis===CIJFER.minimum&&CIJFER.start-c.aftrekPog-c.aftrekHulp-c.aftrekAfspr<CIJFER.minimum?`<div class="line"><span>Minimum voor een correct programma</span><span>${fmt(CIJFER.minimum)}</span></div>`:""}
        <div class="line"><span>Extra uitdaging</span><span>${!oef.extra?"geen bij deze oefening":a.extraOk?"+ "+fmt(c.bonus):"—"}</span></div>
      </div>
      <div class="actions" style="margin-top:14px"><button class="btn" id="stuur" ${a.ok?"":"disabled"}>📤 Verstuur naar mijn leerkracht</button></div>
      <div class="fb" id="stuurfb"></div>`;
    if(a.verstuurd){const f=af.querySelector("#stuurfb"); f.className="fb ok"; f.innerHTML=`✔ Verstuurd op ${esc(a.verstuurd.op)} met cijfer ${fmt(a.verstuurd.cijfer)}.`+(a.verstuurd.cijfer!==c.cijfer?` <b>Je cijfer is sindsdien veranderd: verstuur opnieuw.</b>`:"")}
    af.querySelector("#stuur").onclick=()=>verstuur(oef,a,c);
  }
  tekenAf();
}

/* ---------------- Versturen via Microsoft Forms ---------------- */
function formLink(waarden){
  const [basis,query]=FORM_URL.split("?"); if(!query) return null;
  let gevonden=0;
  const delen=query.split("&").map(p=>{ const i=p.indexOf("="); if(i<0) return p;
    const k=p.slice(0,i); let v; try{v=decodeURIComponent(p.slice(i+1).replace(/\+/g," "))}catch(e){return p}
    let quote=false; if(/^".*"$/.test(v)){v=v.slice(1,-1);quote=true}
    // Vergeeft kleine tikfouten in het sleutelwoord (bv. LEERLIN of CONTROLECODE)
    const ruw=v.trim().toUpperCase().replace(/[^A-Z]/g,"");
    const sleutel=(ruw in waarden)?ruw:Object.keys(waarden).find(k=>ruw.length>=4&&(k.startsWith(ruw)||ruw.startsWith(k)));
    if(sleutel){ gevonden++; const w=String(waarden[sleutel]); return k+"="+encodeURIComponent(quote?'"'+w+'"':w) }
    return p });
  return {url:basis+"?"+delen.join("&"), gevonden};
}
function verstuur(oef,a,c){
  const f=document.querySelector("#stuurfb");
  const pog=a.controles, hulp=a.hulp, cijferTxt=fmt(c.cijfer);
  const code=(a.extraOk?a.extraOplossing:a.oplossing)||"";
  const waarden={ LEERLING:S.naam, KLAS:S.klas, OEFENING:oef.titel, CIJFER:cijferTxt, POGINGEN:pog, HULP:hulp, AFSPRAKEN:a.afspraken||0,
    CONTROLE:controleCode(S.naam,oef.titel,c.cijfer,pog,hulp), CODE:code.length>1500?code.slice(0,1500)+"\n…(ingekort)":code };
  const overzicht=`<table style="margin-top:8px;font-size:14px">${[["Leerling",S.naam],["Klas",S.klas],["Oefening",oef.titel],["Cijfer",cijferTxt],["Pogingen",pog],["Hulp",hulp],["Overtredingen klasafspraken",a.afspraken||0],["Controlecode",waarden.CONTROLE]].map(([k,v])=>`<tr><th style="width:130px">${k}</th><td>${esc(v)}</td></tr>`).join("")}</table>`;
  if(!FORM_URL){ f.className="fb info"; f.innerHTML="<b>Testmodus:</b> je leerkracht heeft nog geen Form gekoppeld. Dit zou er verstuurd worden:"+overzicht; return }
  const l=formLink(waarden);
  if(!l||!l.gevonden){ f.className="fb bad"; f.textContent="De link naar het Form is niet goed ingesteld. Verwittig je leerkracht."; return }
  window.open(l.url,"_blank","noopener");
  a.verstuurd={cijfer:c.cijfer,op:new Date().toLocaleString("nl-BE",{dateStyle:"short",timeStyle:"short"})}; save();
  f.className="fb ok"; f.innerHTML="✔ Het Form opent in een nieuw tabblad. <b>Controleer of deze gegevens erin staan</b> en klik dan op <b>Verzenden</b>:"+overzicht;
}

/* ---------------- Thema ---------------- */
(function(){let th=null;try{th=localStorage.getItem(APP_ID+"-theme")}catch(e){} if(th)document.documentElement.dataset.theme=th;
  document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; try{localStorage.setItem(APP_ID+"-theme",nx)}catch(e){}}})();
document.getElementById("home").onclick=()=>go("start");

render(); toonWie();
