function renderChapter(m,ch){
  let n=0;
  m.appendChild($(`<div class="card"><div class="kicker">${ch.kind==="om"?"Oefenmoment thuis":"Cursus Python"}</div><h2>${esc(ch.title)}</h2>
   ${ch.video?`<p style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary" href="${ch.video}" target="_blank" rel="noopener">▶ ${esc(ch.videoTitle)}</a>${ch.video2?`<a class="btn secondary" href="${ch.video2}" target="_blank" rel="noopener">▶ ${esc(ch.video2Title)}</a>`:""}${ch.video3?`<a class="btn secondary" href="${ch.video3}" target="_blank" rel="noopener">▶ ${esc(ch.video3Title)}</a>`:""}</p>`:""}${ch.intro}</div>`));
  ch.sections.forEach(sec=>{
    const card=$(`<div class="card"><h3>${esc(sec.title)}</h3>${sec.html||""}</div>`);
    sec.items.forEach(it=>{n++; card.appendChild(renderItem(it,n))});
    m.appendChild(card);
  });
  const idx=CHAPTERS.indexOf(ch);
  const nb=$(`<div class="navbtns"></div>`);
  nb.appendChild(idx>0?Object.assign($(`<button class="btn secondary">← Vorige</button>`),{onclick:()=>go(CHAPTERS[idx-1].id)}):$("<span></span>"));
  nb.appendChild(Object.assign($(`<button class="btn">${idx<CHAPTERS.length-1?"Volgende →":"Naar mijn resultaat →"}</button>`),{onclick:()=>go(idx<CHAPTERS.length-1?CHAPTERS[idx+1].id:"rapport")}));
  m.appendChild(nb);
}

function wrap(it,n,tag){const mx=graded(it)?itemPts(it,{})[1]:0; const box=$(`<div class="q" id="${it.id}"><div class="qhead"><span class="qnum">Vraag ${n}</span><span>${it.q}</span><span class="qtag">${tag}${mx?" • "+fmt(mx)+" "+ptWord(mx):""}</span></div></div>`);return box}
function setState(box,a,it){box.classList.remove("done-ok","done-bad","done-open","done-mid");
  if(graded(it)&&a.locked){const [g,m]=itemPts(it,a); box.classList.add(g===m?"done-ok":g>0?"done-mid":"done-bad");}}
function fb(box){let f=box.querySelector(".fb"); if(!f){f=$(`<div class="fb"></div>`);box.appendChild(f)} return f}

function renderItem(it,n){
  const a=A(it.id);
  if(it.type==="mc"){
    const box=wrap(it,n,"meerkeuze");
    const order=shuffleFixed(it.options,seedOf(it.id));
    order.forEach(([txt,i])=>{const o=$(`<label class="opt"><input type="radio" name="${it.id}" value="${i}"><span>${txt}</span></label>`);
      if(a.value==i) o.querySelector("input").checked=true; o.querySelector("input").onchange=()=>{a.value=i;save()}; box.appendChild(o)});
    const act=$(`<div class="actions"><button class="btn">Controleer</button></div>`); box.appendChild(act);
    const paint=()=>{box.querySelectorAll(".opt").forEach(o=>{const v=+o.querySelector("input").value; o.classList.remove("right","wrong");
        if(a.locked&&v===it.correct)o.classList.add("right"); else if(a.lastWrong===v)o.classList.add("wrong");
        if(a.locked)o.querySelector("input").disabled=true});
      if(a.locked){act.remove(); const f=fb(box); f.className="fb "+(a.score?"ok":"bad");
        f.innerHTML=(a.score?(a.attempts===1?"✔ Juist!":"✔ Juist, bij je tweede poging!"):"✘ Jammer. Het juiste antwoord is groen aangeduid.")+`<div class="ex">${it.explain||""}</div>`+ptsHtml(it,a)}
      setState(box,a,it)};
    act.querySelector("button").onclick=()=>{if(a.value===undefined){const f=fb(box);f.className="fb info";f.textContent="Kies eerst een antwoord.";return}
      a.attempts++; if(+a.value===it.correct){a.locked=true;a.score=1;a.lastWrong=null}
      else{a.lastWrong=+a.value; if(a.attempts>=MAXTRY){a.locked=true;a.score=0} else {const f=fb(box);f.className="fb bad";f.textContent="✘ Nog niet juist. Probeer het nog een keer!"}}
      if(a.attempts===1)a.first=(a.score===1); save(); paint()};
    paint(); return box;
  }
  if(it.type==="tf"){
    const box=wrap(it,n,"juist / fout"); a.value=a.value||{};
    it.parts.forEach((p,k)=>{const r=$(`<div class="row"><span>${p.s}</span><span><label><input type="radio" name="${it.id}-${k}" value="1"> Juist</label><label><input type="radio" name="${it.id}-${k}" value="0"> Fout</label></span></div>`);
      r.querySelectorAll("input").forEach(inp=>{if(a.value[k]!==undefined&&String(+a.value[k])===inp.value)inp.checked=true; inp.onchange=()=>{a.value[k]=inp.value==="1";save()}}); box.appendChild(r)});
    return multi(box,it,a,(k)=>a.value[k]===it.parts[k].a, k=>it.parts[k].a?"Juist":"Fout", k=>it.parts[k].explain);
  }
  if(it.type==="match"){
    const box=wrap(it,n,"koppelen"); a.value=a.value||{};
    const defs=shuffleFixed(it.pairs.map(p=>p[1]),seedOf(it.id));
    it.pairs.forEach((p,k)=>{const r=$(`<div class="match row" style="display:grid"><b>${esc(p[0])}</b><select><option value="">— kies —</option>${defs.map(([d,i])=>`<option value="${i}">${esc(d)}</option>`).join("")}</select></div>`);
      const sel=r.querySelector("select"); if(a.value[k]!==undefined)sel.value=a.value[k]; sel.onchange=()=>{a.value[k]=sel.value;save()}; box.appendChild(r)});
    return multi(box,it,a,(k)=>String(a.value[k])===String(k), k=>it.pairs[k][1], ()=>"");
  }
  if(it.type==="fill"){
    const box=wrap(it,n,"invullen");
    const inp=$(`<input type="text" style="width:100%;max-width:260px" placeholder="Jouw antwoord">`); inp.value=a.value||""; inp.oninput=()=>{a.value=inp.value;save()};
    box.appendChild(inp); const act=$(`<div class="actions"><button class="btn">Controleer</button></div>`); box.appendChild(act);
    const norm=s=>String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[!]+$/,"");
    const paint=()=>{if(a.locked){inp.disabled=true;act.remove();const f=fb(box);f.className="fb "+(a.score?"ok":"bad");
      f.innerHTML=(a.score?(a.attempts===1?"✔ Juist!":"✔ Juist, bij je tweede poging!"):"✘ Jammer. Het juiste antwoord is: <b>"+esc(it.answers[0])+"</b>")+`<div class="ex">${it.explain||""}</div>`+ptsHtml(it,a)} setState(box,a,it)};
    act.querySelector("button").onclick=()=>{if(!norm(a.value)){const f=fb(box);f.className="fb info";f.textContent="Vul eerst iets in.";return}
      a.attempts++; if(it.answers.some(x=>norm(x)===norm(a.value))){a.locked=true;a.score=1} else if(a.attempts>=MAXTRY){a.locked=true;a.score=0} else {const f=fb(box);f.className="fb bad";f.textContent="✘ Nog niet juist. Probeer het nog een keer!"}
      if(a.attempts===1)a.first=(a.score===1); save(); paint()};
    paint(); return box;
  }
  if(it.type==="code"||it.type==="play"){
    const isPlay=it.type==="play";
    const box=wrap(it,n,isPlay?"probeer":"code");
    if(a.value===undefined) a.value=it.starter||"";
    if(a.stdin===undefined&&it.stdin!==undefined) a.stdin=it.stdin;
    const ed=makeEditor(a.value,v=>{a.value=v;save();stdin.refresh()}); box.appendChild(ed);
    const stdin=makeStdin(a,()=>ed.ta.value); box.appendChild(stdin); stdin.refresh();
    const act=$(`<div class="actions"><button class="btn secondary run">▶ Uitvoeren</button>${isPlay?"":'<button class="btn chk">✓ Controleer</button>'}<button class="btn secondary rst" title="Begin opnieuw met de oorspronkelijke code" style="margin-left:auto">↺</button><span class="st" style="color:var(--muted);font-size:14px;width:100%"></span></div>`); box.appendChild(act);
    const out=$(`<div class="out"></div>`); box.appendChild(out);
    const st=act.querySelector(".st"), btns=[...act.querySelectorAll("button")];
    const paint=()=>{ if(isPlay){ if(a.ran) box.classList.add("done-open"); return }
      if(a.locked){ed.setReadOnly(true); act.querySelector(".chk").disabled=true; act.querySelector(".rst").disabled=true; const f=fb(box);f.className="fb ok";f.innerHTML="✔ "+esc(a.msg||"Juist!")+(a.attempts>1?` <span style="color:var(--muted)">(na ${a.attempts} pogingen)</span>`:"")+ptsHtml(it,a)}
      setState(box,a,it)};
    async function go(grade){ const code=ed.ta.value;
      if(!code.trim()){const f=fb(box);f.className="fb info";f.textContent="Typ eerst je code in het codevak.";return}
      btns.forEach(b=>b.disabled=true); st.textContent=worker?"Bezig…":"Python wordt geladen (de eerste keer duurt dit even)…";
      const useTests=!!(grade&&it.tests); let r, failMsg=null, shownInput=null;
      try{ if(useTests){ for(const tc of it.tests){ r=await runPython(code,tc.inputs); shownInput=tc.inputs; if(r.err) break; const tr=testCheck(tc,r.out||""); if(!tr[0]){failMsg=tr[1];break} } }
           else r=await runPython(code, it.testInputs||stdin.lines()) }catch(e){ st.textContent=""; btns.forEach(b=>b.disabled=false); const f=fb(box); f.className="fb bad"; f.textContent="Python kon niet geladen worden. Controleer je internetverbinding en probeer opnieuw."; worker=null; return }
      st.textContent=""; btns.forEach(b=>b.disabled=false); showOut(out,r);
      if(useTests&&shownInput){const nt=document.createElement("div"); nt.style.color="#9fb3c8"; nt.textContent="Controle met testinvoer: "+shownInput.join(", ")+"\n\n"; out.insertBefore(nt,out.firstChild)}
      if(isPlay){a.ran=true; save(); paint(); return}
      if(!grade){ const f=box.querySelector(".fb"); if(f&&!a.locked){f.className="fb"} return }
      a.attempts++;
      const tipH=a.attempts>=3&&(it.hint||CODE_HINT[it.check])?`<div class="ex">Tip – zo kan het:<pre style="margin:6px 0 0">${esc(it.hint||CODE_HINT[it.check])}</pre></div>`:"";
      if(r.err&&useTests&&r.err.type==="EOFError"){const f=fb(box);f.className="fb bad";f.innerHTML="✘ Je programma vraagt vaker om invoer dan de opdracht vraagt. Gebruik precies zoveel keer input() als nodig."+tipH}
      else if(!r.err&&useTests){ let bad=null; for(const [re,msg] of (it.must||[])) if(!re.test(code)){bad=msg;break}
        if(!bad) bad=failMsg;
        if(bad){const f=fb(box);f.className="fb bad";f.innerHTML="✘ "+esc(bad)+tipH} else {a.locked=true;a.score=1;a.msg=it.ok||"Juist!"} }
      else if(r.err&&r.err.type==="Tijd"){const f=fb(box);f.className="fb bad";f.innerHTML="✘ Je programma stopt niet: waarschijnlijk zit er een oneindige lus in. Verandert er iets in je lus, zodat de bewering ooit False wordt?"+tipH}
      else if(r.err){const f=fb(box);f.className="fb bad";f.innerHTML="✘ Je code geeft een foutmelding"+(r.err.line?" op regel "+r.err.line:"")+". Lees ze rustig en verbeter je code."+(a.attempts>=3&&(it.hint||CODE_HINT[it.check])?`<div class="ex">Tip – zo kan het:<pre style="margin:6px 0 0">${esc(it.hint||CODE_HINT[it.check])}</pre></div>`:"")}
      else{const [ok,msg]=(it.check?CHECKS[it.check]:genericCheck(it))(r.out||"",code); if(ok){a.locked=true;a.score=1;a.msg=msg} else {const f=fb(box);f.className="fb bad";f.innerHTML="✘ "+esc(msg)+(a.attempts>=3&&(it.hint||CODE_HINT[it.check])?`<div class="ex">Tip – zo kan het:<pre style="margin:6px 0 0">${esc(it.hint||CODE_HINT[it.check])}</pre></div>`:"")}}
      if(!a.locked){const f=fb(box); f.innerHTML+=`<div class="pts">${codeCost(a.attempts)}</div>`}
      if(a.attempts===1)a.first=!!a.locked; save(); paint(); }
    act.querySelector(".run").onclick=()=>go(false);
    if(!isPlay) act.querySelector(".chk").onclick=()=>go(true);
    act.querySelector(".rst").onclick=()=>{ if(a.locked) return; if(confirm("Wil je opnieuw beginnen met de oorspronkelijke code? Je huidige code verdwijnt.")){a.value=it.starter||""; ed.ta.value=a.value; ed.ta.dispatchEvent(new Event("input")); save()} };
    paint(); return box;
  }
  if(it.type==="open"){
    const box=wrap(it,n,"eigen antwoord"); const ta=$(`<textarea placeholder="Typ hier je antwoord"></textarea>`); ta.value=a.value||"";
    const st=$(`<div style="font-size:13px;color:var(--muted);margin-top:4px">Je antwoord wordt automatisch bewaard. Je leerkracht leest het in je resultaat.</div>`);
    ta.oninput=()=>{a.value=ta.value;save();box.classList.toggle("done-open",!!ta.value.trim())}; box.appendChild(ta); box.appendChild(st);
    if(ta.value.trim())box.classList.add("done-open"); return box;
  }
  if(it.type==="checklist"){
    const box=wrap(it,n,"afvinken"); a.value=a.value||[];
    it.parts.forEach((p,k)=>{const c=$(`<label class="check"><input type="checkbox"><span>${esc(p)}</span></label>`); const inp=c.querySelector("input"); inp.checked=a.value.includes(k);
      inp.onchange=()=>{a.value=inp.checked?[...new Set([...a.value,k])]:a.value.filter(x=>x!==k);save();box.classList.toggle("done-open",a.value.length===it.parts.length)}; box.appendChild(c)});
    if(a.value.length===it.parts.length)box.classList.add("done-open"); return box;
  }
}

function multi(box,it,a,isRight,rightLabel,explain){
  const rows=[...box.querySelectorAll(".row")]; const total=rows.length;
  const act=$(`<div class="actions"><button class="btn">Controleer</button></div>`); box.appendChild(act);
  const paint=()=>{rows.forEach((r,k)=>{r.classList.remove("right","wrong"); if(a.checked){r.classList.add(isRight(k)?"right":"wrong")}
      if(a.locked){r.querySelectorAll("input,select").forEach(x=>x.disabled=true);
        if(!isRight(k)&&!r.querySelector(".ans")) r.appendChild($(`<div class="ans" style="grid-column:1/-1;font-size:14px;color:var(--ink)">Juist antwoord: <b>${esc(rightLabel(k))}</b>${explain(k)?" – "+esc(explain(k)):""}</div>`))}});
    if(a.locked){act.remove();const f=fb(box);f.className="fb "+(a.score===total?"ok":"bad");f.innerHTML=(a.score===total?(a.attempts===1?"✔ Alles juist!":"✔ Alles juist, bij je tweede poging!"):`Je had ${a.score} van de ${total} juist. Bekijk de verbeteringen hierboven.`)+ptsHtml(it,a)}
    setState(box,a,it)};
  act.querySelector("button").onclick=()=>{const filled=rows.every((r,k)=>a.value[k]!==undefined&&a.value[k]!=="");
    if(!filled){const f=fb(box);f.className="fb info";f.textContent="Beantwoord eerst alle onderdelen.";return}
    a.attempts++; a.checked=true; const sc=rows.filter((r,k)=>isRight(k)).length;
    if(a.attempts===1)a.firstScore=sc;
    if(sc===total||a.attempts>=MAXTRY){a.locked=true;a.score=sc}
    else{const f=fb(box);f.className="fb bad";f.textContent=`✘ ${sc} van de ${total} juist. De rode onderdelen kloppen nog niet. Pas ze aan en probeer opnieuw!`}
    save(); paint()};
  paint(); return box;
}

/* ---------- report ---------- */
function chapterStats(ch){let sc=0,mx=0,first=0,done=0,total=0; const lines=[];
  allItems(ch).forEach((it,i)=>{const a=S.answers[it.id]||{}; total++; if(isDone(it))done++;
    if(graded(it)){const [g,m]=itemPts(it,a); mx+=m; sc+=g; const mm=maxOf(it);
      let status; if(!a.locked) status=(a.attempts?`nog niet opgelost (${a.attempts} ${a.attempts===1?"poging":"pogingen"})`:"niet gemaakt"); else if(a.score===mm) status=a.attempts===1?"juist bij 1e poging":`juist na ${a.attempts} pogingen`; else status=(mm>1?`${a.score}/${mm} juist`:"fout (antwoord getoond)");
      status+=` – ${fmt(g)}/${fmt(m)} ${ptWord(m)}`;
      lines.push({n:i+1,q:it.q.replace(/<[^>]+>/g,"").replace(/&quot;/g,'"'),status,ok:g===m,part:g>0&&g<m,first:a.attempts===1&&a.score===mm})}
    else if(it.type==="open") lines.push({n:i+1,q:it.q,open:(a.value||"").trim()});
    else if(it.type==="checklist") lines.push({n:i+1,q:it.q,status:`${(a.value||[]).length}/${it.parts.length} afgevinkt`});
    else if(it.type==="play") lines.push({n:i+1,q:"Probeeropdracht: "+it.q,status:a.ran?"uitgevoerd":"niet gedaan",ok:!!a.ran});
  }); return {sc,mx,done,total,lines}}

function reportText(ids){ids=ids||CHAPTERS.map(c=>c.id); const d=new Date(); let t=`CURSUS PYTHON – RESULTAAT\nLeerling: ${S.name||"(geen naam ingevuld)"}\nDatum: ${d.toLocaleDateString("nl-BE")} ${d.toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"})}\n`;
  CHAPTERS.filter(c=>ids.includes(c.id)).forEach(ch=>{const s=chapterStats(ch); t+=`\n== ${ch.title} ==\nScore: ${fmt(s.sc)}/${fmt(s.mx)} punten (${s.mx?Math.round(100*s.sc/s.mx):0}%) – ${s.done}/${s.total} onderdelen afgewerkt\n`;
    s.lines.forEach(l=>{ const qq=String(l.q).replace(/<[^>]+>/g,"").replace(/&quot;/g,'"'); const short=qq.length>55?qq.slice(0,52)+"…":qq; if(l.open!==undefined) t+=`  V${l.n} ${short}\n     → ${l.open||"(niet ingevuld)"}\n`; else t+=`  V${l.n} ${short}\n     → ${l.status}\n`})});
  return t}

function renderReport(m){
  const c=$(`<div class="card"><div class="kicker">Overzicht</div><h2>Mijn resultaat</h2><p>${S.name?("Leerling: <b>"+esc(S.name)+"</b>"):"<i>Vul je naam in op de startpagina.</i>"}</p></div>`); m.appendChild(c);
  CHAPTERS.forEach(ch=>{const s=chapterStats(ch); const pct=s.mx?Math.round(100*s.sc/s.mx):0;
    const card=$(`<div class="card"><h3>${esc(ch.title)}</h3><div style="display:flex;gap:20px;align-items:baseline;flex-wrap:wrap"><span class="score">${fmt(s.sc)}/${fmt(s.mx)}</span><span>${pct}% van de punten • ${s.done} van ${s.total} onderdelen afgewerkt</span></div></div>`);
    s.lines.forEach(l=>{ if(l.open!==undefined){card.appendChild($(`<div class="rep-line"><span>V${l.n}</span><span style="margin-left:0;white-space:normal;color:var(--ink)">${esc(l.q)}<br><i style="color:var(--muted)">${esc(l.open||"nog niet ingevuld")}</i></span></div>`))}
      else card.appendChild($(`<div class="rep-line"><span>V${l.n}</span><span style="margin-left:0;white-space:normal;color:var(--ink)">${esc(l.q)}</span><span><span class="pill ${l.ok?"ok":l.part?"mid":l.status.includes("afgevinkt")?"mid":"bad"}">${esc(l.status)}</span></span></div>`))});
    m.appendChild(card)});
  const send=$(`<div class="card" id="sendcard"><h3>Stuur je resultaat naar je leerkracht</h3>
   <p><b>Welke lessen wil je doorsturen?</b> Vink de lessen aan die je sinds de vorige keer gemaakt hebt.</p><div id="chlist"></div>
   <div class="actions" style="margin-top:12px"><button class="btn" id="outlook">✉ Mail via Outlook (schoolaccount)</button><button class="btn secondary" id="copy">Kopieer resultaat</button><button class="btn secondary" id="dl">Download als bestand</button></div>
   <p style="font-size:14px;color:var(--muted);margin-top:8px">Outlook opent in een nieuw tabblad met een kant-en-klare mail aan je leerkracht. Controleer of je aangemeld bent met je schoolaccount en klik op <b>Verzenden</b>. Lukt dat niet? Kopieer dan je resultaat en plak het in een bericht via Smartschool. <a href="#" id="mailto">Ander mailprogramma gebruiken</a></p>
   <div class="fb" id="sendfb"></div>
   <details style="margin-top:14px"><summary>Opnieuw beginnen</summary><p style="font-size:14px">Hiermee wis je al je antwoorden op deze computer. Doe dit alleen als je leerkracht dat vraagt.</p><button class="btn secondary" id="reset">Alles wissen</button></details></div>`);
  m.appendChild(send);
  S.sent=S.sent||{};
  const list=send.querySelector("#chlist");
  CHAPTERS.forEach(ch=>{const st=chapterStats(ch); const sig=chapterSig(ch); const prev=S.sent[ch.id];
    const active=allItems(ch).some(it=>{const x=S.answers[it.id]; return x&&((x.attempts||0)>0||x.ran||(typeof x.value==="string"&&x.value.trim()&&it.type!=="code"&&it.type!=="play")||(Array.isArray(x.value)&&x.value.length)||(it.type==="tf"||it.type==="match")&&x.value&&Object.keys(x.value).length)}); const changed=!prev||prev.sig!==sig;
    const row=$(`<label class="check"><input type="checkbox" value="${ch.id}"><span><b>${esc(ch.title)}</b><br><span style="font-size:14px;color:var(--muted)">${st.sc}/${st.mx} punten • ${st.done} van ${st.total} onderdelen afgewerkt${prev?` • al doorgestuurd op ${esc(prev.at)}${changed?" (sindsdien verder gewerkt)":""}`:""}</span></span></label>`);
    const cb=row.querySelector("input"); cb.checked=active&&changed; list.appendChild(row)});
  const sel=()=>[...list.querySelectorAll("input:checked")].map(i=>i.value);
  const sf=send.querySelector("#sendfb");
  const need=()=>{const ids=sel(); if(!ids.length){sf.className="fb info";sf.textContent="Vink eerst minstens één les aan.";return null} return ids};
  const markSent=(ids)=>{const at=new Date().toLocaleDateString("nl-BE"); ids.forEach(id=>{S.sent[id]={sig:chapterSig(CHAPTERS.find(c=>c.id===id)),at}}); save()};
  const subject=(ids)=>"Resultaat cursus Python – "+(S.name||"leerling")+" – "+ids.map(id=>chCode(CHAPTERS.find(c=>c.id===id))).join(", ");
  send.querySelector("#outlook").onclick=()=>{const ids=need(); if(!ids)return; let body=reportText(ids); if(body.length>6000) body=body.slice(0,6000)+"\n…(ingekort – stuur ook het gedownloade bestand mee)";
    const url=`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(TEACHER_EMAIL)}&subject=${encodeURIComponent(subject(ids))}&body=${encodeURIComponent(body)}`;
    window.open(url,"_blank","noopener"); markSent(ids);
    sf.className="fb ok"; sf.textContent="✔ Outlook wordt geopend in een nieuw tabblad. Vergeet niet op Verzenden te klikken!"};
  send.querySelector("#mailto").onclick=(e)=>{e.preventDefault(); const ids=need(); if(!ids)return; let body=reportText(ids); if(body.length>1800)body=body.slice(0,1800)+"\n…(ingekort – stuur ook het gedownloade bestand mee)";
    location.href=`mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(subject(ids))}&body=${encodeURIComponent(body)}`; markSent(ids)};
  send.querySelector("#copy").onclick=async()=>{const ids=need(); if(!ids)return; try{await navigator.clipboard.writeText(reportText(ids));markSent(ids);sf.className="fb ok";sf.textContent="✔ Gekopieerd! Plak het in een bericht aan je leerkracht."}catch(e){sf.className="fb bad";sf.textContent="Kopiëren lukte niet. Gebruik ‘Download als bestand’."}};
  send.querySelector("#dl").onclick=()=>{const ids=need(); if(!ids)return; const b=new Blob([reportText(ids)],{type:"text/plain;charset=utf-8"}); const u=URL.createObjectURL(b); const l=document.createElement("a"); l.href=u; l.download=`Resultaat_Python_${(S.name||"leerling").replace(/\s+/g,"_")}.txt`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); markSent(ids); sf.className="fb ok"; sf.textContent="✔ Het bestand staat in je map Downloads. Stuur het naar je leerkracht."};
  send.querySelector("#reset").onclick=()=>{if(confirm("Weet je zeker dat je alle antwoorden wilt wissen?")){S={name:"",answers:{},current:"start",sent:{}};save();render()}};
}
function chapterSig(ch){const o=allItems(ch).map(it=>{const a=S.answers[it.id]||{};return [it.id,a.attempts||0,a.locked||0,a.score||0,a.ran||0,JSON.stringify(a.value===undefined?null:a.value)]});
  let h=0; const str=JSON.stringify(o); for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0} return String(h)}

/* ---------- theme ---------- */
(function(){let th=null;try{th=localStorage.getItem(COURSE_ID+"-theme")}catch(e){} if(th)document.documentElement.dataset.theme=th;
  document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; try{localStorage.setItem(COURSE_ID+"-theme",nx)}catch(e){}}})();

render(); updateBar();
</script>
</body>
</html>
