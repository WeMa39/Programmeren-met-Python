<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursus Python</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#dde2ea;
  --brand:#1f4e79; --brand-soft:#e3edf7; --accent:#d66028;
  --ok:#1e7a46; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe7e5; --warn-soft:#fff3e3;
  --code-bg:#f1f3f6; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
    --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
    --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
    --code-bg:#262c37;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
  --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
  --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
  --code-bg:#262c37;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;color:var(--brand);flex:1;min-width:160px}
.top button.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);cursor:pointer}
.progress{height:6px;background:var(--line)}
.progress div{height:100%;background:var(--accent);width:0;transition:width .4s}
nav{max-width:900px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.navb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.navb.menu{background:var(--brand);color:var(--card);border-color:var(--brand);font-weight:600}
.navb.active{border-color:var(--brand);color:var(--brand);font-weight:600}
.where{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--brand)}
.menu-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex}
.menu-panel{background:var(--card);width:min(380px,92vw);height:100%;overflow-y:auto;padding:14px 14px 30px;box-shadow:4px 0 20px rgba(0,0,0,.2)}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px;color:var(--brand)}
.xbtn{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 4px 4px}
.mi{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.mi:hover{background:var(--brand-soft)}
.mi.cur{background:var(--brand-soft);font-weight:600;color:var(--brand)}
.mt{flex:1}
.mbar{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle}
.mbar i{display:block;height:100%;background:var(--accent)}
.okm{color:var(--ok);font-weight:700}
@media (max-width:560px){ .navb:not(.menu){padding:7px 9px;font-size:14px} .where{display:none} }
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px}
h2{color:var(--brand);font-size:24px;margin:4px 0 6px;line-height:1.25}
h3{color:var(--brand);font-size:19px;margin:0 0 8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.box{border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--brand-soft)}
.box.warm{background:var(--warn-soft)}
.box b:first-child{color:var(--brand)}
code,pre,textarea.code{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:14.5px}
code{background:var(--code-bg);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
img.schema{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft)}
a{color:var(--brand)}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:var(--card);text-decoration:none}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--card)}
.q .qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.q .qnum{font-weight:700;color:var(--accent);white-space:nowrap}
.q .qtag{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.q.done-ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.q.done-bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.q.done-mid{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.pts{margin-top:6px;font-size:14px;color:var(--ink)}
.q.done-open{box-shadow:inset 4px 0 0 var(--brand)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.row.right{background:var(--ok-soft);border-color:var(--ok)}
.row.wrong{background:var(--bad-soft);border-color:var(--bad)}
.row label{margin-left:8px;white-space:nowrap}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
select{min-width:0;width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
textarea.code{min-height:110px;background:var(--code-bg)}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.fb.info{display:block;background:var(--brand-soft);color:var(--ink)}
.fb .ex{color:var(--ink);margin-top:4px}
.out{white-space:pre-wrap;background:#0f1720;color:#d6e2f0;border-radius:8px;padding:10px 12px;margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;display:none;max-height:260px;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.check input{margin-top:6px}
.match{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;margin:4px 0}
.match.right{background:var(--ok-soft)}
.match.wrong{background:var(--bad-soft)}
.score{font-size:40px;font-weight:700;color:var(--brand)}
.rep-line{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.rep-line span:last-child{margin-left:auto;white-space:nowrap;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mid{background:var(--warn-soft);color:var(--accent)}
.ed{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);overflow:hidden}
.ed:focus-within{border-color:var(--brand)}
.gut{padding:10px 8px 10px 10px;text-align:right;color:var(--muted);user-select:none;min-width:2.6em;white-space:pre;overflow:hidden;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;border-right:1px solid var(--line)}
.ed textarea{flex:1;border:0;border-radius:0;background:transparent;padding:10px;min-height:120px;resize:vertical;white-space:pre;overflow:auto;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;tab-size:4;outline:none}
.stdin{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--brand-soft);display:none}
.stdin textarea{min-height:56px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.out .errl{color:#ffb4a8}
.navbtns{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
@media (max-width:560px){ .match{grid-template-columns:1fr} h2{font-size:21px} .card{padding:14px} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Cursus Python</h1>
    <span id="who" style="color:var(--muted);font-size:14px"></span>
    <a href="index.html" title="Terug naar de startpagina met beide cursussen" style="text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap">⌂ Alle cursussen</a>
    <button class="theme" id="themeBtn" title="Licht of donker scherm">◐ Thema</button>
  </div>
  <nav id="nav"></nav>
  <div class="progress"><div id="bar"></div></div>
</header>
<main id="main"></main>

<script>
/* ===== INSTELLINGEN VOOR DE LEERKRACHT =====
   Vul hier je e-mailadres in. Dan opent de knop "Mail naar mijn leerkracht" meteen een mail naar jou. */
const TEACHER_EMAIL = "wendy.marsoul@hhscholen.be";
const COURSE_ID = "python-cursus-v1";
/* =========================================== */


const CHAPTERS = [
{ id:"h1", short:"1. Introductie", title:"Hoofdstuk 1 – Introductie",
  video:"https://youtu.be/USTlHenC54A", videoTitle:"Video 1: Introductie tutorials Python",
  intro:`<p>In dit hoofdstuk maak je kennis met de videoreeks van de Universiteit Hasselt, met de programmeertaal Python en met het idee van een online programmeeromgeving.</p>
  <div class="box"><b>Zo werk je</b><br>Bekijk eerst het filmpje. Beantwoord daarna de vragen. Na elke vraag klik je op <b>Controleer</b> en zie je meteen of je antwoord juist is. Is het fout? Dan mag je het nog één keer proberen. Je mag het filmpje gerust pauzeren of opnieuw bekijken.</div>
  <div class="box warm"><b>Let op</b><br>In het filmpje wordt een andere online omgeving gebruikt (Replit). Wij schrijven onze code <b>rechtstreeks in deze cursus</b>. Je hoeft dus <b>geen</b> account aan te maken. In hoofdstuk 2 leer je hoe dat werkt.</div>`,
  sections:[
  { title:"Voor het kijken", items:[
    {id:"h1-open1", type:"open", q:"Wat denk jij dat ‘programmeren’ betekent? Leg uit in je eigen woorden."}
  ]},
  { title:"Kijkvragen", items:[
    {id:"h1-mc1", type:"mc", q:"Wie heeft deze videoreeks gemaakt?", options:["Een Amerikaans softwarebedrijf","De Universiteit Hasselt","De makers van Monty Python"], correct:1, explain:"De reeks werd gemaakt door medewerkers van de Universiteit Hasselt."},
    {id:"h1-mc2", type:"mc", q:"In welke taal zijn de video’s gemaakt, en waarom?", options:["In het Engels, omdat programmeren altijd in het Engels gebeurt","In het Nederlands, om de drempel om te leren programmeren zo laag mogelijk te houden","In het Nederlands, omdat Python een Nederlandse programmeertaal is"], correct:1, explain:"De video’s zijn in het Nederlands, zodat het zo makkelijk mogelijk is om te starten."},
    {id:"h1-mc3", type:"mc", q:"Hoe spreek je de naam ‘Python’ uit volgens de video?", options:["Zoals in ‘Monty Python’","Als ‘Pie-ton’ op zijn Frans","Als ‘Pitton’"], correct:0, explain:"Je spreekt het uit zoals in Monty Python."},
    {id:"h1-mc4", type:"mc", q:"Wat heb je nodig om in een online programmeeromgeving te werken?", options:["Een krachtige computer met speciale software","Een computer met een internetbrowser","Een smartphone en een betaald abonnement"], correct:1, explain:"Een online omgeving werkt in je browser. Je hoeft niets te installeren."},
    {id:"h1-mc5", type:"mc", q:"Waarvoor gebruik je de online omgeving in deze reeks?", options:["Om filmpjes te bekijken","Om code te schrijven en oefeningen te maken","Om berichten te sturen naar de maker"], correct:1, explain:"Je schrijft er je code én je maakt er de oefeningen die bij de video’s horen."},
    {id:"h1-mc6", type:"mc", q:"Waarom zijn de oefeningen bij de video’s belangrijk?", options:["Zo kun je wat je geleerd hebt meteen in de praktijk toepassen","Ze zijn niet belangrijk, het filmpje is genoeg","Ze dienen alleen om punten te verdienen"], correct:0, explain:"Door meteen te oefenen, onthoud je veel beter wat je geleerd hebt."}
  ]},
  { title:"Juist of fout?", items:[
    {id:"h1-tf", type:"tf", q:"Duid bij elke uitspraak aan of ze juist of fout is.", parts:[
      {s:"De video’s in deze reeks zijn in het Engels.", a:false, explain:"Ze zijn in het Nederlands."},
      {s:"Je moet Python eerst op je eigen computer installeren om te kunnen programmeren.", a:false, explain:"Met een online omgeving volstaat een browser."},
      {s:"In deze eerste video wordt uitgebreid uitgelegd waarom Python een goede keuze is.", a:false, explain:"Dat komt pas in een latere video."},
      {s:"Om de oefeningen te maken, moet je eerst een account aanmaken.", a:false, explain:"In deze cursus schrijf en voer je je code meteen uit, zonder account."},
      {s:"De oefeningen horen bij de videotutorials.", a:true, explain:"Juist, ze horen echt bij de video’s."}
    ]}
  ]},
  { title:"Begrippen", items:[
    {id:"h1-match", type:"match", q:"Kies bij elk begrip de juiste omschrijving.", pairs:[
      ["Programmeertaal","Een taal waarin je instructies (code) voor de computer schrijft, zoals Python"],
      ["Programmeeromgeving","Het programma of de plek waarin je code schrijft en uitvoert"],
      ["Online omgeving","Een programmeeromgeving die in je internetbrowser werkt, zonder installatie"],
      ["Uitvoervenster","De plek waar je ziet wat je programma doet"]
    ]}
  ]}
  ]
},
{ id:"h2", short:"2. Werkomgeving", title:"Hoofdstuk 2 – De werkomgeving: programmeren in deze cursus",
  video:"https://youtu.be/EIE9dOBSLKE", videoTitle:"Video 2: Introductie programmeeromgeving (optioneel)",
  intro:`<p>In dit hoofdstuk leer je werken in je eigen programmeeromgeving: deze cursus. Hier schrijf je al je programma’s, voer je ze uit en worden ze nagekeken.</p>
  <div class="box warm"><b>Een woordje over het filmpje</b><br>In video 2 wordt Replit getoond. Je mag het filmpje bekijken om een idee te krijgen van hoe een programmeeromgeving werkt, maar je hoeft Replit niet te gebruiken: alles gebeurt hier.</div>`,
  sections:[
  { title:"2.1 Wat is een programmeeromgeving?", html:`<p>Een programmeertaal, zoals Python, is de taal waarin je instructies voor de computer schrijft. Die instructies schrijf je in een <b>programmeeromgeving</b>.</p>
    <p>Vergelijk het met een opstel: de taal is Nederlands, maar je typt je tekst in een tekstverwerker zoals Word. Een programmeeromgeving is een ‘tekstverwerker voor code’, met één groot verschil: met één klik laat je de computer jouw instructies ook echt uitvoeren.</p>
    <p>Een programmeeromgeving heeft altijd minstens twee delen: een <b>editor</b> waarin je code typt, en een <b>uitvoervenster</b> waarin je ziet wat je programma doet.</p>`,
    items:[
    {id:"h2-mc1", type:"mc", q:"Welke twee delen heeft een programmeeromgeving altijd?", options:["Een rekenmachine en een woordenboek","Een editor en een uitvoervenster","Een printer en een scherm"], correct:1, explain:"In de editor typ je je code, in het uitvoervenster zie je het resultaat."}
  ]},
  { title:"2.2 Jouw werkomgeving", html:`<p>Bij elke codeoefening in deze cursus vind je dezelfde onderdelen:</p>
    <table><tr><th>Onderdeel</th><th>Waarvoor dient het?</th></tr>
    <tr><td><b>Codevak</b></td><td>Hier typ je je code. Links staan <b>regelnummers</b>: bij een fout vertelt de computer op welke regel het probleem zit.</td></tr>
    <tr><td><b>▶ Uitvoeren</b></td><td>Voert je code uit, zodat je kunt zien wat ze doet. Dit telt <b>niet</b> mee: probeer zo vaak je wilt!</td></tr>
    <tr><td><b>✓ Controleer</b></td><td>Voert je code uit én kijkt na of ze doet wat de opdracht vraagt. Gebruik dit pas als je denkt dat je klaar bent.</td></tr>
    <tr><td><b>Uitvoervenster</b></td><td>Het donkere vak onder je code. Hier verschijnt het resultaat van je programma, of een foutmelding.</td></tr>
    <tr><td><b>Kladblok</b></td><td>Een apart tabblad bovenaan, waar je vrij kunt oefenen en experimenteren.</td></tr></table>
    <p style="margin-top:10px">Probeer het meteen. Klik in het codevak hieronder op <b>▶ Uitvoeren</b> en kijk wat er gebeurt. Je hoeft deze code nog niet te begrijpen.</p>`,
    items:[
    {id:"h2-try1", type:"play", q:"Klik op ▶ Uitvoeren.", starter:'print("Welkom in je werkomgeving!")\nprint("Hier verschijnt het resultaat van je code.")'},
    {id:"h2-mc2", type:"mc", q:"Je wilt eerst eens uitproberen wat je code doet, zonder dat het meetelt. Welke knop gebruik je?", options:["✓ Controleer","▶ Uitvoeren","Mijn resultaat"], correct:1, explain:"Met ▶ Uitvoeren probeer je vrij uit. Met ✓ Controleer laat je je code nakijken."},
    {id:"h2-mc3", type:"mc", q:"Waarvoor dienen de regelnummers links in het codevak?", options:["Ze tellen hoeveel punten je hebt","Bij een fout zie je op welke regel het probleem zit","Ze geven aan hoe lang je al bezig bent"], correct:1, explain:"Een foutmelding vermeldt altijd een regelnummer. Zo weet je waar je moet zoeken."}
  ]},
  { title:"2.3 Je eerste programma: Hallo wereld!", html:`<p>Bijna iedereen die leert programmeren, begint met hetzelfde programma: de computer toont ‘Hallo wereld!’.</p>
    <p>Typ in het codevak hieronder deze regel. Let goed op de haakjes en de aanhalingstekens:</p>
    <pre>print("Hallo wereld!")</pre>
    <p>Klik op <b>▶ Uitvoeren</b> om te kijken wat er gebeurt, en daarna op <b>✓ Controleer</b>.</p>
    <div class="box"><b>Wat gebeurt hier?</b><br><code>print</code> is een opdracht in Python die betekent: ‘toon dit op het scherm’. Wat tussen de haakjes en de aanhalingstekens staat, wordt letterlijk getoond.</div>`,
    items:[
    {id:"h2-code1", type:"code", q:"Schrijf het Hallo wereld-programma.", check:"hallo", starter:""},
    {id:"h2-code2", type:"code", q:"Pas het programma aan zodat de computer jou begroet met je eigen naam, bijvoorbeeld <i>Hallo Sara!</i>", check:"naam", starter:'print("Hallo wereld!")'},
    {id:"h2-code3", type:"code", q:"Schrijf een programma met drie <code>print</code>-regels, zodat er drie zinnen over jou op het scherm verschijnen (bv. je naam, je leeftijd en je hobby).", check:"drie", starter:""},
    {id:"h2-mc4", type:"mc", q:"In welke volgorde verschijnen de zinnen op het scherm?", options:["In willekeurige volgorde","Van onder naar boven","In dezelfde volgorde als de regels in je code, van boven naar onder"], correct:2, explain:"De computer voert je instructies één voor één uit, van boven naar onder."}
  ]},
  { title:"2.4 Een bestaand programma aanpassen", html:`<p>In het filmpje wordt een programma aangepast dat al klaarstaat. Dat doen wij ook, met een programma dat een maaltafel toont. <b>Je hoeft deze code nog niet te begrijpen!</b> Je leert later wat elke regel doet.</p>
    <p>Klik eerst op <b>▶ Uitvoeren</b> om te zien wat het programma doet.</p>`,
    items:[
    {id:"h2-try2", type:"play", q:"Voer het programma uit en bekijk het resultaat.", starter:'getal = 7\nprint("De tafel van", getal)\nfor i in range(1, 11):\n    print(i, "x", getal, "=", i * getal)'},
    {id:"h2-mc5", type:"mc", q:"Wat staat er op de eerste regel van het uitvoervenster?", options:["getal = 7","De tafel van 7","1 x 7 = 7"], correct:1, explain:"De eerste print-regel toont ‘De tafel van’ gevolgd door het getal 7."},
    {id:"h2-fill1", type:"fill", q:"Wat is de uitkomst op de regel die begint met <code>3 x 7 =</code>?", answers:["21"], explain:"3 x 7 = 21"},
    {id:"h2-code4", type:"code", q:"Verander het programma zodat het de <b>tafel van 9</b> toont.", check:"tafel9", starter:'getal = 7\nprint("De tafel van", getal)\nfor i in range(1, 11):\n    print(i, "x", getal, "=", i * getal)'},
    {id:"h2-code5", type:"code", q:"Uitdaging: in regel 3 staat <code>range(1, 11)</code>. Pas het programma (opnieuw met 7) zo aan dat de tafel doorgaat tot <b>20 x 7</b>.", check:"tot20", starter:'getal = 7\nprint("De tafel van", getal)\nfor i in range(1, 11):\n    print(i, "x", getal, "=", i * getal)'}
  ]},
  { title:"2.5 Fouten maken mag!", html:`<p>Elke programmeur maakt voortdurend fouten. Een computer is heel precies: één vergeten haakje of aanhalingsteken en hij begrijpt je niet meer. Dan toont het uitvoervenster een <b>foutmelding</b>. Dat is geen ramp: de melding helpt je zoeken.</p>
    <div class="box"><b>Stappenplan bij een foutmelding</b><br>1. Lees rustig de melding en zoek het regelnummer.<br>2. Kijk naar die regel (en de regel erboven): ontbreekt er een haakje, aanhalingsteken of dubbelpunt?<br>3. Verbeter en klik opnieuw op Uitvoeren.<br>4. Lukt het na drie pogingen niet? Noteer je vraag en ga verder met iets anders.</div>
    <p>In het codevak hieronder staat een programma met een fout: het laatste aanhalingsteken ontbreekt. Klik op <b>▶ Uitvoeren</b> en bekijk de foutmelding.</p>`,
    items:[
    {id:"h2-try3", type:"play", q:"Voer dit programma uit. Verander nog niets!", starter:'print("Hallo wereld!)'},
    {id:"h2-mc6", type:"mc", q:"Welk woord zie je in de foutmelding?", options:["SyntaxError","ZeroDivisionError","Gelukt!"], correct:0, explain:"Een SyntaxError betekent dat de computer de regel niet begrijpt, meestal door een tikfout."},
    {id:"h2-fill2", type:"fill", q:"Op welke regel zit de fout volgens de foutmelding? (Typ alleen het getal.)", answers:["1"], explain:"De fout zit op regel 1."},
    {id:"h2-code6", type:"code", q:"Verbeter de fout en controleer.", check:"hallo", starter:'print("Hallo wereld!)'},
    {id:"h2-mc7", type:"mc", q:"Wat doe je als eerste bij een foutmelding?", options:["Alles wissen en opnieuw beginnen","Rustig de melding lezen en het regelnummer zoeken","De computer herstarten"], correct:1, explain:"De melding vertelt je waar je moet zoeken."}
  ]},
  { title:"2.6 Je werk wordt bewaard", html:`<p>Alles wat je typt, wordt <b>automatisch bewaard</b> op deze computer, in deze browser. Je kunt de cursus dus gerust sluiten en later verdergaan.</p>
    <p>Twee dingen om te onthouden:</p>
    <ul><li>Werk altijd op <b>dezelfde computer</b> en in <b>dezelfde browser</b> (bv. Chrome). Op een andere computer zie je je antwoorden niet.</li>
    <li>Stuur na elk lesuur je rapport via <b>Mijn resultaat</b> naar je leerkracht. Dan zit je werk ook veilig bij hem of haar.</li></ul>
    <p>Vind je het scherm te fel? Met de knop <b>◐ Thema</b> bovenaan kies je een donker scherm.</p>`,
    items:[
    {id:"h2-tf", type:"tf", q:"Juist of fout?", parts:[
      {s:"Als ik de cursus sluit, ben ik al mijn antwoorden kwijt.", a:false, explain:"Je werk wordt automatisch bewaard op deze computer."},
      {s:"Op een andere computer zie ik mijn antwoorden ook.", a:false, explain:"Je antwoorden staan alleen op de computer en in de browser waar je werkt."},
      {s:"Na elk lesuur stuur ik mijn rapport naar mijn leerkracht.", a:true, explain:"Zo weet je leerkracht hoe het gaat, en is je werk veilig."}
    ]}
  ]},
  { title:"Terugblik", items:[
    {id:"h2-self", type:"checklist", q:"Wat kan ik nu? Vink af wat je kunt.", parts:["Ik weet wat een programmeeromgeving is.","Ik kan code typen en uitvoeren.","Ik ken het verschil tussen Uitvoeren en Controleer.","Ik kan een bestaand programma aanpassen.","Ik kan een foutmelding lezen en het regelnummer vinden."]},
    {id:"h2-open2", type:"open", q:"Mijn vragen voor mijn leerkracht (mag ook leeg blijven):", optional:true}
  ]}
  ]
},
{ id:"h3", short:"3. Rekenen", title:"Hoofdstuk 3 – Rekenen met gehele getallen",
  video:"https://youtu.be/iP78KB8QPg0", videoTitle:"Video 3: Berekeningen met 2 gehele getallen",
  intro:`<p>Een computer is in de eerste plaats een supersnelle rekenmachine. In dit hoofdstuk leer je Python laten rekenen: optellen, aftrekken, vermenigvuldigen en delen.</p>
  <div class="box"><b>Zo werk je</b><br>Bekijk eerst het filmpje. Lees daarna elk stukje, probeer de voorbeelden uit met <b>▶ Uitvoeren</b> en maak de vragen en oefeningen.</div>
  <div class="box warm"><b>Let op: een verschil met het filmpje</b><br>In het filmpje typt men een berekening, zoals <code>12 + 27</code>, en Python toont meteen het antwoord. Dat werkt in een speciaal venster (de ‘console’). In onze cursus schrijf je een <b>programma</b>, en een programma toont alleen iets op het scherm als je het daarom vraagt. Daarom zet je de berekening altijd tussen <code>print( )</code>:<pre>print(12 + 27)</pre></div>`,
  sections:[
  { title:"3.1 Gehele getallen", html:`<p><b>Gehele getallen</b> zijn getallen zonder komma: 0, 1, 2, 3, … maar ook de negatieve getallen −1, −2, −3, … In Python heet dit soort getal een <b>int</b> (van het Engelse <i>integer</i>, ‘geheel getal’).</p>
    <p>Getallen met een komma, zoals 2,5, zijn <b>geen</b> gehele getallen. Die leer je verderop in dit hoofdstuk kennen.</p>`,
    items:[
    {id:"h3-mc1", type:"mc", q:"Welk getal is een geheel getal (int)?", options:["−12","2,5","0,75"], correct:0, explain:"−12 heeft geen cijfers na de komma, dus het is een geheel getal. Ook negatieve getallen kunnen gehele getallen zijn."},
    {id:"h3-fill1", type:"fill", q:"Hoe heet een geheel getal in Python? (Typ het woord van 3 letters.)", answers:["int"], explain:"int, van het Engelse integer."}
  ]},
  { title:"3.2 De vier rekenkundige operatoren", html:`<p>Om te rekenen gebruik je <b>rekenkundige operatoren</b>. Twee ervan ken je al uit de wiskundeles, twee zien er anders uit:</p>
    <table><tr><th>Bewerking</th><th>Operator</th><th>Voorbeeld</th><th>Resultaat</th></tr>
    <tr><td>optellen</td><td><code>+</code></td><td><code>print(12 + 27)</code></td><td>39</td></tr>
    <tr><td>aftrekken</td><td><code>-</code></td><td><code>print(36 - 14)</code></td><td>22</td></tr>
    <tr><td>vermenigvuldigen</td><td><code>*</code> (sterretje)</td><td><code>print(7 * 8)</code></td><td>56</td></tr>
    <tr><td>delen</td><td><code>/</code> (schuine streep)</td><td><code>print(100 / 4)</code></td><td>25.0</td></tr></table>
    <p style="margin-top:10px">Let op: vermenigvuldigen doe je in Python met een <b>sterretje</b> <code>*</code>, niet met een x of een punt.</p>`,
    items:[
    {id:"h3-try1", type:"play", q:"Voer deze berekeningen uit. Verander daarna gerust de getallen en probeer opnieuw!", starter:'print(12 + 27)\nprint(36 - 14)\nprint(7 * 8)\nprint(100 / 4)'},
    {id:"h3-match", type:"match", q:"Welke operator hoort bij welke bewerking?", pairs:[["+","optellen"],["-","aftrekken"],["*","vermenigvuldigen"],["/","delen"]]},
    {id:"h3-fill2", type:"fill", q:"Wat toont <code>print(15 - 6)</code>?", answers:["9"], explain:"15 − 6 = 9"},
    {id:"h3-fill3", type:"fill", q:"Wat toont <code>print(6 * 4)</code>?", answers:["24"], explain:"6 × 4 = 24"},
    {id:"h3-mc2", type:"mc", q:"Wat gebeurt er als je <code>print(7 x 8)</code> schrijft?", options:["Python toont 56","Python geeft een foutmelding (SyntaxError)","Python toont 7 x 8"], correct:1, explain:"Python kent de x niet als maalteken. Gebruik altijd het sterretje: 7 * 8."}
  ]},
  { title:"3.3 Spaties maken niet uit", html:`<p>Rond een operator mag je zoveel spaties zetten als je wilt: Python negeert ze. <code>print(12+27)</code> en <code>print(12   +   27)</code> geven allebei 39.</p>
    <p>Toch is het een goede gewoonte om <b>één spatie</b> rond een operator te zetten, zoals <code>12 + 27</code>. Zo is je code makkelijker te lezen.</p>`,
    items:[
    {id:"h3-tf1", type:"tf", q:"Juist of fout?", parts:[
      {s:"print(12+27) en print(12 + 27) tonen hetzelfde resultaat.", a:true, explain:"Spaties rond een operator maken niet uit."},
      {s:"Het is een goede gewoonte om één spatie rond een operator te zetten.", a:true, explain:"Zo leest je code makkelijker."},
      {s:"Voor vermenigvuldigen gebruik je in Python de letter x.", a:false, explain:"Je gebruikt het sterretje *."}
    ]}
  ]},
  { title:"3.4 Delen geeft een kommagetal", html:`<p>Bij <code>print(100 / 4)</code> toont Python <b>25.0</b> en niet 25. Hoe komt dat?</p>
    <p>Als je deelt, is het resultaat vaak geen geheel getal (denk aan 9 / 2 = 4,5). Daarom geeft een deling in Python <b>altijd</b> een kommagetal, ook als de uitkomst toevallig ‘mooi’ uitkomt. Zo’n kommagetal heet in Python een <b>float</b>.</p>
    <div class="box"><b>Onthoud</b><br><code>+</code>, <code>-</code> en <code>*</code> met gehele getallen geven een geheel getal (int).<br><code>/</code> geeft altijd een kommagetal (float).</div>`,
    items:[
    {id:"h3-mc3", type:"mc", q:"Waarom toont <code>print(100 / 4)</code> het resultaat 25.0 en niet 25?", options:["Omdat Python zich verrekent","Omdat een deling in Python altijd een kommagetal (float) geeft","Omdat 100 een kommagetal is"], correct:1, explain:"Een deling met / geeft in Python altijd een float."},
    {id:"h3-fill4", type:"fill", q:"Wat toont <code>print(9 / 2)</code>? (Let op: Python gebruikt een punt!)", answers:["4.5"], explain:"9 / 2 = 4.5"},
    {id:"h3-fill5", type:"fill", q:"Wat toont <code>print(10 / 5)</code>?", answers:["2.0"], explain:"Een deling geeft altijd een float, dus 2.0 en niet 2."}
  ]},
  { title:"3.5 Een punt, geen komma!", html:`<p>In België schrijven we een kommagetal met een komma: 3,5. Python is een Engelstalige taal en gebruikt daarom een <b>punt</b>: <code>3.5</code>.</p>
    <p>Gebruik je toch een komma, dan krijg je een vreemd resultaat. Probeer het maar:</p>`,
    items:[
    {id:"h3-try2", type:"play", q:"Voer beide regels uit en vergelijk.", starter:'print(3.5 + 6.4)\nprint(3,5 + 6,4)'},
    {id:"h3-mc4", type:"mc", q:"Wat toont de tweede regel, <code>print(3,5 + 6,4)</code>?", options:["9.9","3 11 4","Een foutmelding"], correct:1, explain:"De komma scheidt in print() verschillende waarden. Python toont dus 3, dan 5 + 6 = 11, en dan 4. Gebruik voor kommagetallen altijd een punt!"},
    {id:"h3-mc5", type:"mc", q:"Hoe schrijf je het getal ‘twee komma vijf’ in Python?", options:["2,5","2.5","2 5"], correct:1, explain:"Python gebruikt een punt als decimaalteken."}
  ]},
  { title:"3.6 Oefeningen: laat Python rekenen", html:`<p>Schrijf telkens een programma dat de berekening <b>zelf laat uitvoeren</b> door Python. Het antwoord zelf intypen telt niet: de computer moet rekenen!</p>`,
    items:[
    {id:"h3-code1", type:"code", q:"Laat Python <b>123 + 456</b> berekenen en toon het resultaat.", starter:"",
      expect:["579"], must:[[/123\s*\+\s*456|456\s*\+\s*123/,"Laat Python zelf rekenen: schrijf de berekening 123 + 456 tussen de haakjes van print."]], hint:"print(123 + 456)", ok:"Juist! Python rekende 123 + 456 = 579 uit."},
    {id:"h3-code2", type:"code", q:"Een pizza kost 12 euro. Je koopt er 3. Laat Python berekenen hoeveel je moet betalen.", starter:"",
      expect:["36"], must:[[/\*/,"Gebruik een vermenigvuldiging met *."]], hint:"print(12 * 3)", ok:"Juist! 3 pizza’s kosten 36 euro."},
    {id:"h3-code3", type:"code", q:"Je verdeelt 36 snoepjes eerlijk over 4 vrienden. Laat Python berekenen hoeveel snoepjes elke vriend krijgt.", starter:"",
      expect:["9.0"], must:[[/\//,"Gebruik een deling met /."]], hint:"print(36 / 4)", ok:"Juist! Iedereen krijgt 9 snoepjes. Zie je dat Python 9.0 toont? Dat komt doordat delen altijd een float geeft."},
    {id:"h3-code4", type:"code", q:"Schrijf een programma met vier <code>print</code>-regels dat met de getallen <b>20 en 5</b> achtereenvolgens de som, het verschil, het product en het quotiënt toont.", starter:"",
      expect:["25","15","100","4.0"], must:[[/20\s*\+\s*5/,"Laat Python 20 + 5 uitrekenen."],[/20\s*-\s*5/,"Laat Python 20 - 5 uitrekenen."],[/20\s*\*\s*5/,"Laat Python 20 * 5 uitrekenen."],[/20\s*\/\s*5/,"Laat Python 20 / 5 uitrekenen."]], hint:"print(20 + 5)\nprint(20 - 5)\nprint(20 * 5)\nprint(20 / 5)", ok:"Super! Je gebruikte alle vier de operatoren."},
    {id:"h3-code5", type:"code", q:"Uitdaging: een week heeft 7 dagen, een dag 24 uur en een uur 60 minuten. Laat Python berekenen hoeveel minuten er in een week zitten. (Tip: je mag meerdere operatoren in één berekening gebruiken.)", starter:"",
      expect:["10080"], must:[[/7\s*\*\s*24\s*\*\s*60|\*.*\*/,"Laat Python de berekening met * zelf uitvoeren."]], hint:"print(7 * 24 * 60)", ok:"Knap! Een week telt 10080 minuten."}
  ]},
  { title:"Terugblik", items:[
    {id:"h3-self", type:"checklist", q:"Wat kan ik nu? Vink af wat je kunt.", parts:["Ik weet wat een geheel getal (int) is.","Ik kan optellen, aftrekken, vermenigvuldigen en delen in Python.","Ik weet dat ik voor vermenigvuldigen * gebruik.","Ik weet dat delen altijd een kommagetal (float) geeft.","Ik gebruik een punt in kommagetallen, geen komma."]},
    {id:"h3-open1", type:"open", q:"Mijn vragen voor mijn leerkracht (mag ook leeg blijven):", optional:true}
  ]}
  ]
},
{ id:"h4", short:"4. print() en strings", title:"Hoofdstuk 4 – De functie print() en het datatype string",
  video:"https://youtu.be/_uoBdW-D9mg", videoTitle:"Video 4: De functie print() en het datatype \"string\"",
  intro:`<p>Je gebruikt <code>print()</code> al sinds hoofdstuk 2. In dit hoofdstuk leer je wat een <b>functie</b> eigenlijk is, en wat een <b>string</b> is: het soort gegevens waarmee je tekst opslaat.</p>
  <div class="box"><b>Zo werk je</b><br>Bekijk eerst het filmpje. Lees daarna elk stukje, probeer de voorbeelden uit met <b>▶ Uitvoeren</b> en maak de vragen en oefeningen.</div>
  <div class="box warm"><b>Let op</b><br>Ook in dit filmpje werkt men in de console. In onze cursus zet je alles in een programma, maar <code>print()</code> werkt precies hetzelfde.</div>`,
  sections:[
  { title:"4.1 Wat is een functie?", html:`<p>Een <b>functie</b> is een opdracht die Python voor je uitvoert. Vergelijk het met een hond die je commando’s geeft: ‘zit’, ‘apport’. Python kent heel wat van die commando’s. <code>print</code> is er één van: het betekent ‘toon dit op het scherm’.</p>
    <p>Na de naam van een functie komen altijd <b>haakjes</b>: <code>print( )</code>. Die haakjes zijn een vast onderdeel van de functie. Zonder haakjes is de opdracht niet volledig en begrijpt Python ze niet.</p>`,
    items:[
    {id:"h4-mc1", type:"mc", q:"Wat is een functie in Python?", options:["Een getal met een komma","Een opdracht die Python voor je uitvoert","Een foutmelding"], correct:1, explain:"Een functie is een opdracht, zoals print(): ‘toon dit op het scherm’."},
    {id:"h4-mc2", type:"mc", q:"Wat hoort altijd bij een functie, na de naam?", options:["Haakjes ( )","Een uitroepteken !","Een dubbelpunt :"], correct:0, explain:"De haakjes zijn een vast onderdeel van elke functie."}
  ]},
  { title:"4.2 Wat staat er tussen de haakjes?", html:`<p>Tussen de haakjes geef je de functie de informatie die ze nodig heeft. Bij de hond: zeg je ‘apport’, dan moet je ook zeggen <i>wat</i> hij moet brengen: de stok, de bal of de sleutels.</p>
    <p>Bij <code>print()</code> zet je tussen de haakjes <b>wat</b> er op het scherm moet komen. Programmeurs noemen die informatie het <b>argument</b> van de functie.</p>
    <pre>print("Goedemorgen!")</pre>
    <p>Hier is <code>print</code> de functie en <code>"Goedemorgen!"</code> het argument.</p>
    <p>En als je niets tussen de haakjes zet? Dan heeft <code>print()</code> niets om te tonen, en krijg je gewoon een <b>lege regel</b>. Dat is soms handig om je uitvoer overzichtelijker te maken.</p>`,
    items:[
    {id:"h4-try1", type:"play", q:"Voer dit programma uit. Zie je de lege regel?", starter:'print("Eerste regel")\nprint()\nprint("Derde regel")'},
    {id:"h4-mc3", type:"mc", q:"In <code>print(&quot;Goedemorgen!&quot;)</code>, wat is het argument?", options:["print","\"Goedemorgen!\"","de haakjes"], correct:1, explain:"Het argument is de informatie tussen de haakjes: wat er getoond moet worden."},
    {id:"h4-mc4", type:"mc", q:"Wat doet <code>print()</code> met niets tussen de haakjes?", options:["Het geeft een foutmelding","Het toont een lege regel","Het toont het woord print"], correct:1, explain:"Zonder argument toont print() een lege regel."}
  ]},
  { title:"4.3 Het datatype string", html:`<p>Een <b>string</b> is een reeks tekens: letters, cijfers, leestekens, symbolen en ook spaties. Je herkent een string aan de <b>aanhalingstekens</b> errond. Die geven aan waar de string begint en waar hij eindigt.</p>
    <pre>"Hallo"
"Ik ben 15 jaar."
"5 + 3"
"@#!?"</pre>
    <p>Dit zijn allemaal strings, ook <code>"5 + 3"</code>! Alles tussen aanhalingstekens is voor Python gewoon tekst, en wordt dus letterlijk getoond. Python rekent er niet mee.</p>
    <div class="box"><b>Onthoud</b><br>Je kent nu al drie datatypes:<br>• <b>int</b>: gehele getallen, zoals <code>27</code><br>• <b>float</b>: kommagetallen, zoals <code>2.5</code><br>• <b>string</b>: tekst tussen aanhalingstekens, zoals <code>"Hallo"</code></div>
    <p>Probeer het verschil tussen tekst en een berekening zelf uit:</p>`,
    items:[
    {id:"h4-try2", type:"play", q:"Voer uit en vergelijk de twee regels.", starter:'print("12 + 27")\nprint(12 + 27)'},
    {id:"h4-fill1", type:"fill", q:"Wat toont <code>print(&quot;12 + 27&quot;)</code>?", answers:["12 + 27","12+27"], explain:"Tussen aanhalingstekens is het een string: Python toont de tekst letterlijk en rekent niet."},
    {id:"h4-fill2", type:"fill", q:"Wat toont <code>print(12 + 27)</code>?", answers:["39"], explain:"Zonder aanhalingstekens is het een berekening: Python rekent 12 + 27 = 39 uit."},
    {id:"h4-mc5", type:"mc", q:"Welke van deze is een string?", options:["42","3.14","\"42\""], correct:2, explain:"\"42\" staat tussen aanhalingstekens, dus het is een string (tekst). 42 is een int en 3.14 een float."},
    {id:"h4-match", type:"match", q:"Welk datatype hoort bij welke waarde?", pairs:[["27","int (geheel getal)"],["2.5","float (kommagetal)"],["\"Hallo\"","string (tekst)"]]}
  ]},
  { title:"4.4 Valkuilen: haakjes en aanhalingstekens", html:`<p>Bij <code>print()</code> gaan er vaak dezelfde dingen mis. Gelukkig vertelt Python je met een foutmelding wat er scheelt. In het programma hieronder staan drie fouten. Voer het uit, en kijk naar de foutmelding.</p>
    <table><tr><th>Fout</th><th>Foutmelding</th><th>Wat is er mis?</th></tr>
    <tr><td><code>print "Welkom"</code></td><td>SyntaxError: Missing parentheses…</td><td>De <b>haakjes</b> ontbreken.</td></tr>
    <tr><td><code>print("Tot ziens)</code></td><td>SyntaxError: unterminated string literal</td><td>Het <b>laatste aanhalingsteken</b> ontbreekt: Python weet niet waar de string eindigt.</td></tr>
    <tr><td><code>print(Hallo)</code></td><td>NameError: name 'Hallo' is not defined</td><td>De <b>aanhalingstekens</b> ontbreken: Python denkt dat Hallo de naam van iets is, en kent die naam niet.</td></tr></table>
    <p style="margin-top:10px">Python toont altijd <b>één fout tegelijk</b>. Verbeter je die, dan toont Python de volgende. Schrijffouten zoals een vergeten haakje of aanhalingsteken ontdekt Python als eerste, nog vóór het programma start. Daarom komt de fout op regel 1 hier pas als laatste aan de beurt.</p>`,
    items:[
    {id:"h4-mc6", type:"mc", q:"Je schrijft <code>print(Hallo)</code>. Wat is er mis?", options:["De haakjes ontbreken","De aanhalingstekens rond Hallo ontbreken","Er staat een hoofdletter in"], correct:1, explain:"Zonder aanhalingstekens is Hallo geen tekst. Python zoekt dan iets met de naam Hallo, en vindt dat niet: NameError."},
    {id:"h4-mc7", type:"mc", q:"Welke foutmelding krijg je als je de haakjes vergeet, zoals in <code>print &quot;Welkom&quot;</code>?", options:["SyntaxError: Missing parentheses in call to 'print'","NameError: name 'Welkom' is not defined","Er komt geen fout, Python toont Welkom"], correct:0, explain:"‘Missing parentheses’ betekent: de haakjes ontbreken."},
    {id:"h4-code1", type:"code", q:"In dit programma staan drie fouten. Verbeter ze zodat het programma drie regels toont: <i>Hallo</i>, <i>Welkom</i> en <i>Tot ziens</i>. Tip: voer het eerst uit en lees de foutmelding.", starter:'print(Hallo)\nprint "Welkom"\nprint("Tot ziens)',
      expect:["Hallo","Welkom","Tot ziens"], hint:'print("Hallo")\nprint("Welkom")\nprint("Tot ziens")', ok:"Knap! Je hebt alle drie de fouten gevonden en verbeterd."}
  ]},
  { title:"4.5 Oefeningen", items:[
    {id:"h4-code2", type:"code", q:"Laat het programma precies deze zin tonen: <b>Ik leer Python!</b>", starter:"",
      expect:["Ik leer Python!"], hint:'print("Ik leer Python!")', ok:"Juist!"},
    {id:"h4-code3", type:"code", q:"Laat het programma eerst de tekst <b>5 + 3</b> tonen, en op de volgende regel de <b>uitkomst</b> van die berekening. Laat Python zelf rekenen!", starter:"",
      expect:["5 + 3","8"], must:[[/print\(\s*["']\s*5\s*\+\s*3\s*["']\s*\)/,"Toon op de eerste regel de tekst 5 + 3: zet die tussen aanhalingstekens."],[/print\(\s*5\s*\+\s*3\s*\)/,"Laat Python op de tweede regel 5 + 3 uitrekenen: zonder aanhalingstekens."]],

    {id:"h4-code5", type:"code", q:"Uitdaging: teken met <code>print()</code> deze kerstboom. Let op: de spaties vooraan tellen mee!<pre>  *\n ***\n*****\n  |</pre>", starter:"",
      expect:["  *"," ***","*****","  |"], exact:true, hint:'print("  *")\nprint(" ***")\nprint("*****")\nprint("  |")', ok:"Prachtig! Ook spaties zijn tekens in een string."}

{ id:"h5", short:"5. Variabelen", title:"Hoofdstuk 5 – Variabelen en de toekenning",
  video:"https://youtu.be/rKFJ8tRvqFk", videoTitle:"Video 5: Variabelen en lades",
  video2:"https://youtu.be/V58gHCwSxrw", video2Title:"Video 6: De toekenning (assignment statement)",
  intro:`<p>Programma’s moeten dingen kunnen <b>onthouden</b>: een naam, een score, een prijs. Daarvoor gebruik je <b>variabelen</b>. In dit hoofdstuk leer je wat een variabele is en hoe je er een waarde in bewaart.</p>
  <div class="box"><b>Zo werk je</b><br>Bij dit hoofdstuk horen twee filmpjes. Bekijk eerst <b>video 5</b> en maak 5.1. Bekijk daarna <b>video 6</b> en maak de rest.</div>
  <div class="box warm"><b>Let op</b><br>In video 6 typt men soms alleen de naam van een variabele om de waarde te zien. Dat werkt alleen in de console. In een programma gebruik je <code>print( )</code>: <code>print(dag)</code>.</div>`,
  sections:[
  { title:"5.1 Wat is een variabele?", html:`<p>Het geheugen van een computer kun je vergelijken met een enorme kast met duizenden <b>lades</b>. In zo’n lade kun je iets bewaren. Op elke lade kleeft een <b>label</b>, zodat je later terugvindt wat je erin stak.</p>
    <p>Een <b>variabele</b> werkt net zo. Ze heeft:</p>
    <ul><li>een <b>naam</b>: het label op de lade, bijvoorbeeld <code>leeftijd</code>;</li><li>een <b>waarde</b>: wat er in de lade zit, bijvoorbeeld <code>15</code>.</li></ul>
    <p>Twee lades met hetzelfde label zouden voor verwarring zorgen. Daarom kan een naam maar bij <b>één</b> variabele horen.</p>
    <div class="box"><b>Denk aan je telefoon</b><br>In je contacten zoek je op een <b>naam</b>, en je telefoon zoekt het <b>nummer</b> erbij. Een naam onthouden is veel makkelijker dan een nummer. En verandert iemand van nummer, dan pas je alleen het nummer aan: de naam blijft hetzelfde.</div>`,
    items:[
    {id:"h5-mc1", type:"mc", q:"Welke twee dingen heeft elke variabele?", options:["Een naam en een waarde","Een kleur en een grootte","Een lade en een sleutel"], correct:0, explain:"De naam is het label, de waarde is wat er in de lade zit."},
    {id:"h5-match1", type:"match", q:"Verbind de vergelijking met de lade met wat het betekent bij een variabele.", pairs:[["Het label op de lade","De naam van de variabele"],["Wat er in de lade zit","De waarde van de variabele"],["De kast met lades","Het geheugen van de computer"]]}
  ]},
  { title:"5.2 De toekenning", html:`<p>Met een <b>toekenning</b> maak je een variabele en geef je ze meteen een waarde. Je herkent een toekenning aan het <b>=-teken</b>:</p>
    <pre>hoofdpersonage = "Harry Potter"
rugnummer = 7
pi = 3.14</pre>
    <p>Links van het =-teken staat altijd de <b>naam</b>, rechts de <b>waarde</b>. Een waarde kan een string, een int of een float zijn.</p>
    <div class="box"><b>Let op: = betekent hier niet ‘is gelijk aan’</b><br>Lees <code>rugnummer = 7</code> als: ‘de variabele <i>rugnummer</i> <b>krijgt</b> de waarde 7’. Omdat het =-teken een richting heeft, werkt het omgekeerde niet: <code>7 = rugnummer</code> geeft een foutmelding.</div>
    <p>Wil je de waarde van een variabele zien? Zet de naam tussen de haakjes van <code>print()</code>, <b>zonder</b> aanhalingstekens:</p>`,
    items:[
    {id:"h5-try1", type:"play", q:"Voer uit. Zie je het verschil tussen de laatste twee regels?", starter:'dier = "kat"\nprint(dier)\nprint("dier")'},
    {id:"h5-mc2", type:"mc", q:"Wat toont <code>print(&quot;dier&quot;)</code>, met aanhalingstekens?", options:["kat","dier","Een foutmelding"], correct:1, explain:"Met aanhalingstekens is het een string: Python toont het woord dier letterlijk. Zonder aanhalingstekens, print(dier), toont Python de waarde van de variabele: kat."},
    {id:"h5-mc3", type:"mc", q:"Hoe lees je <code>score = 10</code>?", options:["score is gelijk aan 10","de variabele score krijgt de waarde 10","10 krijgt de waarde score"], correct:1, explain:"Het =-teken is een toekenning: de naam links krijgt de waarde rechts."},
    {id:"h5-mc4", type:"mc", q:"Wat gebeurt er bij <code>7 = rugnummer</code>?", options:["rugnummer krijgt de waarde 7","Python geeft een foutmelding","Python toont 7"], correct:1, explain:"De naam moet links staan. Python geeft een SyntaxError: cannot assign to literal."}
  ]},
  { title:"5.3 Een goede naam kiezen", html:`<p>Een variabelenaam kies je zelf, maar er zijn een paar regels:</p>
    <table><tr><th>Regel</th><th>Goed</th><th>Fout</th></tr>
    <tr><td>Geen spaties. Gebruik een liggend streepje <code>_</code></td><td><code>mijn_leeftijd</code></td><td><code>mijn leeftijd</code></td></tr>
    <tr><td>Begin met een letter, niet met een cijfer</td><td><code>vak2</code></td><td><code>2de_vak</code></td></tr>
    <tr><td>Geen leestekens of rare tekens</td><td><code>score</code></td><td><code>score!</code></td></tr></table>
    <p style="margin-top:10px">Let ook op hoofdletters: voor Python zijn <code>naam</code> en <code>Naam</code> twee <b>verschillende</b> namen. Gebruik daarom gewoon altijd kleine letters.</p>
    <p>Kies tot slot een naam die zegt wat erin zit. <code>prijs_pizza</code> is veel duidelijker dan <code>x</code>.</p>`,
    items:[
    {id:"h5-tf1", type:"tf", q:"Is dit een geldige variabelenaam? Duid ‘Juist’ aan als de naam mag, en ‘Fout’ als hij niet mag.", parts:[
      {s:"mijn_leeftijd", a:true, explain:"Een liggend streepje in plaats van een spatie: prima."},
      {s:"mijn leeftijd", a:false, explain:"Er staat een spatie in de naam."},
      {s:"2de_vak", a:false, explain:"Een naam mag niet met een cijfer beginnen."},
      {s:"vak2", a:true, explain:"Een cijfer mag wel, zolang het niet vooraan staat."},
      {s:"prijs_pizza", a:true, explain:"Een duidelijke, geldige naam."}
    ]},
    {id:"h5-code1", type:"code", q:"In dit programma staan drie fouten in de toekenningen. Verbeter ze zodat het programma <i>Sara</i>, <i>wiskunde</i> en <i>15</i> toont. Laat de <code>print</code>-regels zoals ze zijn.", starter:'mijn naam = "Sara"\n2de_vak = "wiskunde"\n15 = leeftijd\nprint(mijn_naam)\nprint(tweede_vak)\nprint(leeftijd)',
      expect:["Sara","wiskunde","15"], must:[[/print\(\s*mijn_naam\s*\)/,"Laat de print-regels staan zoals ze waren."],[/print\(\s*tweede_vak\s*\)/,"Laat de print-regels staan zoals ze waren."],[/print\(\s*leeftijd\s*\)/,"Laat de print-regels staan zoals ze waren."]],
      hint:'mijn_naam = "Sara"\ntweede_vak = "wiskunde"\nleeftijd = 15\nprint(mijn_naam)\nprint(tweede_vak)\nprint(leeftijd)', ok:"Knap! Je hebt alle drie de fouten verbeterd."}
  ]},
  { title:"5.4 Een waarde veranderen", html:`<p>Je kunt de waarde van een variabele later veranderen met een nieuwe toekenning. De oude waarde wordt dan <b>overschreven</b>: Python onthoudt alleen de <b>laatste</b> waarde.</p>
    <p>Een variabele kan daarbij zelfs van datatype veranderen: eerst een string, daarna een int.</p>`,
    items:[
    {id:"h5-try2", type:"play", q:"Voer uit en volg wat er met de variabele dag gebeurt.", starter:'dag = "donderdag"\nprint(dag)\ndag = "vrijdag"\nprint(dag)\ndag = 21\nprint(dag)'},
    {id:"h5-fill1", type:"fill", q:"Wat toont dit programma?<pre>kleur = \"rood\"\nkleur = \"blauw\"\nprint(kleur)</pre>", answers:["blauw"], explain:"De tweede toekenning overschrijft de eerste. Python onthoudt alleen de laatste waarde: blauw."},
    {id:"h5-fill2", type:"fill", q:"Wat toont dit programma?<pre>punten = 5\nprint(punten)\npunten = 8</pre>", answers:["5"], explain:"Op het moment van print() is de waarde nog 5. De nieuwe waarde 8 komt pas daarna."}
  ]},
  { title:"5.5 Oefeningen", items:[
    {id:"h5-code2", type:"code", q:"Maak een variabele <code>lievelingsdier</code> met jouw lievelingsdier als waarde. Toon daarna de waarde met <code>print(lievelingsdier)</code>.", starter:"",
      anyLines:1, must:[[/lievelingsdier\s*=\s*["']/,"Maak de variabele lievelingsdier met een string als waarde, bijvoorbeeld lievelingsdier = \"hond\"."],[/print\(\s*lievelingsdier\s*\)/,"Toon de waarde met print(lievelingsdier), zonder aanhalingstekens."]],
      hint:'lievelingsdier = "hond"\nprint(lievelingsdier)', ok:"Juist! Je maakte je eerste variabele."},
    {id:"h5-code3", type:"code", q:"De variabele <code>weer</code> krijgt eerst de waarde <b>regen</b>. Toon ze. Verander daarna de waarde in <b>zon</b> en toon ze opnieuw. Gebruik twee keer <code>print(weer)</code>.", starter:"",
      expect:["regen","zon"], must:[[/weer\s*=\s*["']regen["'][\s\S]*weer\s*=\s*["']zon["']/,"Geef weer eerst de waarde \"regen\" en daarna de waarde \"zon\"."],[/print\(\s*weer\s*\)[\s\S]*print\(\s*weer\s*\)/,"Toon de waarde twee keer met print(weer)."]],
      hint:'weer = "regen"\nprint(weer)\nweer = "zon"\nprint(weer)', ok:"Super! De tweede toekenning overschreef de eerste waarde."},
    {id:"h5-code4", type:"code", q:"Maak een variabele <code>pi</code> met de waarde <b>3.14</b>. Toon eerst de tekst <b>De waarde van pi is:</b> en op de volgende regel de waarde van de variabele.", starter:"",
      expect:["De waarde van pi is:","3.14"], must:[[/pi\s*=\s*3\.14/,"Maak de variabele pi = 3.14 (met een punt!)."],[/print\(\s*pi\s*\)/,"Toon de waarde met print(pi)."]],
      hint:'pi = 3.14\nprint("De waarde van pi is:")\nprint(pi)', ok:"Juist! Let op het verschil: de tekst staat tussen aanhalingstekens, de variabele niet."},
    {id:"h5-code5", type:"code", q:"Uitdaging: maak drie variabelen over jezelf: <code>voornaam</code> (een string), <code>leeftijd</code> (een geheel getal) en <code>lengte</code> (in meter, een kommagetal zoals 1.65). Toon ze daarna elk op een eigen regel.", starter:"",
      anyLines:3, must:[[/voornaam\s*=\s*["']/,"voornaam moet een string zijn: zet de waarde tussen aanhalingstekens."],[/leeftijd\s*=\s*\d+\s*($|\n|#)/,"leeftijd moet een geheel getal zijn, zonder aanhalingstekens, bijvoorbeeld leeftijd = 15."],[/lengte\s*=\s*\d+\.\d+/,"lengte moet een kommagetal zijn, met een punt, bijvoorbeeld lengte = 1.65."],[/print\(\s*voornaam\s*\)/,"Toon voornaam met print(voornaam)."],[/print\(\s*leeftijd\s*\)/,"Toon leeftijd met print(leeftijd)."],[/print\(\s*lengte\s*\)/,"Toon lengte met print(lengte)."]],
      hint:'voornaam = "Sara"\nleeftijd = 15\nlengte = 1.65\nprint(voornaam)\nprint(leeftijd)\nprint(lengte)', ok:"Knap! Je gebruikte drie verschillende datatypes: een string, een int en een float."}
  ]},
  { title:"Terugblik", items:[
    {id:"h5-self", type:"checklist", q:"Wat kan ik nu? Vink af wat je kunt.", parts:["Ik weet wat een variabele is (naam en waarde).","Ik kan een variabele maken met een toekenning (=).","Ik ken het verschil tussen print(dier) en print(\"dier\").","Ik ken de regels voor een goede variabelenaam.","Ik weet dat een nieuwe toekenning de oude waarde overschrijft."]},

{ id:"h6", short:"6. Expressies", title:"Hoofdstuk 6 – Expressies en commentaar",
  video:"https://youtu.be/KIQjDof8V-k", videoTitle:"Video 7: Werken met variabelen, expressies en commentaarregels",
  intro:`<p>Nu je variabelen kent, ga je ermee <b>rekenen</b>. Je leert wat een <b>expressie</b> is en hoe je met <b>commentaar</b> uitleg in je code zet.</p>
  <div class="box"><b>Zo werk je</b><br>Bekijk eerst het filmpje. Lees daarna elk stukje, probeer de voorbeelden uit met <b>▶ Uitvoeren</b> en maak de vragen en oefeningen.</div>
  <div class="box warm"><b>Let op</b><br>In het filmpje schrijft men het programma in een aparte editor en slaat men het op met een naam. Bij ons schrijf je het gewoon in het codevak: je werk wordt automatisch bewaard.</div>`,
  sections:[
  { title:"6.1 Een programma in stappen", html:`<p>In het filmpje wordt een programma geschreven dat twee getallen optelt. Het werkt in vier stappen:</p>
    <ol><li>De variabele <code>getal_1</code> krijgt de waarde 15.</li><li>De variabele <code>getal_2</code> krijgt de waarde 4.</li><li>De variabele <code>som</code> krijgt de uitkomst van <code>getal_1 + getal_2</code>.</li><li>Het programma toont de waarde van <code>som</code>.</li></ol>
    <p>Voer het programma uit. De regels die met <code>#</code> beginnen, leer je verderop kennen.</p>`,
    items:[
    {id:"h6-try1", type:"play", q:"Voer het programma uit.", starter:'# Eerste getal\ngetal_1 = 15\n\n# Tweede getal\ngetal_2 = 4\n\n# Som van beide getallen\nsom = getal_1 + getal_2\n\n# Toon het resultaat\nprint(som)'},
    {id:"h6-fill1", type:"fill", q:"Welk getal toont het programma?", answers:["19"], explain:"15 + 4 = 19"}
  ]},
  { title:"6.2 Wat is een expressie?", html:`<p>Kijk naar deze regel:</p>
    <pre>som = getal_1 + getal_2</pre>
    <p>Rechts van het =-teken staat <code>getal_1 + getal_2</code>. Dat is een <b>expressie</b>: een combinatie van <b>waarden</b>, <b>variabelen</b> en <b>operatoren</b> die samen <b>één waarde</b> oplevert.</p>
    <p>Wat doet Python met zo’n regel? Het werkt altijd <b>van rechts naar links</b>:</p>
    <ol><li>Python vervangt de variabelen door hun waarde: <code>15 + 4</code>.</li><li>Python rekent de expressie uit: <code>19</code>.</li><li>Python kent die uitkomst toe aan de variabele links: <code>som</code> krijgt de waarde 19.</li></ol>
    <p>Een expressie mag ook rechtstreeks tussen de haakjes van <code>print()</code> staan. Dan toont Python meteen de uitkomst: <code>print(getal_1 + getal_2)</code> toont ook 19.</p>
    <div class="box"><b>Onthoud</b><br>Een expressie levert altijd <b>één waarde</b> op.</div>`,
    items:[
    {id:"h6-mc1", type:"mc", q:"Wat is een expressie?", options:["Een regel die met # begint","Een combinatie van waarden, variabelen en operatoren die samen één waarde oplevert","Een foutmelding van Python"], correct:1, explain:"Een expressie, zoals getal_1 + getal_2, levert altijd één waarde op."},
    {id:"h6-mc2", type:"mc", q:"In <code>totaal = prijs * aantal</code>, wat is de expressie?", options:["totaal","prijs * aantal","totaal = prijs * aantal"], correct:1, explain:"De expressie staat rechts van het =-teken. De uitkomst ervan wordt toegekend aan totaal."},
    {id:"h6-mc3", type:"mc", q:"Wat doet Python als eerste bij <code>som = getal_1 + getal_2</code>?", options:["De waarde toekennen aan som","De variabelen getal_1 en getal_2 vervangen door hun waarde","De uitkomst op het scherm tonen"], correct:1, explain:"Eerst vervangt Python de variabelen door hun waarde, dan rekent het, en pas daarna kent het de uitkomst toe aan som."},
    {id:"h6-fill2", type:"fill", q:"Wat toont dit programma?<pre>a = 6\nb = 3\nc = a * b\nprint(c)</pre>", answers:["18"], explain:"c krijgt de waarde van 6 * 3 = 18."},
    {id:"h6-fill3", type:"fill", q:"Wat toont dit programma?<pre>prijs = 4\naantal = 5\nprint(prijs * aantal)</pre>", answers:["20"], explain:"De expressie prijs * aantal staat rechtstreeks in print(): 4 * 5 = 20."}
  ]},
  { title:"6.3 Commentaar met #", html:`<p>Een regel die begint met een <b>hekje</b> <code>#</code> is <b>commentaar</b>. Python slaat zo’n regel over, alsof hij er niet staat. Commentaar is er dus niet voor de computer, maar voor <b>mensen</b>: jijzelf, of iemand anders die je code leest.</p>
    <p>Met commentaar leg je uit wat een stuk code doet. Zo begrijp je je programma later nog, ook als je het een tijd niet bekeken hebt.</p>
    <p>Commentaar is ook handig om een regel code <b>tijdelijk uit te schakelen</b>: zet er een <code>#</code> voor, en Python voert hem niet meer uit. Haal je het hekje weg, dan doet de regel weer mee.</p>`,
    items:[
    {id:"h6-try2", type:"play", q:"Voer uit. Welke regels verschijnen niet?", starter:'# Dit is commentaar: Python slaat deze regel over\nprint("Regel 1")\n# print("Regel 2")\nprint("Regel 3")'},

{ id:"h7", short:"7. Invoer", title:"Hoofdstuk 7 – Invoer: input() en int()",
  video:"https://youtu.be/BG4Ol_vLUB8", videoTitle:"Video 8: De functie input() & het plakken van strings",
  video2:"https://youtu.be/OH2QwmtQO88", video2Title:"Video 9: De functie int()",
  intro:`<p>Tot nu toe stonden alle waarden vast in je code. Wilde je andere getallen optellen, dan moest je je programma aanpassen. In dit hoofdstuk leer je je programma <b>vragen stellen</b> aan de gebruiker, met <code>input()</code>. En je leert waarom je daarbij <code>int()</code> nodig hebt.</p>
  <div class="box"><b>Zo werk je</b><br>Bij dit hoofdstuk horen twee filmpjes. Bekijk eerst <b>video 8</b> en maak 7.1 tot en met 7.4. Bekijk daarna <b>video 9</b> en maak de rest.</div>`,
  sections:[
  { title:"7.1 Een vraag stellen met input()", html:`<p>Met de functie <code>input()</code> stelt je programma een vraag. Het programma <b>wacht</b> dan tot de gebruiker een antwoord typt en op Enter drukt. Dat antwoord kun je bewaren in een variabele:</p>
    <pre>voornaam = input("Wat is je voornaam? ")
print("Hallo " + voornaam)</pre>
    <p>De tekst tussen de haakjes is de <b>vraag</b> die de gebruiker te zien krijgt. Zet er altijd een vraag bij! Zonder vraag ziet de gebruiker niets, en weet hij niet dat hij iets moet intypen. Een spatie op het einde van de vraag zorgt ervoor dat het antwoord niet tegen de vraag plakt.</p>
    <div class="box warm"><b>Zo werkt invoer in deze cursus</b><br>Zodra je code <code>input()</code> bevat, verschijnt onder het codevak een blauw vak <b>Invoer</b>. Daar typ je <b>vooraf</b> wat de gebruiker zou antwoorden, één antwoord per regel. Klik je daarna op ▶ Uitvoeren, dan gebruikt het programma die antwoorden.<br>Bij <b>✓ Controleer</b> test de cursus je programma met eigen testantwoorden, dus dan maakt het niet uit wat in het vak Invoer staat.</div>`,
    items:[
    {id:"h7-try1", type:"play", q:"Voer uit. Verander daarna je naam in het vak Invoer en voer opnieuw uit.", starter:'voornaam = input("Wat is je voornaam? ")\nprint("Hallo " + voornaam)', stdin:"Sara"},
    {id:"h7-mc1", type:"mc", q:"Wat doet <code>input()</code>?", options:["Het toont een tekst en stopt het programma","Het stelt een vraag en wacht op een antwoord van de gebruiker","Het rekent een berekening uit"], correct:1, explain:"input() toont de vraag en wacht tot de gebruiker iets intypt en op Enter drukt."},
    {id:"h7-mc2", type:"mc", q:"Waarom zet je best een vraag tussen de haakjes van <code>input()</code>?", options:["Anders geeft Python een foutmelding","Anders weet de gebruiker niet dat hij iets moet intypen","Anders wordt het antwoord niet bewaard"], correct:1, explain:"input() werkt ook zonder vraag, maar dan ziet de gebruiker niets en weet hij niet wat hij moet doen."}
  ]},
  { title:"7.2 input() geeft altijd een string", html:`<p>Belangrijk om te onthouden: wat de gebruiker ook intypt, <code>input()</code> geeft <b>altijd een string</b> terug. Ook als de gebruiker een getal typt, zoals <code>15</code>, krijg je de tekst <code>"15"</code>.</p>
    <p>Drukt de gebruiker op Enter zonder iets te typen, dan krijg je een lege string: <code>""</code>.</p>`,
    items:[
    {id:"h7-mc3", type:"mc", q:"De gebruiker typt <b>15</b> bij <code>leeftijd = input(&quot;Hoe oud ben je? &quot;)</code>. Welke waarde krijgt <code>leeftijd</code>?", options:["het getal 15 (een int)","de tekst \"15\" (een string)","een foutmelding"], correct:1, explain:"input() geeft altijd een string terug, ook als de gebruiker cijfers typt."}
  ]},
  { title:"7.3 Strings aan elkaar plakken", html:`<p>Met het <b>plusteken</b> <code>+</code> kun je strings aan elkaar <b>plakken</b>:</p>
    <pre>print("ijs" + "beer")</pre>
    <p>Dit toont <code>ijsbeer</code>. Let op: Python plakt de strings <b>letterlijk</b> tegen elkaar. Wil je een spatie tussen twee woorden, dan moet je die zelf toevoegen, als een aparte string <code>" "</code> of binnen de aanhalingstekens:</p>
    <pre>voornaam = "Sara"
achternaam = "Peeters"
print(voornaam + " " + achternaam)</pre>`,
    items:[
    {id:"h7-try2", type:"play", q:"Voer uit en vergelijk de twee regels.", starter:'voornaam = "Sara"\nachternaam = "Peeters"\nprint(voornaam + achternaam)\nprint(voornaam + " " + achternaam)'},
    {id:"h7-fill1", type:"fill", q:"Wat toont <code>print(&quot;voet&quot; + &quot;bal&quot;)</code>?", answers:["voetbal"], explain:"De twee strings worden tegen elkaar geplakt: voetbal."},
    {id:"h7-fill2", type:"fill", q:"Wat toont dit programma?<pre>dier = \"hond\"\nprint(\"Mijn \" + dier + \" heet Max\")</pre>", answers:["Mijn hond heet Max"], explain:"De spaties staan binnen de aanhalingstekens, dus de woorden plakken niet tegen elkaar."}
  ]},
  { title:"7.4 Een probleem: getallen optellen", html:`<p>In het filmpje wordt het programma uit hoofdstuk 6 aangepast: het vraagt nu zelf twee getallen aan de gebruiker. Maar er loopt iets mis. Probeer maar:</p>`,
    items:[
    {id:"h7-try3", type:"play", q:"Voer uit met de getallen 7 en 93 (ze staan al in het vak Invoer). Klopt de uitkomst?", starter:'getal_1 = input("Wat is je eerste getal? ")\ngetal_2 = input("Wat is je tweede getal? ")\nprint(getal_1 + getal_2)', stdin:"7\n93"},
    {id:"h7-fill3", type:"fill", q:"Wat toonde het programma als uitkomst?", answers:["793"], explain:"Python toont 793 in plaats van 100."},
    {id:"h7-mc4", type:"mc", q:"Waarom toont het programma 793 en niet 100?", options:["Omdat Python zich verrekent","Omdat input() strings teruggeeft, en + plakt strings aan elkaar","Omdat 7 en 93 te grote getallen zijn"], correct:1, explain:"getal_1 is de string \"7\" en getal_2 de string \"93\". Het plusteken plakt ze tegen elkaar: \"793\"."}
  ]},
  { title:"7.5 De oplossing: int()", html:`<p>Met de functie <code>int()</code> zet je een string om naar een <b>geheel getal</b> (een int). Zo wordt <code>int("8")</code> het getal <code>8</code>, waarmee je wél kunt rekenen.</p>
    <p>Je kunt <code>int()</code> en <code>input()</code> in elkaar zetten. Python voert dan eerst <code>input()</code> uit, en geeft het antwoord meteen door aan <code>int()</code>:</p>
    <pre>getal_1 = int(input("Wat is je eerste getal? "))
getal_2 = int(input("Wat is je tweede getal? "))
print(getal_1 + getal_2)</pre>
    <p>Let op het aantal haakjes op het einde: twee! Eén voor <code>input(</code> en één voor <code>int(</code>.</p>
    <div class="box"><b>Let op</b><br><code>int()</code> kan alleen een tekst omzetten die er echt uitziet als een geheel getal, zoals <code>"15"</code>. Met tekst zoals <code>"hallo"</code> of een kommagetal zoals <code>"3.5"</code> krijg je een foutmelding: <b>ValueError</b>.</div>`,
    items:[
    {id:"h7-try4", type:"play", q:"Voer uit met 7 en 93. Klopt de uitkomst nu? Probeer daarna eens een woord als invoer.", starter:'getal_1 = int(input("Wat is je eerste getal? "))\ngetal_2 = int(input("Wat is je tweede getal? "))\nprint(getal_1 + getal_2)', stdin:"7\n93"},
    {id:"h7-fill4", type:"fill", q:"Wat toont <code>print(&quot;5&quot; + &quot;3&quot;)</code>?", answers:["53"], explain:"Twee strings worden aan elkaar geplakt: 53."},
    {id:"h7-fill5", type:"fill", q:"Wat toont <code>print(int(&quot;5&quot;) + int(&quot;3&quot;))</code>?", answers:["8"], explain:"int() zet beide strings om naar getallen, dus Python rekent 5 + 3 = 8."},
    {id:"h7-mc5", type:"mc", q:"Wat gebeurt er bij <code>int(&quot;hallo&quot;)</code>?", options:["Python geeft 0","Python geeft een foutmelding (ValueError)","Python geeft het woord hallo terug"], correct:1, explain:"De tekst hallo is geen geheel getal, dus int() kan hem niet omzetten: ValueError."}
  ]},
  { title:"7.6 Oefeningen", html:`<p>Bij deze oefeningen test <b>✓ Controleer</b> je programma met verschillende antwoorden. Je programma moet dus werken, wat de gebruiker ook intypt!</p>`, items:[
    {id:"h7-code1", type:"code", q:"Schrijf een programma dat vraagt hoe de gebruiker heet, en hem daarna begroet. Typt de gebruiker <b>Sara</b>, dan toont het programma: <b>Hallo Sara!</b>", starter:"",
      tests:[{inputs:["Sara"],last:"Hallo Sara!"},{inputs:["Mohamed"],last:"Hallo Mohamed!"}],

      tests:[{inputs:["Sara","Peeters"],last:"Sara Peeters"},{inputs:["Jan","Janssens"],last:"Jan Janssens"}],
      must:[[/input\([\s\S]*input\(/,"Gebruik twee keer input(): één voor de voornaam en één voor de achternaam."],[/input\(\s*["'][\s\S]*input\(\s*["']/,"Zet bij elke input() een vraag tussen de haakjes."]], stdin:"Sara\nPeeters",
      hint:'voornaam = input("Wat is je voornaam? ")\nachternaam = input("Wat is je achternaam? ")\nprint(voornaam + " " + achternaam)', ok:"Super! Vergeet nooit de spatie tussen de woorden."},
    {id:"h7-code3", type:"code", q:"Schrijf een programma dat twee gehele getallen vraagt en hun <b>som</b> toont. Toon alleen de uitkomst.", starter:"",

      tests:[{inputs:["15"],last:"25"},{inputs:["7"],last:"17"}],

{ id:"h8", short:"8. Datatypes", title:"Hoofdstuk 8 – Datatypes: type(), str() en float()",
  video:"https://youtu.be/RRPAAJ8mW80", videoTitle:"Video 10: Datatypes en de functie type()",
  video2:"https://youtu.be/RG4yR9EmR_k", video2Title:"Video 12: De functie str()",
  video3:"https://youtu.be/EQ26girUxyI", video3Title:"Video 18: De functie float()",
  intro:`<p>Je kent al drie datatypes: <b>int</b>, <b>float</b> en <b>string</b>. In dit hoofdstuk leer je hoe je met <code>type()</code> het datatype van een waarde opvraagt, en hoe je met <code>str()</code> en <code>float()</code> van het ene datatype naar het andere gaat.</p>
  <div class="box"><b>Zo werk je</b><br>Bij dit hoofdstuk horen drie korte filmpjes. Bekijk <b>video 10</b> voor 8.1, <b>video 12</b> voor 8.2 en <b>video 18</b> voor 8.3. Maak daarna de oefeningen.</div>`,
  sections:[
  { title:"8.1 Het datatype opvragen met type()", html:`<p>Elke waarde in Python heeft een <b>datatype</b>. Met de functie <code>type()</code> vraag je op welk datatype een waarde heeft:</p>
    <table><tr><th>Code</th><th>Python toont</th><th>Betekenis</th></tr>
    <tr><td><code>print(type(15))</code></td><td><code>&lt;class 'int'&gt;</code></td><td>geheel getal</td></tr>
    <tr><td><code>print(type(1.5))</code></td><td><code>&lt;class 'float'&gt;</code></td><td>kommagetal</td></tr>
    <tr><td><code>print(type("15"))</code></td><td><code>&lt;class 'str'&gt;</code></td><td>string (tekst)</td></tr></table>
    <p style="margin-top:10px">Let op: <code>"15"</code> tussen aanhalingstekens is een <b>string</b>, geen getal! In Python heet het datatype string kortweg <b>str</b>.</p>
    <p>Je kunt ook het datatype van een expressie opvragen. Weet je nog? Een deling geeft altijd een float.</p>`,
    items:[
    {id:"h8-try1", type:"play", q:"Voer uit en bekijk het datatype van elke waarde.", starter:'print(type(15))\nprint(type(1.5))\nprint(type("15"))\nprint(type(3 * 4))\nprint(type(7 / 2))'},
    {id:"h8-match1", type:"match", q:"Welk datatype hoort bij welke waarde?", pairs:[["42","int"],["\"42\"","str"],["4.2","float"],["10 / 5","float (want een deling)"]]},
    {id:"h8-mc1", type:"mc", q:"Wat toont <code>print(type(&quot;3.14&quot;))</code>?", options:["<class 'float'>","<class 'str'>","<class 'int'>"], correct:1, explain:"De aanhalingstekens maken er een string van, ook al staan er cijfers in."},
    {id:"h8-mc2", type:"mc", q:"Welk datatype geeft <code>input()</code> altijd terug?", options:["int","float","str"], correct:2, explain:"input() geeft altijd een string (str), wat de gebruiker ook typt."}
  ]},
  { title:"8.2 Een getal omzetten naar tekst met str()", html:`<p>In hoofdstuk 7 zag je dat het plusteken twee dingen kan doen: bij getallen <b>optellen</b>, bij strings <b>plakken</b>. Maar wat als je een string en een getal wilt combineren?</p>
    <pre>saldo = 123
print("Je saldo is " + saldo + " euro")</pre>
    <p>Dat lukt niet: Python geeft een <b>TypeError</b>. Het weet niet of het moet optellen of plakken. De oplossing is de functie <code>str()</code>: die zet een getal om naar een <b>string</b>, zodat je het kunt plakken.</p>
    <pre>saldo = 123
print("Je saldo is " + str(saldo) + " euro")</pre>
    <p><code>str()</code> verandert de variabele zelf niet: <code>saldo</code> blijft het getal 123, waarmee je verder kunt rekenen.</p>`,
    items:[
    {id:"h8-try2", type:"play", q:"Voer uit en bekijk de foutmelding. Verbeter daarna de code met str() en voer opnieuw uit.", starter:'saldo = 123\nprint("Je saldo is " + saldo + " euro")'},
    {id:"h8-mc3", type:"mc", q:"Welke foutmelding krijg je als je een string en een getal aan elkaar plakt met +?", options:["SyntaxError","TypeError","NameError"], correct:1, explain:"Een TypeError: je gebruikt + met twee verschillende datatypes."},
    {id:"h8-fill1", type:"fill", q:"Wat toont <code>print(&quot;Level &quot; + str(5))</code>?", answers:["Level 5"], explain:"str(5) wordt de string \"5\", en die wordt aan \"Level \" geplakt."},
    {id:"h8-code1", type:"code", q:"Verbeter het programma met <code>str()</code>, zodat het <b>Ik ben 15 jaar</b> toont. Laat de eerste regel staan zoals hij is.", starter:'leeftijd = 15\nprint("Ik ben " + leeftijd + " jaar")',
      expect:["Ik ben 15 jaar"], must:[[/leeftijd\s*=\s*15\b/,"Laat de eerste regel leeftijd = 15 staan."],[/(^|[^a-z_])str\(\s*leeftijd\s*\)/,"Gebruik str(leeftijd) om het getal om te zetten naar tekst."]],
      hint:'leeftijd = 15\nprint("Ik ben " + str(leeftijd) + " jaar")', ok:"Juist! Met str() kun je een getal in een zin plakken."}
  ]},
  { title:"8.3 Kommagetallen omzetten met float()", html:`<p><code>float()</code> is de ‘tweelingbroer’ van <code>int()</code>. Het zet een string om naar een <b>kommagetal</b> (float):</p>
    <pre>getal = float("3.14")</pre>
    <p>Dat is handig bij <code>input()</code>: wil je dat de gebruiker een kommagetal kan intypen, zoals een prijs, gebruik dan <code>float(input(...))</code>. Met <code>int()</code> zou dat een foutmelding geven.</p>
    <p><code>float()</code> werkt ook op gehele getallen: <code>float(5)</code> wordt <code>5.0</code>.</p>
    <div class="box warm"><b>Let op: een punt, geen komma!</b><br><code>float("3.5")</code> werkt, maar <code>float("3,5")</code> geeft een <b>ValueError</b>. Ook de gebruiker moet dus een punt typen.</div>`,
    items:[
    {id:"h8-try3", type:"play", q:"Voer uit met 2.5. Probeer daarna eens 2,5 (met een komma) in het vak Invoer.", starter:'prijs = float(input("Wat kost één stuk? "))\nprint(prijs * 2)', stdin:"2.5"},
    {id:"h8-fill2", type:"fill", q:"Wat toont <code>print(float(5))</code>?", answers:["5.0"], explain:"float() maakt van het gehele getal 5 het kommagetal 5.0."},
    {id:"h8-mc4", type:"mc", q:"De gebruiker moet een prijs zoals 4.99 kunnen intypen. Wat gebruik je?", options:["int(input(...))","float(input(...))","str(input(...))"], correct:1, explain:"int() kan alleen gehele getallen omzetten. Voor kommagetallen gebruik je float()."},
    {id:"h8-mc5", type:"mc", q:"Wat gebeurt er bij <code>float(&quot;3,5&quot;)</code>?", options:["Python geeft 3.5","Python geeft een foutmelding (ValueError)","Python geeft 35.0"], correct:1, explain:"Python gebruikt een punt als decimaalteken. Met een komma lukt de omzetting niet."}
  ]},
  { title:"8.4 Overzicht: de conversiefuncties", html:`<p>Je kent nu drie functies om een waarde om te zetten naar een ander datatype. Zo’n functie heet een <b>conversiefunctie</b>.</p>
    <table><tr><th>Functie</th><th>Zet om naar</th><th>Voorbeeld</th></tr>
    <tr><td><code>int()</code></td><td>geheel getal</td><td><code>int("15")</code> → <code>15</code></td></tr>
    <tr><td><code>float()</code></td><td>kommagetal</td><td><code>float("2.5")</code> → <code>2.5</code></td></tr>
    <tr><td><code>str()</code></td><td>string (tekst)</td><td><code>str(15)</code> → <code>"15"</code></td></tr></table>`,
    items:[
    {id:"h8-match2", type:"match", q:"Welke functie heb je nodig?", pairs:[["Een getal in een zin plakken met +","str()"],["De gebruiker typt een geheel getal","int()"],["De gebruiker typt een kommagetal","float()"],["Het datatype van een waarde opvragen","type()"]]}
  ]},
  { title:"8.5 Oefeningen", html:`<p>Ook hier test <b>✓ Controleer</b> je programma met verschillende antwoorden.</p>`, items:[
    {id:"h8-code2", type:"code", q:"Schrijf een programma dat vraagt hoe oud de gebruiker is, en toont hoe oud hij volgend jaar is, in een volledige zin. Typt de gebruiker <b>15</b>, dan toont het: <b>Volgend jaar ben je 16 jaar.</b>", starter:"",
      tests:[{inputs:["15"],last:"Volgend jaar ben je 16 jaar."},{inputs:["9"],last:"Volgend jaar ben je 10 jaar."}],
      must:[[/(^|[^a-z_])int\(/,"Zet het antwoord om naar een getal met int(), zodat je er 1 kunt bijtellen."],[/(^|[^a-z_])str\(/,"Gebruik str() om het getal in de zin te plakken."]], stdin:"15",
      hint:'leeftijd = int(input("Hoe oud ben je? "))\nprint("Volgend jaar ben je " + str(leeftijd + 1) + " jaar.")', ok:"Juist! Je gebruikte int() om te rekenen en str() om te plakken."},
    {id:"h8-code3", type:"code", q:"Schrijf een programma dat de <b>prijs van één stuk</b> vraagt (dat mag een kommagetal zijn) en het <b>aantal stuks</b> (een geheel getal), en dan de totale prijs toont. Toon alleen de uitkomst.", starter:"",
      tests:[{inputs:["2.5","4"],last:"10.0"},{inputs:["1.5","3"],last:"4.5"}],
      must:[[/(^|[^a-z_])float\(/,"De prijs kan een kommagetal zijn: gebruik float()."]], stdin:"2.5\n4",
      hint:'prijs = float(input("Prijs van één stuk? "))\naantal = int(input("Aantal stuks? "))\nprint(prijs * aantal)', ok:"Juist! Met float() kan de gebruiker ook kommagetallen intypen."},
    {id:"h8-code4", type:"code", q:"Uitdaging: maak het programma van de vorige oefening af met een mooie zin. Bij prijs <b>2.5</b> en aantal <b>4</b> toont het: <b>Je betaalt 10.0 euro.</b>", starter:"",
      tests:[{inputs:["2.5","4"],last:"Je betaalt 10.0 euro."},{inputs:["1.5","3"],last:"Je betaalt 4.5 euro."}],
      must:[[/(^|[^a-z_])float\(/,"De prijs kan een kommagetal zijn: gebruik float()."],[/(^|[^a-z_])str\(/,"Gebruik str() om de uitkomst in de zin te plakken."]], stdin:"2.5\n4",
      hint:'prijs = float(input("Prijs van één stuk? "))\naantal = int(input("Aantal stuks? "))\ntotaal = prijs * aantal\nprint("Je betaalt " + str(totaal) + " euro.")', ok:"Knap! Je combineerde int(), float() en str() in één programma."}
  ]},
