<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Python-toets</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#dde2ea;
  --brand:#1f4e79; --brand-soft:#e3edf7; --accent:#d66028;
  --ok:#1e7a46; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe7e5; --warn-soft:#fff3e3;
  --code-bg:#f1f3f6; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
    --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
    --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
    --code-bg:#262c37;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d222b; --ink:#e7eaf0; --muted:#a2abbb; --line:#323947;
  --brand:#8cb8e6; --brand-soft:#22344a; --accent:#f08a55;
  --ok:#6fd39b; --ok-soft:#1c3427; --bad:#ff9a90; --bad-soft:#3d2020; --warn-soft:#3a2d1c;
  --code-bg:#262c37;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;color:var(--brand);flex:1;min-width:160px;cursor:pointer}
.top button.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);cursor:pointer}
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px}
h2{color:var(--brand);font-size:24px;margin:4px 0 6px;line-height:1.25}
h3{color:var(--brand);font-size:19px;margin:0 0 8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.box{border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--brand-soft)}
.box.warm{background:var(--warn-soft)}
.box b:first-child{color:var(--brand)}
code,pre{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:14.5px}
code{background:var(--code-bg);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft)}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:var(--card);text-decoration:none}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.hint{background:var(--warn-soft);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.fb.info{display:block;background:var(--brand-soft);color:var(--ink)}
.fb .ex{color:var(--ink);margin-top:6px}
.out{white-space:pre-wrap;background:#0f1720;color:#d6e2f0;border-radius:8px;padding:10px 12px;margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;display:none;max-height:300px;overflow:auto}
.out .errl{color:#ffb4a8}
.ed{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);overflow:hidden}
.ed:focus-within{border-color:var(--brand)}
.plakmelding{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,520px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:15px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.plakmelding.toon{opacity:1}
.gut{padding:10px 8px 10px 10px;text-align:right;color:var(--muted);user-select:none;min-width:2.6em;white-space:pre;overflow:hidden;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;border-right:1px solid var(--line)}
.ed textarea{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px;min-height:140px;resize:vertical;white-space:pre;overflow:auto;font:14.5px/1.55 ui-monospace,Consolas,"DejaVu Sans Mono",monospace;tab-size:4;outline:none}
.stdin{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--brand-soft);display:none}
.stdin textarea{width:100%;min-height:56px;font:14px ui-monospace,Consolas,monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{margin-top:5px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.step{border-left:4px solid var(--line);padding-left:14px}
.step.done{border-left-color:var(--ok)}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--accent)}
.hintbox b{color:var(--accent)}
.score{font-size:44px;font-weight:700;color:var(--brand);line-height:1}
.line{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.line span:last-child{margin-left:auto;white-space:nowrap;font-weight:600}
.exlist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);padding:12px 14px;border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;margin:8px 0}
.exlist button:hover:not(:disabled){border-color:var(--brand)}
.exlist button:disabled{opacity:.55;cursor:default}
.exlist .t{flex:1;font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--accent)}
.pill.off{background:var(--line);color:var(--muted)}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.formrow label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.flow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;text-align:center}
.flow img{max-width:100%;height:auto}
.wereld{margin:12px 0}
.stage.blad{background:var(--card);padding:6px;outline:none}
.stage.speel{box-shadow:0 0 0 3px var(--brand-soft)}
.stage.speel.focus{box-shadow:0 0 0 3px var(--brand)}
.video{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px;margin:4px 0 14px}
.vthumb{position:relative;flex:none;width:220px;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:9px;overflow:hidden;cursor:pointer;background:#000}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;inset:0;margin:auto;width:52px;height:38px;border-radius:10px;background:#d33a2c;color:#fff;font-size:18px;display:grid;place-items:center}
.vthumb:hover .vplay{background:#b22a1e}
.vframe{flex:1 1 100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vinfo{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.vinfo span{color:var(--muted)}
.vinfo a{color:var(--brand);font-weight:600;font-size:14px}
.kleintje{font-size:14px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){ .tgrid{grid-template-columns:1fr} }
.stage{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#cfe8f7;min-height:120px}
.sits{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:14px}
.sits span{font-weight:700;color:var(--muted)}
.sits button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.sits button.aan{background:var(--brand);color:var(--card);border-color:var(--brand)}
table.api{margin:10px 0;font-size:14.5px}
table.api code{word-break:break-word}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;font-size:15.5px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 12px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button.aan{color:var(--brand);border-bottom-color:var(--brand)}
.tel{font-size:12.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 8px;white-space:nowrap}
.voortgang{margin:0 0 14px}
.vg-tekst{font-size:14px;color:var(--muted);margin-bottom:5px}
.vg-balk{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.vg-balk div{height:100%;background:var(--ok);border-radius:999px}
details.hfd{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}
details.hfd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:700}
details.hfd summary::-webkit-details-marker{display:none}
details.hfd summary::after{content:"▾";margin-left:6px;color:var(--muted);transition:transform .15s}
details.hfd:not([open]) summary::after{transform:rotate(-90deg)}
.hfd-nr{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--card);display:grid;place-items:center;font-size:15px}
.hfd-t{flex:1}
details.hfd .exlist{padding:0 12px 6px}
details.hfd .exlist button{margin:0 0 8px;padding:10px 12px}
.w-intro{margin:0 0 12px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wtegel{border:1px solid var(--line);border-top:5px solid var(--wk);border-radius:12px;padding:12px;background:var(--card)}
.w-kop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.w-icoon{font-size:30px;line-height:1}
.w-kop>div{flex:1}
.w-naam{font-weight:800;color:var(--ink)}
.w-sub{font-size:13px;color:var(--muted)}
.w-levels{display:flex;flex-direction:column;gap:6px}
.lvl-lus{font-size:11.5px;font-weight:600;color:#6a4fb3;background:#efeafd;border-radius:999px;padding:1px 8px;white-space:nowrap}
.lvl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.lvl:hover{border-color:var(--wk)}
.lvl-nr{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card);border:2px solid var(--wk);color:var(--wk)}
.lvl.verstuurd .lvl-nr{background:var(--ok);border-color:var(--ok);color:var(--card)}
.lvl.klaar .lvl-nr,.lvl.bezig .lvl-nr{background:var(--warn-soft);border-color:var(--accent);color:var(--accent)}
.lvl-t{flex:1;font-weight:600}
.lvl-c{font-size:12.5px;font-weight:700;color:var(--ok)}
.lvl-c.mid{color:var(--accent)}
details.afspraken-kaart summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:17px}
@media (max-width:640px){ .wgrid{grid-template-columns:1fr} .tabs button{font-size:14.5px;padding:8px 8px} }
.card{scroll-margin-top:72px}
.delen-uitleg{margin:0 0 16px;padding:12px 16px;border-radius:10px;background:var(--brand-soft);font-size:15px}
.beeld{margin:12px 0 4px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.beeld svg{display:block;width:100%;height:auto}
select.mist,input.mist{border:2px solid var(--bad);background:var(--bad-soft)}
ul.stijl{margin:6px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
ul.stijl li{margin:3px 0}
details.afspraken{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--card)}
details.afspraken summary{cursor:pointer;font-weight:700;color:var(--brand)}
.afspr{font-size:15px}
.afspr li{margin:6px 0}
.afspr .ok,.afspr .nok{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;padding:1px 6px;border-radius:5px;margin:2px 4px 0 0}
.afspr .ok{background:var(--ok-soft);color:var(--ok)}
.afspr .nok{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
@media (max-width:560px){ h2{font-size:21px} .card{padding:14px} }
/* Stroomdiagrammen */
.flowblok{margin-top:12px}
.fl-teken{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;overflow-x:auto}
.fl-zij{display:flex;flex-direction:column;gap:14px}
.fl-uitleg{font-size:14px;color:var(--muted);margin-bottom:8px}
.fl-lijst{display:flex;flex-direction:column;gap:6px}
.fl-knoop{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card)}
.fl-knoop.ruit{border-color:#e3a49c}
.fl-rij{display:flex;gap:6px;align-items:center}
.fl-rij select,.fl-vak select{flex:1 1 0;width:0;min-width:0;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.fl-vorm{font-weight:700;color:var(--brand);white-space:nowrap}
.fl-k{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;width:30px;height:30px;cursor:pointer;font:inherit}
.fl-k:disabled{opacity:.35;cursor:default}
.fl-takken{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fl-tak{min-width:0;border-left:3px solid var(--line);padding-left:6px}
.fl-tk{font-size:12px;font-weight:700;margin-bottom:4px}
.fl-tk.ja{color:var(--ok)} .fl-tk.nee{color:var(--bad)}
.fl-add{display:flex;gap:6px;flex-wrap:wrap}
.fl-add .btn{padding:5px 10px;font-size:13px}
.fl-vak{display:flex;gap:10px;align-items:center;margin:8px 0}
.fl-vraag{margin:14px 0}
.fl-st{display:none;margin-top:8px}
.fl-legende{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}
.fl-lg{display:flex;gap:8px;align-items:center;font-size:14px}
.fl-lg span{color:var(--muted)}
.top a.editor{text-decoration:none;color:var(--card);background:var(--accent);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
/* Variabelen-uitleg */
.varles{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--card)}
.vl-kies{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;margin-bottom:10px}
.vl-kies button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;font:inherit;font-size:14px}
.vl-kies button.aan{background:var(--brand);color:var(--card);border-color:var(--brand)}
.vl-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){ .vl-grid{grid-template-columns:1fr} }
.vl-code{background:var(--code-bg);border-radius:8px;padding:8px 0;font-family:ui-monospace,Consolas,monospace;font-size:14px;overflow-x:auto}
.vl-r{display:flex;gap:10px;padding:1px 10px;white-space:pre;border-left:4px solid transparent}
.vl-r .nr{color:var(--muted);min-width:14px;text-align:right;user-select:none}
.vl-r.nu{background:var(--brand-soft);border-left-color:var(--brand)}
.vl-r mark{background:#ffd76a;color:#1d2433;border-radius:3px;padding:0 2px}
.vl-mem{display:flex;flex-direction:column;gap:10px}
.vl-kop{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vl-doos{display:flex;align-items:stretch;border:2px solid var(--brand);border-radius:8px;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
.vl-doos .naam{background:var(--brand);color:var(--card);padding:6px 10px;font-weight:700}
.vl-doos .waarde{padding:6px 12px;font-size:18px;font-weight:800;min-width:60px}
.vl-doos.leeg{border-style:dashed;opacity:.55}
.vl-doos.kijk{box-shadow:0 0 0 4px #ffd76a}
.vl-hand{font-family:ui-monospace,Consolas,monospace;font-size:15px}
.vl-haven{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:12px;text-align:center}
.vl-haven div{border-bottom:3px solid #2f6fae;padding:2px 0;min-height:44px;display:flex;flex-direction:column;justify-content:flex-end;line-height:1.2}
.vl-haven div span{color:var(--muted);font-size:11px}
.vl-uitleg{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--brand-soft);font-size:15px}
.vl-knoppen{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.vl-knoppen .tel{color:var(--muted);font-size:14px}
.hoofdtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.hoofdtabs button{font:inherit;font-weight:800;font-size:18px;padding:12px 14px;border-radius:var(--radius);border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hoofdtabs button span{font-size:13px;font-weight:600;color:var(--muted)}
.hoofdtabs button.aan{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.th-lessen{display:flex;flex-direction:column;gap:10px}
.th-les{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.th-les>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.th-dozen{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.th-dozen>div{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.th-regel{margin:10px 0;display:inline-flex;flex-direction:column;gap:4px}
.th-regel code{font-size:20px;padding:6px 12px}
.th-regel div{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.th-regel .n{color:#1f6fd1} .th-regel .is{color:var(--accent)} .th-regel .w{color:var(--ok)}
.th-quiz{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.th-kop{margin:22px 4px 10px}
.dt-dozen{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.dt-doos{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.dt-type{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-weight:800;border-radius:6px;padding:1px 8px;color:#fff}
.dt-int{background:#1f6fd1} .dt-float{background:#2a8a4a} .dt-str{background:#c05621} .dt-bool{background:#7a4cc2}
.dt-doos .vl-doos .naam{min-width:52px;text-align:center}
.dt-doos.int .vl-doos{border-color:#1f6fd1} .dt-doos.int .naam{background:#1f6fd1}
.dt-doos.float .vl-doos{border-color:#2a8a4a} .dt-doos.float .naam{background:#2a8a4a}
.dt-doos.str .vl-doos{border-color:#c05621} .dt-doos.str .naam{background:#c05621}
.dt-doos.bool .vl-doos{border-color:#7a4cc2} .dt-doos.bool .naam{background:#7a4cc2}
.dt-tabel{overflow-x:auto;margin:10px 0}
.dt-tabel table{min-width:560px;font-size:14.5px}
.th-koppel{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;margin:8px 0;max-width:420px}

let W_ANIM=0;
/* tekenblad bestuurbaar maken met de pijltjestoetsen */
function toetsenAan(stage,sc,log,out){
  const MAP={ArrowUp:"Up",ArrowDown:"Down",ArrowLeft:"Left",ArrowRight:"Right"," ":"space",Spacebar:"space"};
  stage.tabIndex=0; stage.classList.add("speel"); stage.focus({preventScroll:true});
  let bezig=false, huidig=log;
  stage.onkeydown=async e=>{ const k=MAP[e.key]; if(!k) return; e.preventDefault(); if(bezig) return; bezig=true;
    const r=await runToets(k); bezig=false; if(!r) return;
    if(r.err){ toonUit(out,{out:r.out,err:r.err}); stage.onkeydown=null; stage.classList.remove("speel"); return }
    if(r.wereld){ huidig=r.wereld.log; W_ANIM++; stage.innerHTML=WERELDEN.tekenen.render(sc,{n:huidig.length,log:huidig}) } };
  stage.onblur=()=>stage.classList.remove("focus"); stage.onfocus=()=>stage.classList.add("focus");
}
function speelWereld(stage,wid,sc,log,uitslag){
  const W=WERELDEN[wid]; const fr=W.frames(sc,log||[]); const id=++W_ANIM;
  if(uitslag) fr[fr.length-1]={...fr[fr.length-1],rand:uitslag};
  let i=0; const stap=()=>{ if(id!==W_ANIM) return; stage.innerHTML=W.render(sc,fr[i]); i++; if(i<fr.length) setTimeout(stap,55) };
  stap();
}

function havenDoel(sc,st,out){
  if(sc.teZwaar){ if(!/zwaar/i.test(out)) return "Deze container is te zwaar. Laat hem staan en toon met print() een melding met het woord ‘zwaar’."; return null }
  if(!st.gepakt&&/zwaar/i.test(out)) return `Deze container is niet te zwaar: de kraan kan tot en met ${sc.max} ton tillen.`;
  if(!st.gepakt) return "De kraan heeft de container nog niet opgepakt. Gebruik kraan.pak().";
  if(st.geplaatst==null) return "De container hangt nog aan de kraan. Zet hem neer met kraan.zet().";
  if(st.geplaatst!==sc.doel) return `De container staat op het schip op vak ${st.geplaatst}, maar hij moest naar ${sc.doelNaam} op vak ${sc.doel}.`;
  return null }
function stationDoel(sc,st,out){
  if(!st.vertrokken) return "De trein is niet vertrokken. Vergeet trein.rijd() niet.";
  if(st.spoor!==sc.doel) return `De trein reed naar spoor ${st.spoor} (${sc.sporen[st.spoor]}), maar moest naar spoor ${sc.doel} (${sc.sporen[sc.doel]}).`;
  if(sc.lengte!=null && !bevat(out,[sc.lengte],0.01)) return `De trein reed juist, maar ik vind de lengte van de trein (${sc.lengte} meter) niet in je uitvoer.`;
  return null }
function magazijnDoel(sc,st,out){
  if(st.bak==null) return "Het pakje ligt nog op de robot. Leg het in een bak met robot.leg().";
  if(st.bak!==sc.doel) return `Het pakje ligt in bak ${st.bak} (${sc.labels[st.bak]}), maar het moest in bak ${sc.doel} (${sc.labels[sc.doel]}).`;
  if(sc.kosten!=null && !bevat(out,[sc.kosten],0.01)) return `Het pakje ligt in de juiste bak, maar ik vind de verzendkosten (${sc.kosten} euro) niet in je uitvoer.`;
  return null }
function verkeerDoel(sc,st,out){
  if(sc.licht){
    if(!st.actie) return "De auto doet niets. Gebruik auto.rijd() of auto.stop().";
    if(sc.licht==="groen"&&st.actie!=="rijd") return "Het licht is groen: de auto mag doorrijden.";
    if(sc.licht!=="groen"&&st.actie==="rijd") return `De auto reed door het ${sc.licht==="rood"?"rode":"oranje"} licht!`;
    return null }
  if(st.actie!=="rijd") return "De auto vertrekt niet. Vergeet auto.rijd() niet.";
  if(sc.bord){ if(st.snelheid!==sc.bord) return `De auto rijdt ${st.snelheid} km/u, maar het bord zegt ${sc.bord} km/u.`; return null }
  const bereik=sc.brandstof*sc.km_per_liter, nodig=bereik<sc.afstand;
  if(st.getankt&&!nodig) return `Je tankte, maar met ${bereik} km bereik kom je al ${sc.afstand} km ver: tanken was niet nodig.`;
  if(!bevat(out,[bereik],0.01)) return `De auto kwam aan, maar ik vind het bereik (${bereik} km) niet in je uitvoer.`;
  return null }

/* ---------------- Stroomdiagrammen: tekenen, vervolledigen en zelf opstellen ---------------- */
/* Een stroomdiagram is een lijst knopen: {t:"actie",tekst,code} of {t:"keuze",tekst,code,ja:[…],nee:[…]}.
   Een knoop met vak:"A" is een leeg vak dat de leerling invult. */
const FL={bw:240,bh:52,dw:350,dh:110,gap:30,ow:120,oh:40};
let FL_ID=0;
const flLeeg=()=>({l:0,r:0,h:0});
function flMaat(lijst){ let l=0,r=0,h=0; lijst.forEach((n,i)=>{ const m=flKnoopMaat(n); l=Math.max(l,m.l); r=Math.max(r,m.r); h+=m.h+(i?FL.gap:0) }); return {l,r,h} }
function flKnoopMaat(n){ if(n.t!=="keuze") return {l:FL.bw/2,r:FL.bw/2,h:FL.bh};
  const a=n.ja.length?flMaat(n.ja):flLeeg(), b=n.nee.length?flMaat(n.nee):flLeeg();
  const offL=Math.max(FL.dw/2,a.r+18), offR=Math.max(FL.dw/2,b.l+18);
  return {l:Math.max(FL.dw/2,offL+a.l), r:Math.max(FL.dw/2,offR+b.r), h:FL.dh+FL.gap+Math.max(a.h,b.h)+FL.gap, offL, offR, a, b} }
function flSvg(lijst){
  const id="fl"+(++FL_ID), m=flMaat(lijst), W=Math.max(m.l,FL.ow/2)+Math.max(m.r,FL.ow/2)+40, cx=Math.max(m.l,FL.ow/2)+20;
  const o=[], pijl=(x1,y1,x2,y2)=>o.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1d2433" stroke-width="2" marker-end="url(#${id})"/>`),
    lijn=pts=>o.push(`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#1d2433" stroke-width="2"/>`);
  const tekst=(n,x,y,max)=>{ if(n.vak&&!n.tekst) return `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8494">Vak ${esc(n.vak)}</text>`;
    if(!n.tekst) return `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" fill="#7a8494">— kies —</text>`;
    const v=n.vak?`<text x="${x-max/2+6}" y="${y-12}" font-size="10" font-weight="700" fill="#6b4fa0">${esc(n.vak)}</text>`:"";
    return v+`<text x="${x}" y="${y-3}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2433">${esc(n.tekst)}</text>`+(n.code?`<text x="${x}" y="${y+15}" text-anchor="middle" font-size="11.5" font-family="ui-monospace,Consolas,monospace" fill="#1d2433">${esc(n.code)}</text>`:"") };
  const leeg=n=>n.vak&&!n.tekst, rand=n=>leeg(n)?`stroke="#6b4fa0" stroke-width="2" stroke-dasharray="6 4"`:`stroke="#1d2433" stroke-width="2"`;
  function knoop(n,x,y){
    if(n.t!=="keuze"){ o.push(`<rect x="${x-FL.bw/2}" y="${y}" width="${FL.bw}" height="${FL.bh}" fill="${leeg(n)?"#f4f0fb":"#eaf1f9"}" ${rand(n)}/>`+tekst(n,x,y+FL.bh/2,FL.bw)); return y+FL.bh }
    const mt=flKnoopMaat(n), ym=y+FL.dh/2, xl=x-mt.offL, xr=x+mt.offR, y2=y+FL.dh+FL.gap, yM=y2+Math.max(mt.a.h,mt.b.h)+FL.gap;
    o.push(`<polygon points="${x},${y} ${x+FL.dw/2},${ym} ${x},${y+FL.dh} ${x-FL.dw/2},${ym}" fill="${leeg(n)?"#f4f0fb":"#fde8e6"}" ${rand(n)}/>`+tekst(n,x,ym,FL.dw*0.6));
    o.push(`<text x="${x-FL.dw/2-6}" y="${ym-8}" text-anchor="end" font-size="12" font-weight="700" fill="#1e7a46">True</text><text x="${x+FL.dw/2+6}" y="${ym-8}" font-size="12" font-weight="700" fill="#b3261e">False</text>`);
    [[n.ja,xl,x-FL.dw/2],[n.nee,xr,x+FL.dw/2]].forEach(([tak,bx,hoek])=>{
      if(!tak.length){ lijn([[hoek,ym],[bx,ym],[bx,yM],[x,yM]]); return }
      lijn([[hoek,ym],[bx,ym],[bx,y2-2]]); pijl(bx,y2-14,bx,y2);
      const eind=reeks(tak,bx,y2); lijn([[bx,eind],[bx,yM],[x,yM]]) });
    return yM }
  function reeks(l,x,y){ l.forEach((n,i)=>{ if(i){ pijl(x,y,x,y+FL.gap); y+=FL.gap } y=knoop(n,x,y) }); return y }
  let y=10; o.push(`<rect x="${cx-FL.ow/2}" y="${y}" width="${FL.ow}" height="${FL.oh}" rx="20" fill="#e6f4ec" stroke="#1d2433" stroke-width="2"/><text x="${cx}" y="${y+25}" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2433">Start</text>`);
  y+=FL.oh; pijl(cx,y,cx,y+FL.gap); y+=FL.gap; y=reeks(lijst,cx,y); pijl(cx,y,cx,y+FL.gap); y+=FL.gap;
  o.push(`<rect x="${cx-FL.ow/2}" y="${y}" width="${FL.ow}" height="${FL.oh}" rx="20" fill="#fde8e6" stroke="#1d2433" stroke-width="2"/><text x="${cx}" y="${y+25}" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2433">Stop</text>`);
  const H=y+FL.oh+10;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stroomdiagram" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto;font-family:system-ui,sans-serif"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2433"/></marker></defs><rect width="${W}" height="${H}" fill="#fff"/>${o.join("")}</svg>` }

/* Van wat de leerling koos naar een volledig stroomdiagram */
function flBoom(d,m){
  if(d.flow==="vervolledig"){ const V=m.vak||{};
    const zet=l=>l.map(n=>{ let k={...n}; if(n.vak){ const lijst=n.t==="keuze"?d.vragen:d.acties, i=V[n.vak]; k={...k,...(i!=null&&lijst[i]?lijst[i]:{tekst:"",code:""})} }
      if(n.t==="keuze") k={...k,ja:zet(n.ja),nee:zet(n.nee)}; return k });
    return zet(d.boom) }
  const zet=l=>(l||[]).map(n=>{ const p=(n.t==="keuze"?d.vragen:d.acties)[n.k]||{tekst:"",code:""};
    return n.t==="keuze"?{t:"keuze",tekst:p.tekst,code:p.code,ja:zet(n.ja),nee:zet(n.nee),open:n.k==null}:{t:"actie",tekst:p.tekst,code:p.code,open:n.k==null} });
  return zet(m.stappen) }
/* Van stroomdiagram naar Python (een ruit die alleen in een False-tak staat, wordt elif) */
function flCode(boom,kop){
  const r=[]; const blok=(l,ins)=>{ if(!l.length){ r.push(ins+"pass"); return } l.forEach(n=>keuze(n,ins,"if")) };
  function keuze(n,ins,woord){ if(n.t!=="keuze"){ r.push(ins+n.code); return }
    r.push(`${ins}${woord} ${n.code}:`); blok(n.ja,ins+"    ");
    if(n.nee.length===1&&n.nee[0].t==="keuze") keuze(n.nee[0],ins,"elif");
    else if(n.nee.length){ r.push(ins+"else:"); blok(n.nee,ins+"    ") } }
  boom.forEach(n=>keuze(n,"","if"));
  return "# "+(S.naam||"Naam")+"\n"+(kop?kop+"\n\n":"")+r.join("\n")+"\n" }
const flTel=(l,t)=>l.reduce((s,n)=>s+(n.t===t?1:0)+(n.t==="keuze"?flTel(n.ja,t)+flTel(n.nee,t):0),0);
const flOpen=l=>l.some(n=>(n.vak&&!n.tekst)||n.open||(n.t==="keuze"&&(flOpen(n.ja)||flOpen(n.nee))));
function flModel(json){ try{ return JSON.parse(json||"{}")||{} }catch(e){ return {} } }
/* Wat moet er nog gebeuren voor je kunt controleren? (kost geen poging) */
function flValideer(d,m){
  if(d.flow==="lezen") return (m.antw||[]).filter(x=>x!=null).length<d.vragen.length?"Beantwoord eerst alle vragen.":null;
  const b=flBoom(d,m);
  if(d.flow==="vervolledig") return flOpen(b)?"Vul eerst alle vakken in.":null;
  if(!b.length) return "Je stroomdiagram is nog leeg. Voeg vakken toe met de knoppen.";
  if(flOpen(b)) return "Kies in elk vak wat de "+(d.wie||"machine")+" moet doen.";
  return null }

async function nakijkenFlow(json,d){
  const m=flModel(json);
  if(d.flow==="lezen"){ const A=m.antw||[], fout=d.vragen.map((v,i)=>A[i]===v.juist?0:i+1).filter(x=>x);
    if(fout.length) return {ok:false,msg:`${fout.length===1?"Vraag "+fout[0]+" klopt":"Vragen "+fout.join(", ")+" kloppen"} nog niet. Volg de pijlen nog eens met je vinger, van Start tot Stop.`};
    return {ok:true,msg:d.ok} }
  const boom=flBoom(d,m);
  if(d.minKeuzes&&flTel(boom,"keuze")<d.minKeuzes) return {ok:false,msg:d.keuzeTip||`Je stroomdiagram heeft minstens ${d.minKeuzes} ${d.minKeuzes===1?"ruit":"ruiten"} nodig.`};
  const code=flCode(boom,d.kop); let laatste=null;
  for(let i=0;i<d.scenarios.length;i++){ const sc=d.scenarios[i];
    const r=await runPython(code,sc.invoer||[],true,{sc}); const w=r.wereld||{log:[],staat:{}}, wat=`In situatie ${i+1} (${sc.naam})`;
    const anim={i,sc,log:w.log,uitslag:"fout"};
    if(r.err) return {ok:false,anim,msg:`${wat} loopt het mis: ${r.err.type==="WereldFout"?r.err.text:"het stroomdiagram kan zo niet uitgevoerd worden."}`};
    const f=d.doel(sc,w.staat||{},r.out||"",null);
    if(f) return {ok:false,anim,msg:`${wat}: ${f}`+(sc.tip?" "+sc.tip:"")};
    laatste={i,sc,log:w.log,uitslag:"ok"} }
  return {ok:true,anim:laatste,msg:d.ok} }

/* Het invulblok onder een stroomdiagram-opdracht. Zelfde aanpak als codeBlok: geeft een element met vergrendel(). */
function flowBlok(d,{waarde,onCode,controleer,uitvoeren}){
  let m=flModel(waarde), slot=false;
  const wrap=$(`<div class="flowblok"></div>`);
  const tek=$(`<div class="fl-teken"></div>`), werk=$(`<div class="fl-werk"></div>`);
  const out=$(`<div class="out" style="display:none"></div>`), st=$(`<div class="fl-st"></div>`);
  const act=$(`<div class="actions">${uitvoeren?'<button class="btn secondary run">▶ Uitvoeren</button>':""}${controleer?'<button class="btn chk">✓ Controleer</button>':""}</div>`);
  const bewaar=()=>{ onCode(JSON.stringify(m)); teken() };
  const teken=()=>{ tek.innerHTML=flSvg(d.flow==="lezen"?d.boom:flBoom(d,m)) };
  const melding=t=>{ st.className="fb info fl-st"; st.textContent=t; st.style.display=t?"block":"none" };
  const opties=(lijst,gekozen)=>`<option value="">— kies —</option>`+lijst.map((p,i)=>`<option value="${i}" ${gekozen===i?"selected":""}>${esc(p.tekst)}</option>`).join("");

  function bouwLezen(){ werk.innerHTML=""; m.antw=m.antw||[];
    d.vragen.forEach((v,i)=>{ const q=$(`<div class="fl-vraag"><b>${i+1}. ${esc(v.q)}</b></div>`);
      v.opties.forEach((t,j)=>{ const o=$(`<label class="opt"><input type="radio" name="flv${FL_ID}_${i}" value="${j}" ${m.antw[i]===j?"checked":""}><span>${esc(t)}</span></label>`);
        o.querySelector("input").onchange=()=>{ m.antw[i]=j; bewaar(); melding("") }; q.appendChild(o) });
      werk.appendChild(q) }) }
  function vakken(l,acc){ l.forEach(n=>{ if(n.vak) acc.push(n); if(n.t==="keuze"){ vakken(n.ja,acc); vakken(n.nee,acc) } }); return acc }
  function bouwVervolledig(){ werk.innerHTML=""; m.vak=m.vak||{};
    vakken(d.boom,[]).sort((a,b)=>a.vak.localeCompare(b.vak)).forEach(n=>{ const ruit=n.t==="keuze";
      const r=$(`<label class="fl-vak"><span class="fl-vorm">${ruit?"◇":"▭"} Vak ${esc(n.vak)}</span><select>${opties(ruit?d.vragen:d.acties,m.vak[n.vak])}</select></label>`);
      r.querySelector("select").onchange=e=>{ m.vak[n.vak]=e.target.value===""?null:+e.target.value; bewaar(); melding("") };
      werk.appendChild(r) }) }
  function bouwOpstellen(){ werk.innerHTML=""; m.stappen=m.stappen||[];
    werk.appendChild($(`<div class="fl-uitleg">Bouw je stroomdiagram van boven naar onder. Start en Stop staan er al. Een <b>ruit</b> krijgt een True-tak en een False-tak.</div>`));
    werk.appendChild(lijstEl(m.stappen,0)) }
  function lijstEl(l,diepte){ const box=$(`<div class="fl-lijst"></div>`);
    l.forEach((n,i)=>{ const ruit=n.t==="keuze";
      const rij=$(`<div class="fl-knoop ${ruit?"ruit":""}"><div class="fl-rij"><span class="fl-vorm" title="${ruit?"Ruit: een vraag":"Rechthoek: een actie"}">${ruit?"◇":"▭"}</span><select>${opties(ruit?d.vragen:d.acties,n.k)}</select><button type="button" class="fl-k" title="Hoger">↑</button><button type="button" class="fl-k" title="Lager">↓</button><button type="button" class="fl-k" title="Weg">✕</button></div></div>`);
      const [op,neer,weg]=rij.querySelectorAll(".fl-k");
      rij.querySelector("select").onchange=e=>{ n.k=e.target.value===""?null:+e.target.value; bewaar(); melding("") };
      op.disabled=i===0; neer.disabled=i===l.length-1;
      op.onclick=()=>{ [l[i-1],l[i]]=[l[i],l[i-1]]; bewaar(); bouw() };
      neer.onclick=()=>{ [l[i+1],l[i]]=[l[i],l[i+1]]; bewaar(); bouw() };
      weg.onclick=()=>{ l.splice(i,1); bewaar(); bouw() };
      if(ruit){ const t=$(`<div class="fl-takken"><div class="fl-tak"><div class="fl-tk ja">True</div></div><div class="fl-tak"><div class="fl-tk nee">False</div></div></div>`);
        const [tj,tn]=t.querySelectorAll(".fl-tak"); tj.appendChild(lijstEl(n.ja,diepte+1)); tn.appendChild(lijstEl(n.nee,diepte+1)); rij.appendChild(t) }
      box.appendChild(rij) });
    const knop=$(`<div class="fl-add"><button type="button" class="btn secondary">+ ▭ Actie</button>${diepte<2?'<button type="button" class="btn secondary">+ ◇ Keuze</button>':""}</div>`);
    const [ka,kk]=knop.querySelectorAll("button");
    ka.onclick=()=>{ l.push({t:"actie",k:null}); bewaar(); bouw() };
    if(kk) kk.onclick=()=>{ l.push({t:"keuze",k:null,ja:[],nee:[]}); bewaar(); bouw() };

function friendlyError(raw){

  if(/^WereldFout: /.test(last)) return {line:ln,text:last.slice(12),type:"WereldFout",uitleg:null};
  if(/OneindigeLus: /.test(last)) return {line:null,text:"Je programma bleef maar uitvoer tonen en werd gestopt.",uitleg:"Zit je in een oneindige lus? Controleer of de voorwaarde van je while-lus ooit onwaar wordt: verandert de teller in de lus?",type:"OneindigeLus"};

const PY_KEYWORDS=new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const OPS=["**=","//=",">>=","<<=","**","//","==","!=","<=",">=","+=","-=","*=","/=","%=","->","<<",">>",":=","+","-","*","/","%","=","<",">","(",")","[","]","{","}",",",":",".",";","@","&","|","^","~","!"];
const BINAIR=new Set(["+","-","*","/","//","%","**","=","==","!=","<",">","<=",">=","+=","-=","*=","/=","//=","%=","**="]);
function tokenize(code){
  const toks=[]; let i=0; const n=code.length;
  const reStr=/(?:[rRbBuUfF]|[rR][bBfF]|[bBfF][rR])?(?:'''|"""|'|")/y;
  const reNaam=/[A-Za-z_\u00C0-\uFFFF][\w\u00C0-\uFFFF]*/y;
  const reGetal=/(?:0[xXoObB][\da-fA-F_]+|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?[jJ]?)/y;
  while(i<n){
    const ch=code[i];
    if(ch===" "||ch==="\t"||ch==="\r"){i++;continue}
    if(ch==="\n"){toks.push({t:"nl",v:"\n",s:i,e:i+1});i++;continue}
    if(ch==="\\"&&(code[i+1]==="\n"||code[i+1]==="\r")){i+=2;continue}
    if(ch==="#"){let j=code.indexOf("\n",i); if(j<0)j=n; toks.push({t:"comment",v:code.slice(i,j).replace(/\r$/,""),s:i,e:j}); i=j; continue}
    reStr.lastIndex=i; let m=reStr.exec(code);
    if(m){ const q=m[0].replace(/^[a-zA-Z]+/,""), pre=m[0].length-q.length; let j=i+m[0].length, dicht=false;
      while(j<n){ if(code[j]==="\\"){j+=2;continue} if(code.startsWith(q,j)){j+=q.length;dicht=true;break} if(q.length===1&&code[j]==="\n")break; j++ }
      j=Math.min(j,n); const v=code.slice(i,j);
      toks.push({t:"str",v,s:i,e:j,inhoud:v.slice(pre+q.length, dicht?v.length-q.length:v.length)}); i=j; continue }
    reGetal.lastIndex=i;
    if(/\d/.test(ch)||(ch==="."&&/\d/.test(code[i+1]||""))){ m=reGetal.exec(code); if(m){toks.push({t:"num",v:m[0],s:i,e:i+m[0].length}); i+=m[0].length; continue} }
    reNaam.lastIndex=i; m=reNaam.exec(code);
    if(m){toks.push({t:"name",v:m[0],s:i,e:i+m[0].length}); i+=m[0].length; continue}
    const op=OPS.find(o=>code.startsWith(o,i));
    if(op){toks.push({t:"op",v:op,s:i,e:i+op.length}); i+=op.length; continue}
    i++;
  }

}
/* Geeft een lijst {line, msg} met alles wat niet volgens de klasafspraken is. */
function klasafspraken(code,naam){
  code=code.replace(/\r/g,"");
  const fouten=[], gezien=new Set();
  const starts=[0]; for(let k=0;k<code.length;k++) if(code[k]==="\n") starts.push(k+1);
  const lijnVan=s=>{let lo=0,hi=starts.length-1; while(lo<hi){const mid=(lo+hi+1)>>1; if(starts[mid]<=s)lo=mid; else hi=mid-1} return lo+1};
  const add=(s,msg)=>{const line=typeof s==="number"?lijnVan(s):1, key=line+"|"+msg; if(!gezien.has(key)){gezien.add(key);fouten.push({line,msg})}};
  const regels=code.split("\n");
  const toks=tokenize(code);
  const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/\s+/g," ").trim();
  const isKlein=c=>c && c!==c.toUpperCase() && c===c.toLowerCase();

  /* Afspraak 1-3: commentaar */
  const comments=toks.filter(t=>t.t==="comment");
  if(!comments.length) fouten.push({line:1,msg:`Zet je naam als commentaar op de eerste regel: # ${naam}`});
  else { const tekst=comments[0].v.replace(/^#\s*/,"").trim();
    if(norm(tekst)!==norm(naam)){
      if(/voornaam\s+naam/i.test(tekst)) add(comments[0].s,`Vervang ‘Voornaam Naam’ door je eigen naam: # ${naam}`);
      else if(lijnVan(comments[0].s)>1) fouten.push({line:1,msg:`Zet je naam als commentaar op de eerste regel: # ${naam}`});
      else add(comments[0].s,`De eerste commentaarregel is altijd je naam: # ${naam}`) } }
  for(const c of comments){
    const body=c.v.slice(1); if(!body.trim()) continue;
    if(body[0]!==" ") add(c.s,"Zet een spatie na het #-teken: # Tekst");
    if(isKlein(body.trim()[0])) add(c.s,"Een commentaarregel begint met een hoofdletter.");
    const ln=lijnVan(c.s);
    if(ln>5 && regels[ln-1].trim().startsWith("#")){
      const vorige=(regels[ln-2]||"").trim();
      if(vorige!=="" && !vorige.startsWith("#")) add(c.s,"Zet een lege regel boven deze commentaarregel (zo spraken we af voor commentaar na regel 5).") } }

  /* Afspraak 8: na de import-regels komt een lege regel */
  const isImport=r=>/^\s*(import\s|from\s+\S+\s+import\s)/.test(r);
  regels.forEach((r,i)=>{ if(isImport(r)&&i+1<regels.length&&regels[i+1].trim()!==""&&!isImport(regels[i+1]))
    add(starts[i],"Na de regel met import komt altijd een lege regel.") });

  /* Afspraak 5-7: operatoren, haakjes en komma's */
  const st=toks.filter(t=>t.t!=="comment");
  const ws=c=>c===" "||c==="\t";
  let diepte=0;
  st.forEach((t,k)=>{
    if(t.t!=="op") return;
    const vorige=st[k-1];
    if(t.v==="("){
      if(vorige&&vorige.t==="name"&&!PY_KEYWORDS.has(vorige.v)&&vorige.e<t.s&&/^[ \t]+$/.test(code.slice(vorige.e,t.s)))
        add(t.s,`Geen spatie vóór het haakje: schrijf ${vorige.v}( en niet ${vorige.v} (`) }
    if("([{".includes(t.v)){diepte++;return}
    if(")]}".includes(t.v)){diepte=Math.max(0,diepte-1);return}
    if(t.v===","){
      if(ws(code[t.s-1])) add(t.s,"Geen spatie vóór een komma: print(\"Tekst\", naam, \".\")");
      const na=code[t.e]; if(na!==undefined && !/[ \t\n)\]}]/.test(na)) add(t.s,"Zet een spatie ná een komma: print(\"Tekst\", naam, \".\")");
      return }
    if(!BINAIR.has(t.v)) return;
    if((t.v==="-"||t.v==="+") && (!vorige||vorige.t==="nl"||(vorige.t==="op"&&!")]}".includes(vorige.v))||(vorige.t==="name"&&PY_KEYWORDS.has(vorige.v)&&!["True","False","None"].includes(vorige.v)))) return; // min-teken van een negatief getal
    if((t.v==="*"||t.v==="**") && vorige && vorige.t==="op" && "(,".includes(vorige.v)) return;
    if(t.v==="=" && diepte>0) return; // bv. sep="" of end=""
    const voor=code[t.s-1], na=code[t.e];
    const okVoor=voor===undefined||voor==="\n"||ws(voor), okNa=na===undefined||na==="\n"||ws(na);
    if(!okVoor||!okNa) add(t.s,`Zet een spatie vóór en ná ${t.v}`);
  });

  /* Afspraak 4: zinnen in print() en input() */
  st.forEach((t,k)=>{
    if(t.t!=="name"||(t.v!=="print"&&t.v!=="input")||!st[k+1]||st[k+1].v!=="(") return;
    let d=0, args=[[]];
    for(let j=k+1;j<st.length;j++){ const u=st[j];
      if(u.t==="op"&&"([{".includes(u.v)){d++; if(d===1) continue}
      else if(u.t==="op"&&")]}".includes(u.v)){d--; if(d===0) break}
      if(u.t==="nl") continue;
      if(d===1&&u.t==="op"&&u.v===","){args.push([]);continue}
      args[args.length-1].push(u) }
    args=args.filter(a=>a.length && !(a[0].t==="name"&&a[1]&&a[1].v==="="));
    if(!args.length) return;
    const heeftZin=args.flat().some(u=>u.t==="str"&&/[A-Za-zÀ-ÿ]/.test(u.inhoud.replace(/\{[^}]*\}/g,"")));
    if(!heeftZin) return;
    const eerste=args[0][0];
    if(eerste.t==="str"){ const c=eerste.inhoud.replace(/^(\s|\\[nt])+/,""); if(c[0]!=="{"&&isKlein(c[0])) add(eerste.s,`De zin bij ${t.v}() begint met een hoofdletter.`) }
    const laatste=args[args.length-1], lt=laatste[laatste.length-1];
    if(lt.t==="str"){ const c=lt.inhoud.replace(/(\s|\\[nt])+$/,""); if(!/[.!?:;…]$/.test(c)) add(lt.s,`De zin bij ${t.v}() eindigt met een leesteken (. ! ? of :).`) }

  });
  return fouten.sort((a,b)=>a.line-b.line);
}

function formLink(waarden){
  const [basis,query]=FORM_URL.split("?"); if(!query) return null;
  let gevonden=0;
  const delen=query.split("&").map(p=>{ const i=p.indexOf("="); if(i<0) return p;
    const k=p.slice(0,i); let v; try{v=decodeURIComponent(p.slice(i+1).replace(/\+/g," "))}catch(e){return p}
    let quote=false; if(/^".*"$/.test(v)){v=v.slice(1,-1);quote=true}
    // Vergeeft kleine tikfouten in het sleutelwoord (bv. LEERLIN of CONTROLECODE)
    const ruw=v.trim().toUpperCase().replace(/[^A-Z]/g,"");
    const sleutel=(ruw in waarden)?ruw:Object.keys(waarden).find(k=>ruw.length>=4&&(k.startsWith(ruw)||ruw.startsWith(k)));
    if(sleutel){ gevonden++; const w=String(waarden[sleutel]); return k+"="+encodeURIComponent(quote?'"'+w+'"':w) }
    return p });
  return {url:basis+"?"+delen.join("&"), gevonden};
}

  const c1=maakC1(zaad("C1"));

    opdracht:`<p>Dit station heeft <b>vier</b> sporen en <b>drie</b> wissels. ${INH?"De wissels liggen <b>na elkaar</b>: wissel 1 stuurt de trein naar onder (spoor D) of naar boven, verder naar wissel 2. Wissel 2 stuurt naar onder (spoor C) of naar boven, verder naar wissel 3. Wissel 3 stuurt naar boven (spoor A) of naar onder (spoor B).":"Wissel 1 stuurt de trein naar boven of naar onder. Op het bovenste spoor ligt <b>wissel 3</b>, op het onderste spoor <b>wissel 2</b>."}</p>
    <ul>${["A","B","C","D"].map(k=>`<li>Spoor ${k} → <b>${sp[k]==="Alle andere"?"alle andere bestemmingen":esc(sp[k])}</b></li>`).join("")}</ul>
    <p>Bekijk de tekening om te zien welke wissels de trein naar elk spoor brengen. De computer test ook treinen naar bestemmingen die hierboven niet genoemd worden.</p>`});
  const c3=maakC3(zaad("C3"));
  items.push({id:"C3", nr:"C3", deel:"C", type:"code", punten:2, titel:"De slimme thermostaat", d:c3.d, api:API_THERMO,
    opdracht:`<p>In een klaslokaal hangt een slimme thermostaat. Hij meet de temperatuur en kan de verwarming aanzetten of het raam openen. Programmeer de thermostaat:</p>

  let ci=0; items.forEach(it=>{ if(it.deel==="C") it.nr="C"+(++ci) });

}
const MAX_PUNTEN=()=>ITEMS.reduce((s,it)=>s+it.punten,0);

/* ---------------- Opslag ---------------- */
let S=null;
function leegS(){ return {naam:"",klas:"",gestart:null,deadline:null,slot:null,incidenten:[],kort:[],antw:{},code:{},flow:{},sit:{},huidig:0,ingediend:null,resultaat:null,verstuurd:null,test:false} }
try{ S=JSON.parse(localStorage.getItem(OPSLAG)) }catch(e){}
if(!S||typeof S!=="object") S=leegS();
S=Object.assign(leegS(),S);
function save(){ try{ localStorage.setItem(OPSLAG,JSON.stringify(S)) }catch(e){} }
const nu=()=>new Date();
const uur=d=>new Date(d).toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

/* ---------------- Bewaking: volledig scherm, focus, kopiëren ---------------- */
let bewaking=false, focusTimer=null;
const inVeld=t=>t&&t.closest&&!!t.closest("textarea,input,select");
function volledigScherm(){
  const el=document.documentElement;
  const p=el.requestFullscreen?el.requestFullscreen({navigationUI:"hide"}):Promise.reject(new Error("geen fullscreen"));
  return p.then(()=>{ try{ if(navigator.keyboard&&navigator.keyboard.lock) navigator.keyboard.lock().catch(()=>{}) }catch(e){} });
}
function stopVolledigScherm(){ try{ if(navigator.keyboard&&navigator.keyboard.unlock) navigator.keyboard.unlock() }catch(e){} if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{}) }
function startBewaking(){ setTimeout(()=>{ if(!S.slot&&!S.ingediend) bewaking=true },400) }
function incident(wat){
  if(!bewaking||S.ingediend) return;
  clearTimeout(focusTimer);
  if(S.slot){ if(!S.slot.redenen.includes(wat)){ S.slot.redenen.push(wat); save(); toonSlot() } return }
  S.slot={tijd:nu().toISOString(),redenen:[wat]};
  S.incidenten.push({tijd:S.slot.tijd,wat});
  save(); bewaking=false; toonSlot();
}
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement) incident("Volledig scherm verlaten") });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) incident("Ander tabblad of venster geopend") });
window.addEventListener("blur",()=>{ if(!bewaking) return; const t0=Date.now(); clearTimeout(focusTimer);
  focusTimer=setTimeout(()=>{ if(!document.hasFocus()) incident("Ander venster of programma gebruikt") },TOETS.focusMarge);
  const terug=()=>{ window.removeEventListener("focus",terug); const ms=Date.now()-t0; if(ms<TOETS.focusMarge&&bewaking){ clearTimeout(focusTimer); S.kort.push({tijd:new Date(t0).toISOString(),ms}); save() } };
  window.addEventListener("focus",terug) });
window.addEventListener("pagehide",()=>incident("Pagina herladen of gesloten"));
window.addEventListener("beforeunload",e=>{ if(S.gestart&&!S.ingediend){ e.preventDefault(); e.returnValue="" } });
["copy","cut"].forEach(ev=>document.addEventListener(ev,e=>{ if(S.gestart&&!S.ingediend&&!inVeld(e.target)) e.preventDefault() },true));
document.addEventListener("contextmenu",e=>{ if(S.gestart&&!S.ingediend) e.preventDefault() },true);
document.addEventListener("selectstart",e=>{ if(S.gestart&&!S.ingediend&&!inVeld(e.target)) e.preventDefault() },true);
document.addEventListener("dragstart",e=>{ if(S.gestart&&!S.ingediend) e.preventDefault() },true);
document.addEventListener("keydown",e=>{
  if(!S.gestart||S.ingediend) return;
  const k=(e.key||"").toLowerCase(), ctrl=e.ctrlKey||e.metaKey;
  const blok=e.key==="F12"||(ctrl&&e.shiftKey&&["i","j","c","k"].includes(k))||(ctrl&&["p","s","u","o","f","g","h","j","d","n","t","w","l"].includes(k))||(e.altKey&&["arrowleft","arrowright","home"].includes(k))||e.key==="F5"||e.key==="BrowserBack";
  if(blok||(ctrl&&["c","x","a"].includes(k)&&!inVeld(e.target))){ e.preventDefault(); e.stopPropagation() }
},true);
document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"&&S.gestart&&!S.ingediend){ try{ navigator.clipboard.writeText("Schermafbeeldingen zijn niet toegestaan tijdens de toets.").catch(()=>{}) }catch(x){} incident("Print Screen ingedrukt") } },true);

/* ---------------- Watermerk ---------------- */
function watermerk(){
  if(!TOETS.watermerk) return;
  let w=document.getElementById("watermerk"); if(!w){ w=document.createElement("div"); w.id="watermerk"; document.body.appendChild(w) }
  const t=`${S.test?"TEST · ":""}${S.naam} · ${S.klas} · ${new Date(S.gestart||Date.now()).toLocaleDateString("nl-BE")}`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200"><text x="20" y="120" transform="rotate(-22 210 100)" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1d2433">${svgTxt(t)}</text></svg>`;
  w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
}

/* ---------------- Slot-scherm ---------------- */
function toonSlot(){
  let o=document.getElementById("slot"); document.body.classList.toggle("vergrendeld",!!S.slot);
  if(!S.slot){ if(o) o.remove(); return }
  if(!o){ o=document.createElement("div"); o.id="slot"; document.body.appendChild(o) }
  const n=S.incidenten.length;
  o.innerHTML=`<div class="slotkaart"><div style="font-size:44px">🔒</div><h2>Je toets is vergrendeld</h2>
    <p>${S.slot.redenen.map(esc).join(", ")} om <b>${uur(S.slot.tijd)}</b>.<br>Dit is onderbreking <b>${n}</b>. Je leerkracht ziet dit in je resultaat.</p>
    <p><b>Steek je hand op en wacht op je leerkracht.</b> Je tijd loopt verder.</p>
    <div class="formrow" style="justify-content:center"><label>Code van de leerkracht<input type="password" id="lkcode" autocomplete="off" style="width:180px"></label><button class="btn" id="ontgrendel">Ontgrendel en ga verder</button></div>
    <div class="fb" id="slotfb"></div>
    <details style="margin-top:14px;text-align:left;font-size:14px"><summary>Voor de leerkracht</summary>
      <p style="margin:8px 0">Alle onderbrekingen:</p><ol style="margin:0 0 8px">${S.incidenten.map(i=>`<li>${uur(i.tijd)} – ${esc(i.wat)}</li>`).join("")}</ol>
      <button class="btn reset" id="wissen" style="background:var(--bad);color:#fff">Toets volledig wissen (met de leerkrachtcode)</button></details></div>`;
  const code=()=>o.querySelector("#lkcode").value.trim(), fb=o.querySelector("#slotfb");
  o.querySelector("#ontgrendel").onclick=()=>{
    if(code()!==TOETS.leerkrachtcode){ fb.className="fb bad"; fb.textContent="Die code klopt niet."; return }
    const laatste=S.incidenten[S.incidenten.length-1]; if(laatste) laatste.ontgrendeld=nu().toISOString();
    volledigScherm().then(()=>{ S.slot=null; save(); toonSlot(); startBewaking(); render() })
      .catch(()=>{ fb.className="fb bad"; fb.textContent="Volledig scherm lukt niet. Probeer opnieuw." }) };
  o.querySelector("#lkcode").onkeydown=e=>{ if(e.key==="Enter") o.querySelector("#ontgrendel").click() };
  o.querySelector("#wissen").onclick=()=>{ if(code()!==TOETS.leerkrachtcode){ fb.className="fb bad"; fb.textContent="Vul eerst de juiste leerkrachtcode in."; return }
    try{ localStorage.removeItem(OPSLAG) }catch(e){} bewaking=false; S=leegS(); stopVolledigScherm(); location.reload() };
  setTimeout(()=>{ const i=o.querySelector("#lkcode"); if(i) i.focus() },50);
}

/* ---------------- Klok ---------------- */
let klokTimer=null;
function klok(){
  const el=document.getElementById("klok"); if(!el||!S.deadline||S.ingediend) return;
  const rest=Math.max(0,Math.round((S.deadline-Date.now())/1000));
  el.textContent="⏱ "+Math.floor(rest/60)+":"+String(rest%60).padStart(2,"0");
  el.classList.toggle("bijna",rest<=300);
  if(rest<=0) indienen(true);
}

/* ---------------- Modaal venster (geen confirm(): dat zou het slot laten vallen) ---------------- */
function modaal(html,knoppen){
  return new Promise(res=>{ const m=document.createElement("div"); m.className="modaal";
    m.innerHTML=`<div class="modaalkaart">${html}<div class="actions" style="justify-content:flex-end;margin-top:16px"></div></div>`;
    const a=m.querySelector(".actions");
    knoppen.forEach(([tekst,waarde,klas])=>{ const b=document.createElement("button"); b.className="btn "+(klas||""); b.textContent=tekst; b.onclick=()=>{ m.remove(); res(waarde) }; a.appendChild(b) });
    document.body.appendChild(m) });
}

/* ---------------- Schermen ---------------- */
function kop(){
  const h=document.getElementById("kop");
  if(S.gestart&&!S.ingediend){
    h.innerHTML=`<h1>🔒 ${esc(TOETS.titel)}</h1>${S.test?'<span class="testbadge">🧪 Testmodus</span>':""}<span class="wie">👤 ${esc(S.naam)} (${esc(S.klas)})</span><span id="klok" class="klok"></span><button class="btn" id="indienen">Toets indienen</button>`;
    h.querySelector("#indienen").onclick=()=>indienen(false); klok();
  } else h.innerHTML=`<h1>🔒 ${esc(TOETS.titel)}</h1>`;
}
function render(){
  kop(); const m=document.getElementById("main"); m.innerHTML="";
  if(S.ingediend) return renderKlaar(m);
  if(!S.gestart) return renderStart(m);
  renderToets(m);
}

function renderStart(m){
  const klassen=Object.keys(KLASSEN);
  m.appendChild($(`<div class="card"><div class="kicker">Toets</div><h2>${esc(TOETS.titel)}</h2>
    <p>Je hebt <b>${TOETS.minuten} minuten</b>. De toets bestaat uit drie delen:</p>
    <ul><li><b>Deel A</b> – vragen over datatypes, omzetten en keuzes</li><li><b>Deel B</b> – stroomdiagrammen</li><li><b>Deel C</b> – programmeren in de programmeerwerelden</li></ul>
    <div class="box warm"><b>Afspraken tijdens de toets</b><ul style="margin:6px 0 0">

      <li>Kopiëren, plakken en rechtsklikken werken niet. Hulp en oplossingen zijn er niet.</li>

    <div class="formrow">
      <label>Klas${klassen.length?`<select id="klas"><option value="">— kies —</option>${klassen.map(k=>`<option ${S.klas===k?"selected":""}>${esc(k)}</option>`).join("")}</select>`:`<input type="text" id="klas" value="${esc(S.klas)}">`}</label>

  const klasEl=m.querySelector("#klas"), naamLabel=m.querySelector("#naamlabel");

    naamLabel.innerHTML="Voornaam en naam"+(lijst.length?`<select id="naam"><option value="">— kies je naam —</option>${lijst.map(n=>`<option ${n===oud?"selected":""}>${esc(n)}</option>`).join("")}</select>`:`<input type="text" id="naam" value="${esc(oud)}" autocomplete="off" style="min-width:240px">`) };
  klasEl.onchange=tekenNaam; tekenNaam();
  const fb=m.querySelector("#startfb");
  m.querySelector("#start").onclick=()=>{
    const klas=klasEl.value.trim(), naam=m.querySelector("#naam").value.replace(/\s+/g," ").trim(), code=m.querySelector("#startcode").value.trim();
    if(!klas||!naam){ fb.className="fb bad"; fb.textContent="Kies je klas en vul je voornaam en naam in."; return }
    if(naam.split(" ").length<2){ fb.className="fb bad"; fb.textContent="Vul je voornaam én je naam in."; return }
    const test=code===TOETS.leerkrachtcode;
    if(code!==TOETS.startcode&&!test){ fb.className="fb bad"; fb.textContent="De startcode klopt niet. Je leerkracht geeft de code bij de start van de toets."; return }
    volledigScherm().then(()=>{
      S.naam=naam; S.klas=klas; S.test=test; S.gestart=Date.now(); S.deadline=S.gestart+TOETS.minuten*60000; save();
      maakItems(); watermerk(); document.body.classList.add("toetsmodus"); startBewaking(); render();
      if(!worker) try{ startWorker() }catch(e){}
      clearInterval(klokTimer); klokTimer=setInterval(klok,1000);
    }).catch(()=>{ fb.className="fb bad"; fb.textContent="Volledig scherm lukt niet in deze browser. Gebruik Chrome, Edge of Opera, of roep je leerkracht." });
  };
}

/* status van een opgave: beantwoord of niet */
function beantwoord(it){
  if(it.type==="mc") return S.antw[it.id]!=null;
  if(it.type==="flowlees") return it.vragen.every((_,i)=>(S.antw[it.id]||{})[i]!=null);
  if(it.type==="flow"){ const m=flModel(S.flow[it.id]); return (m.stappen||[]).length>0 }
  if(it.type==="code"){ const c=S.code[it.id]; return c!=null&&c.trim()!==it.d.starter.trim() }
  return false }
function renderToets(m){
  if(!ITEMS.length) maakItems();
  const nav=$(`<div class="toetsnav"></div>`);
  ["A","B","C"].forEach(dl=>{ const g=$(`<div class="navgroep"><span>Deel ${dl}</span></div>`);
    ITEMS.forEach((it,i)=>{ if(it.deel!==dl) return; const b=$(`<button type="button" class="chip ${i===S.huidig?"aan":""} ${beantwoord(it)?"klaar":""}" title="${esc(it.titel)}">${it.nr}</button>`);
      b.onclick=()=>{ S.huidig=i; save(); render(); window.scrollTo(0,0) }; g.appendChild(b) });
    nav.appendChild(g) });
  m.appendChild(nav);
  if(S.huidig>=ITEMS.length) S.huidig=0;
  const it=ITEMS[S.huidig];
  const kicker=`Deel ${it.deel} · ${it.nr} · ${fmt(it.punten)} ${it.punten===1?"punt":"punten"}`;
  if(it.type==="mc") renderMC(m,it,kicker);
  else if(it.type==="flowlees") renderFlowLees(m,it,kicker);
  else if(it.type==="flow") renderFlow(m,it,kicker);
  else renderCode(m,it,kicker);
  const vorige=S.huidig>0, volgende=S.huidig<ITEMS.length-1;
  const onder=$(`<div class="actions" style="justify-content:space-between"><button class="btn secondary" ${vorige?"":"disabled"} id="vorige">← Vorige</button><button class="btn ${volgende?"secondary":""}" id="volgende">${volgende?"Volgende →":"Toets indienen"}</button></div>`);
  onder.querySelector("#vorige").onclick=()=>{ S.huidig--; save(); render(); window.scrollTo(0,0) };
  onder.querySelector("#volgende").onclick=()=>{ if(!volgende) return indienen(false); S.huidig++; save(); render(); window.scrollTo(0,0) };
  m.appendChild(onder);
}
function keuzes(naam,opties,gekozen,onKies){
  const box=$(`<div></div>`);
  opties.forEach(o=>{ const l=$(`<label class="opt"><input type="radio" name="${naam}" ${gekozen===o.k?"checked":""}><span class="${(/["=()]|^-?\d|^(True|False|int|float|str|bool)$/.test(o.t)&&!/^(De|Het|Een) /.test(o.t))?"mono":""}">${esc(o.t)}</span></label>`);
    l.querySelector("input").onchange=()=>onKies(o.k); box.appendChild(l) });
  return box }
function vernieuwNav(){ document.querySelectorAll(".toetsnav .chip").forEach((b,i)=>b.classList.toggle("klaar",beantwoord(ITEMS[i]))) }
function renderMC(m,it,kicker){
  const c=$(`<div class="card opgave"><div class="kicker">${kicker}</div><h3>${esc(it.titel)}</h3><p>${it.vraag}</p>${it.code?`<pre class="nocopy">${esc(it.code)}</pre>`:""}</div>`);
  c.appendChild(keuzes("mc_"+it.id,it.opties,S.antw[it.id],k=>{ S.antw[it.id]=k; save(); vernieuwNav() }));
  m.appendChild(c) }
function renderFlowLees(m,it,kicker){
  const c=$(`<div class="card opgave"><div class="kicker">${kicker}</div><h3>${esc(it.titel)}</h3>${it.opdracht}<div class="flow">${flSvg(it.boom)}</div></div>`);
  const A=S.antw[it.id]||(S.antw[it.id]={});
  it.vragen.forEach((q,i)=>{ const v=$(`<div class="fl-vraag" style="margin-top:14px"><b>${i+1}. ${q.q}</b></div>`);
    v.appendChild(keuzes(`fl_${it.id}_${i}`,q.opties,A[i],k=>{ A[i]=k; save(); vernieuwNav() })); c.appendChild(v) });
  m.appendChild(c) }
function wereldBlok(it,kaart){
  const d=it.d, wv=$(`<div class="wereld"><div class="sits"><span>Situatie:</span></div><div class="stage"></div></div>`); kaart.appendChild(wv);
  const stage=wv.querySelector(".stage"), sits=wv.querySelector(".sits");
  let sit=S.sit[it.id]||0; if(sit>=d.scenarios.length) sit=0;
  const kiesSit=i=>{ sit=i; S.sit[it.id]=i; save(); sits.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("aan",k===i)); toonWereld(stage,d.wereld,d.scenarios[i]) };
  d.scenarios.forEach((sc,i)=>{ const b=$(`<button type="button">${i+1}. ${esc(sc.naam)}</button>`); b.onclick=()=>kiesSit(i); sits.appendChild(b) });
  kiesSit(sit);
  return { stage, sc:()=>d.scenarios[sit] } }
async function voerUit(it,code,w,out){
  const sc=w.sc(), r=await runPython(code,[],true,{sc}), wr=r.wereld||{log:[],staat:{}};
  let uitslag=null, msg="";
  if(TOETS.uitvoerFeedback&&!r.err){ const f=it.d.doel(sc,wr.staat||{},r.out||""); uitslag=f?"fout":"ok"; msg=f?"🎯 "+f:"🎯 Gelukt in deze situatie!" }
  toonUit(out,{out:(r.out||"")+(msg?(r.out?"\n":"")+msg:""),err:r.err});
  try{ w.stage.scrollIntoView({behavior:"smooth",block:"center"}) }catch(e){}
  speelWereld(w.stage,it.d.wereld,sc,wr.log,uitslag) }
function laadStatus(knop,bezig){ knop.disabled=bezig; knop.textContent=bezig?(worker?"Bezig…":"Python wordt geladen…"):"▶ Uitvoeren" }
function renderFlow(m,it,kicker){
  const c=$(`<div class="card opgave"><div class="kicker">${kicker}</div><h3>${esc(it.titel)}</h3>${it.opdracht}${FL_VORMEN}</div>`);
  const w=wereldBlok(it,c);
  const blok=flowBlok(it.d,{waarde:S.flow[it.id], onCode:v=>{ S.flow[it.id]=v; save(); vernieuwNav() }, controleer:null,
    uitvoeren:async(code,out)=>voerUit(it,code,w,out)});
  c.appendChild(blok); m.appendChild(c) }
function renderCode(m,it,kicker){
  const c=$(`<div class="card opgave"><div class="kicker">${kicker}</div><h3>${esc(it.titel)}</h3>${it.opdracht}${it.api}
    <details class="afspraken"><summary>📏 Klasafspraken (klik om te openen)</summary><p style="margin:8px 0 0">Werkt je programma, dan kost elke overtreding ${fmt(TOETS.perAfspraak)} punt (maximaal ${fmt(TOETS.maxAfspraakPerOpdracht)} per opdracht).</p>${AFSPRAKEN_HTML}</details></div>`);
  if(it.d.console) return renderConsole(m,it,c);
  const w=wereldBlok(it,c);
  const ed=editor(S.code[it.id]??it.d.starter,v=>{ S.code[it.id]=v; save(); vernieuwNav() });
  const act=$(`<div class="actions"><button class="btn secondary run">▶ Uitvoeren</button><span style="color:var(--muted);font-size:14px">Probeer je code uit in de situatie die je kiest. Bij het indienen test de computer <b>alle</b> situaties.</span></div>`);
  const out=$(`<div class="out"></div>`);
  const knop=act.querySelector(".run");
  knop.onclick=async()=>{ laadStatus(knop,true); try{ await voerUit(it,ed.ta.value,w,out) }catch(e){ toonLaadFout(out,e) } laadStatus(knop,false) };
  c.append(ed,act,out); m.appendChild(c) }

function renderConsole(m,it,c){
  let inv;
  const ed=editor(S.code[it.id]??it.d.starter,v=>{ S.code[it.id]=v; save(); vernieuwNav(); inv.ververs() });
  inv=invoerVak(S.invoer&&S.invoer[it.id]||"",v=>{ (S.invoer||(S.invoer={}))[it.id]=v; save() },()=>ed.ta.value);
  const act=$(`<div class="actions"><button class="btn secondary run">▶ Uitvoeren</button><span style="color:var(--muted);font-size:14px">Bij het indienen probeert de computer je programma uit met <b>verschillende leeftijden</b>.</span></div>`);
  const out=$(`<div class="out"></div>`), knop=act.querySelector(".run");
  knop.onclick=async()=>{ laadStatus(knop,true);
    try{ const r=await runPython(ed.ta.value,inv.regels(),true); toonUit(out,r); try{ out.scrollIntoView({behavior:"smooth",block:"center"}) }catch(e){} }
    catch(e){ toonLaadFout(out,e) } laadStatus(knop,false) };
  c.append(ed,inv,act,out); m.appendChild(c); inv.ververs() }
async function draaiConsole(code,d){
  let ok=0; const det=[];
  for(const sc of d.scenarios){
    const r=await runPython(code,[String(sc.leeftijd)],false);
    if(r.err){ det.push(`✘ ${sc.naam}: foutmelding${r.err.line?" op regel "+r.err.line:""} (${r.err.text})`); continue }
    const f=d.doel(sc,r.out||"");
    if(f) det.push("✘ "+f); else { ok++; det.push(`✔ ${sc.naam}`) } }
  return {ok,n:d.scenarios.length,det} }

/* ---------------- Nakijken ---------------- */
const r2=x=>Math.round(x*100)/100;
async function draaiScenarios(code,d){
  let ok=0; const det=[];
  for(const sc of d.scenarios){
    let r; try{ r=await runPython(code,[],true,{sc}) }catch(e){ throw e }
    const w=r.wereld||{log:[],staat:{}};
    if(r.err&&r.err.type!=="WereldFout"){ det.push(`✘ ${sc.naam}: foutmelding${r.err.line?" op regel "+r.err.line:""} (${r.err.text})`); continue }
    if(r.err){ det.push(`✘ ${sc.naam}: ${r.err.text}`); continue }
    const f=d.doel(sc,w.staat||{},r.out||"");
    if(f) det.push(`✘ ${sc.naam}: ${f}`); else { ok++; det.push(`✔ ${sc.naam}`) } }
  return {ok,n:d.scenarios.length,det} }
async function nakijkItem(it){
  if(it.type==="mc"){ const g=S.antw[it.id]; const juist=g===it.juist;
    return {punten:juist?1:0, det:[g==null?"niet beantwoord":(juist?"✔ ":"✘ ")+"gekozen: "+(it.opties.find(o=>o.k===g)||{}).t+(juist?"":" · juist: "+(it.opties.find(o=>o.k===it.juist)||{}).t)]} }
  if(it.type==="flowlees"){ const A=S.antw[it.id]||{}; let p=0; const det=it.vragen.map((q,i)=>{ const j=A[i]===q.juist; if(j) p++; return `${j?"✔":"✘"} vraag ${i+1}${A[i]==null?" (niet beantwoord)":""}` }); return {punten:p,det} }
  if(it.type==="flow"){ const m=flModel(S.flow[it.id]), boom=flBoom(it.d,m);
    if(!boom.length) return {punten:0,det:["niet beantwoord"]};
    if(flOpen(boom)) return {punten:0,det:["niet alle vakken zijn ingevuld"],code:flCode(boom,it.d.kop)};
    const code=flCode(boom,it.d.kop);
    if(flTel(boom,"keuze")<it.d.minKeuzes) return {punten:0,det:["geen ruit in het stroomdiagram"],code};
    const s=await draaiScenarios(code,it.d); return {punten:r2(it.punten*s.ok/s.n),det:[`${s.ok}/${s.n} situaties juist`,...s.det],code} }
  const code=S.code[it.id]??it.d.starter;
  if(code.trim()===it.d.starter.trim()) return {punten:0,det:["niet beantwoord"],code};
  const s=it.d.console?await draaiConsole(code,it.d):await draaiScenarios(code,it.d);
  let p=it.punten*s.ok/s.n; const afspr=klasafspraken(code,S.naam); let aftrek=0;
  if(p>0&&TOETS.perAfspraak) aftrek=Math.min(TOETS.maxAfspraakPerOpdracht,afspr.length*TOETS.perAfspraak);
  p=Math.max(0,p-aftrek);
  const det=[`${s.ok}/${s.n} situaties juist`,...s.det]; if(afspr.length) det.push(`Klasafspraken: ${afspr.length} ${afspr.length===1?"overtreding":"overtredingen"}${aftrek?" (− "+fmt(aftrek)+")":""}: `+afspr.slice(0,5).map(a=>"regel "+a.line+": "+a.msg).join(" | "));
  return {punten:r2(p),det,code,afspraken:afspr.length} }

let bezigMetIndienen=false;
async function indienen(auto){
  if(S.ingediend||bezigMetIndienen) return;
  if(!auto){ const open=ITEMS.filter(it=>!beantwoord(it)).map(it=>it.nr);
    const ja=await modaal(`<h3>Toets indienen?</h3><p>${open.length?`Je hebt nog <b>niet alles beantwoord</b>: ${open.join(", ")}.`:"Je hebt alles beantwoord."}</p><p>Na het indienen kun je <b>niets meer wijzigen</b>.</p>`,[["Terug naar de toets",false,"secondary"],["Ja, indienen",true]]);
    if(!ja||S.ingediend) return }
  bezigMetIndienen=true; bewaking=false; clearTimeout(focusTimer); clearInterval(klokTimer);
  S.ingediend={tijd:nu().toISOString(),auto:!!auto}; S.slot=null; save(); toonSlot(); stopVolledigScherm();
  document.body.classList.remove("toetsmodus");
  const m=document.getElementById("main"); kop(); m.innerHTML=`<div class="card"><h2>Je toets wordt nagekeken…</h2><p>Even geduld. Sluit dit tabblad niet.</p></div>`;
  const res={items:{},totaal:0,max:MAX_PUNTEN(),fout:null};
  for(const it of ITEMS){ try{ res.items[it.id]=await nakijkItem(it) }catch(e){ res.items[it.id]={punten:0,det:["kon niet automatisch nagekeken worden"],code:S.code[it.id]||null,mislukt:true}; res.fout="Python kon niet geladen worden: sommige opdrachten zijn niet automatisch nagekeken." } }
  res.totaal=r2(ITEMS.reduce((s,it)=>s+(res.items[it.id].punten||0),0));
  S.resultaat=res; save(); bezigMetIndienen=false; render();
}

/* ---------------- Resultaat, verslag en versturen ---------------- */
const opTien=()=>r2(S.resultaat.totaal/S.resultaat.max*10);
function deelTotaal(dl){ const its=ITEMS.filter(it=>it.deel===dl); return [r2(its.reduce((s,it)=>s+S.resultaat.items[it.id].punten,0)),its.reduce((s,it)=>s+it.punten,0)] }
function verslagTekst(){
  const R=S.resultaat, L=[];
  L.push(`${TOETS.titel} (${TOETS.id})`,`Leerling: ${S.naam}`,`Klas: ${S.klas}`,`Gestart: ${new Date(S.gestart).toLocaleString("nl-BE")}`,`Ingediend: ${new Date(S.ingediend.tijd).toLocaleString("nl-BE")}${S.ingediend.auto?" (automatisch: tijd om)":""}`,
    `Score: ${fmt(R.totaal)} / ${R.max} (${fmt(opTien())} / 10)`,"");
  ["A","B","C"].forEach(dl=>{ const [p,mx]=deelTotaal(dl); L.push(`Deel ${dl}: ${fmt(p)} / ${mx}`) });
  L.push("",`Onderbrekingen: ${S.incidenten.length}`); S.incidenten.forEach(i=>L.push(`  ${uur(i.tijd)} – ${i.wat}${i.ontgrendeld?" (ontgrendeld om "+uur(i.ontgrendeld)+")":""}`));
  if(S.kort.length) L.push(`Kort focusverlies (< ${TOETS.focusMarge/1000} s, niet vergrendeld): ${S.kort.length} keer`);
  if(R.fout) L.push("","LET OP: "+R.fout);
  ITEMS.forEach(it=>{ const x=R.items[it.id]; L.push("",`===== ${it.nr} · ${it.titel} · ${fmt(x.punten)} / ${it.punten} =====`);
    if(it.type==="mc") L.push(it.code||"");
    x.det.forEach(d=>L.push("  "+d)); if(x.code) L.push("--- code ---",x.code.replace(/\s+$/,"")) });
  const t=L.join("\n"); return t+`\n\nControle: ${controleHash(t)}\n` }
function vormCode(){
  const R=S.resultaat, L=[];
  L.push(`${fmt(R.totaal)}/${R.max} | `+["A","B","C"].map(dl=>{ const [p,mx]=deelTotaal(dl); return `${dl} ${fmt(p)}/${mx}` }).join(" · ")+` | onderbrekingen: ${S.incidenten.length}${S.kort.length?" (+"+S.kort.length+" kort)":""}`);
  L.push(ITEMS.map(it=>`${it.nr} ${fmt(R.items[it.id].punten)}`).join(", "));
  S.incidenten.forEach(i=>L.push(`${uur(i.tijd)} ${i.wat}`));
  if(R.fout) L.push("NIET VOLLEDIG NAGEKEKEN");
  ITEMS.filter(it=>it.type==="code").forEach(it=>{ const c=(R.items[it.id].code||"").split("\n").filter(l=>!/^#\s/.test(l)&&l.trim()).join("\n"); L.push(`--- ${it.nr} ---`,c) });
  const t=L.join("\n"); return t.length>1500?t.slice(0,1480)+"\n…(ingekort)":t }
function download(naam,tekst){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([tekst],{type:"text/plain;charset=utf-8"})); a.download=naam; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },500) }
function renderKlaar(m){
  const R=S.resultaat; if(!R){ m.innerHTML=`<div class="card"><h2>Je toets wordt nagekeken…</h2></div>`; bezigMetIndienen=false; S.ingediend=null; save(); return indienen(true) }
  const afspr=ITEMS.reduce((s,it)=>s+(R.items[it.id].afspraken||0),0);
  m.appendChild($(`<div class="card"><div class="kicker">Klaar</div><h2>✔ Je toets is ingediend</h2>
    <p>Ingediend om <b>${uur(S.ingediend.tijd)}</b>${S.ingediend.auto?" (de tijd was om)":""}.</p>
    ${S.test?`<div class="box warm"><b>🧪 Testmodus</b> – dit resultaat wordt niet naar het Form gestuurd.</div>`:""}
    ${TOETS.toonScoreNaIndienen||S.test?`<div style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin:6px 0 10px"><span class="score">${fmt(R.totaal)}</span><span>op ${R.max}</span></div>`+["A","B","C"].map(dl=>{ const [p,mx]=deelTotaal(dl); return `<div class="line"><span>Deel ${dl}</span><span>${fmt(p)} / ${mx}</span></div>` }).join(""):""}
    ${R.fout?`<div class="fb bad">${esc(R.fout)} Verwittig je leerkracht.</div>`:""}
    ${S.test?`<details style="margin:10px 0"><summary><b>Details per opgave</b></summary>${ITEMS.map(it=>`<p style="margin:10px 0 2px"><b>${it.nr} · ${esc(it.titel)}: ${fmt(R.items[it.id].punten)} / ${it.punten}</b></p><div style="font-size:14px;color:var(--muted)">${R.items[it.id].det.map(esc).join("<br>")}</div>`).join("")}</details>`:""}
    <div class="box"><b>Nog één stap</b><br>Klik op <b>📤 Verstuur naar mijn leerkracht</b>. Het Form opent in een nieuw tabblad. Controleer of je naam erin staat en klik op <b>Verzenden</b>. Pas niets aan.</div>
    <div class="actions"><button class="btn" id="stuur">📤 Verstuur naar mijn leerkracht</button><button class="btn secondary" id="verslag">💾 Download mijn verslag</button>${S.test?'<button class="btn secondary" id="opnieuw">🔄 Opnieuw beginnen</button>':""}</div>
    <div class="fb" id="stuurfb"></div></div>`));
  const f=m.querySelector("#stuurfb");
  if(S.verstuurd){ f.className="fb ok"; f.innerHTML=`✔ Form geopend op ${esc(S.verstuurd)}. Vergeet niet op <b>Verzenden</b> te klikken in het Form.` }
  const opn=m.querySelector("#opnieuw"); if(opn) opn.onclick=()=>{ try{ localStorage.removeItem(OPSLAG) }catch(e){} location.reload() };
  m.querySelector("#verslag").onclick=()=>download(`Toets ${S.klas} ${S.naam}.txt`.replace(/[\\/:*?"<>|]/g,"_"),verslagTekst());
  m.querySelector("#stuur").onclick=()=>{
    const c=opTien();
    const waarden={LEERLING:S.naam,KLAS:S.klas,OEFENING:TOETS.titel,CIJFER:fmt(c),POGINGEN:S.incidenten.length,HULP:0,AFSPRAKEN:afspr,CONTROLE:controleCode(S.naam,S.klas,TOETS.titel,c),CODE:vormCode()};
    if(!FORM_URL||S.test){ f.className="fb info"; f.innerHTML="<b>Testmodus:</b> er wordt niets verstuurd. Dit zou in het Form komen:<pre style='white-space:pre-wrap'>"+esc(JSON.stringify(waarden,null,1))+"</pre>"; return }
    const l=formLink(waarden); if(!l||!l.gevonden){ f.className="fb bad"; f.textContent="De link naar het Form is niet goed ingesteld. Verwittig je leerkracht."; return }
    window.open(l.url,"_blank","noopener");
    S.verstuurd=nu().toLocaleString("nl-BE",{dateStyle:"short",timeStyle:"short"}); save();
    f.className="fb ok"; f.innerHTML="✔ Het Form opent in een nieuw tabblad. Klik daar op <b>Verzenden</b>." };
}

/* ---------------- Opstarten ---------------- */
(function(){
  let th=null; try{ th=localStorage.getItem("python-oefeningen-v1-theme") }catch(e){} if(th) document.documentElement.dataset.theme=th;
  if(S.gestart){ maakItems(); watermerk() }
  if(S.gestart&&!S.ingediend){
    document.body.classList.add("toetsmodus");
    if(!S.slot){ bewaking=true; incident("Pagina herladen of opnieuw geopend") }
    clearInterval(klokTimer); klokTimer=setInterval(klok,1000);
  }
  render(); toonSlot();
})();

</script>
